<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Lumi">
  <!-- marca oficial da Lumi: quadrado gradiente + faísca ✦ ("sua luz na tela") -->
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e8bff"/>
      <stop offset="1" stop-color="#8a3ffc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.34" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="20" y="20" width="984" height="984" rx="220" fill="url(#lg)"/>
  <rect x="20" y="20" width="984" height="984" rx="220" fill="url(#glow)"/>
  <!-- faísca principal (curvas quadráticas com controle no centro) -->
  <path fill="#ffffff" d="M481 236 Q481 543 788 543 Q481 543 481 850 Q481 543 174 543 Q481 543 481 236 Z"/>
  <!-- faísca companheira -->
  <path fill="#ffffff" fill-opacity="0.95" d="M758 148 Q758 266 876 266 Q758 266 758 384 Q758 266 640 266 Q758 266 758 148 Z"/>
</svg>

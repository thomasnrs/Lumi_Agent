<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Workspace</title>
    <style>
      * { box-sizing: border-box; }
      :root {
        --bg: #16161e; --surface: #24242f; --surface-2: #0f0f16;
        --accent: #7aa2ff; --accent-text: #fff; --text: #eee; --border: #2a2a38;
      }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #top {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }
      #top .path { flex: 1; font-size: 12px; color: #9aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #top button {
        border: 1px solid var(--border);
        border-radius: 7px;
        background: transparent;
        color: color-mix(in srgb, var(--text) 85%, transparent);
        padding: 5px 11px;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s, color 0.12s;
      }
      #top button:hover {
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
        color: var(--text);
      }
      #save {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      #save:hover { background: color-mix(in srgb, var(--accent) 85%, #fff); color: var(--accent-text); }
      #toggleChat.on, #toggleTerm.on {
        background: color-mix(in srgb, var(--accent) 22%, transparent);
        border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
        color: var(--text);
      }
      #main { flex: 1; display: flex; min-height: 0; }
      #side {
        width: 250px; flex: 0 0 auto; display: flex; flex-direction: column;
        background: var(--surface-2); border-right: 1px solid var(--border);
      }
      #sidebar {
        display: flex; align-items: center; gap: 2px; padding: 5px 8px;
        border-bottom: 1px solid var(--border); font-size: 11px; color: #9aa; text-transform: uppercase; letter-spacing: 0.3px;
      }
      /* o título encolhe com reticências — os botões NUNCA estouram a largura do painel */
      #sidebar .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #sidebar .tb {
        width: 24px; height: 24px; border: none; background: transparent; color: #9aa; cursor: pointer;
        border-radius: 5px; display: flex; align-items: center; justify-content: center; position: relative; flex: 0 0 auto;
      }
      #sidebar .tb:hover { background: var(--surface); color: var(--text); }
      #sidebar .tb svg { width: 15px; height: 15px; }
      #sidebar .tsep { width: 1px; height: 16px; background: var(--border); margin: 0 3px; flex: 0 0 auto; }
      /* par de views (explorador ⇄ git): o ativo fica aceso */
      #sidebar .tb.viewon { color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
      /* badge de alterações pendentes no botão do git */
      .tb .bdg {
        position: absolute; top: -3px; right: -4px; background: var(--accent); color: var(--accent-text, #fff);
        font-size: 8.5px; font-weight: 700; line-height: 1; padding: 2px 4px; border-radius: 7px; display: none; pointer-events: none;
      }
      .tb .bdg.on { display: block; }
      #tree { flex: 1; overflow: auto; padding: 4px 0; font-size: 13px; }
      .item {
        display: flex; align-items: center; gap: 4px; padding: 2px 8px; cursor: pointer;
        white-space: nowrap; overflow: hidden; user-select: none; height: 24px;
      }
      .item:hover { background: var(--surface); }
      .item.active { background: color-mix(in srgb, var(--accent) 22%, transparent); }
      .item.drop-target { background: color-mix(in srgb, var(--accent) 38%, transparent); outline: 1px dashed var(--accent); outline-offset: -2px; }
      .item.dragging { opacity: 0.45; }
      #tree.drop-root { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 6px; }
      .item .chev { width: 14px; height: 14px; flex: 0 0 auto; color: #889; display: flex; align-items: center; justify-content: center; transition: transform 0.12s; }
      .item .chev.open { transform: rotate(90deg); }
      .item .chev svg { width: 12px; height: 12px; }
      .item .ic { width: 16px; height: 16px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
      .item .ic svg { width: 15px; height: 15px; }
      .item.dir .ic { color: var(--accent); }
      .item:not(.dir) .ic { color: #8fa3b8; }
      .item .nm { overflow: hidden; text-overflow: ellipsis; }
      /* ---- controle de fontes (painel git) ---- */
      #gitview { flex: 1; display: none; flex-direction: column; overflow: hidden; font-size: 13px; }
      #gitCommitBox { padding: 8px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
      #gitBranchRow { display: flex; align-items: center; gap: 6px; color: #9aa; font-size: 12px; min-height: 20px; }
      #gitBranchRow svg { width: 14px; height: 14px; flex: 0 0 auto; }
      #gitBranchRow b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
      #gitSync { color: #7ee0a0; font-size: 11px; }
      #gitMsg {
        width: 100%; box-sizing: border-box; background: var(--surface); color: var(--text);
        border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; font-family: inherit;
        font-size: 12.5px; line-height: 1.45; resize: vertical; min-height: 52px; max-height: 170px; outline: none;
      }
      #gitBtnRow { display: flex; gap: 6px; }
      #gitBtnRow button {
        flex: 1; border-radius: 7px; padding: 7px 0; font-size: 12px; font-weight: 600; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 5px;
      }
      #gitAiBtn { background: var(--surface); color: var(--accent); border: 1px solid var(--border); }
      #gitAiBtn:hover { border-color: var(--accent); }
      #gitCommitBtn { background: var(--accent); color: var(--accent-text, #fff); border: none; }
      #gitBtnRow button:disabled { opacity: 0.55; cursor: default; }
      #gitLists { flex: 1; overflow: auto; padding: 2px 0 8px; }
      .gsec-head {
        display: flex; align-items: center; gap: 6px; padding: 8px 8px 3px;
        font-size: 10.5px; color: #9aa; text-transform: uppercase; letter-spacing: 0.4px;
      }
      .gsec-head .cnt { background: var(--surface); border-radius: 8px; padding: 1px 7px; font-size: 10px; }
      .gsec-head .grow { flex: 1; }
      .gsec-head .ga {
        width: 20px; height: 20px; border: none; background: transparent; color: #9aa; border-radius: 5px;
        cursor: pointer; font-size: 12px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0;
      }
      .gsec-head .ga:hover { background: var(--surface); color: var(--text); }
      .gitem { display: flex; align-items: center; gap: 6px; padding: 2px 8px; height: 24px; cursor: pointer; white-space: nowrap; overflow: hidden; user-select: none; }
      .gitem:hover { background: var(--surface); }
      .gitem .ic { width: 16px; height: 16px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
      .gitem .ic svg { width: 15px; height: 15px; }
      .gitem .nm { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
      .gitem .dr { color: #667; font-size: 11px; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
      .gitem .gst { flex: 0 0 auto; font-weight: 700; font-size: 11px; width: 13px; text-align: center; }
      .gst-M { color: #e2b75e; } .gst-A { color: #7ee0a0; } .gst-D { color: #ff9b9b; }
      .gst-U { color: #7ee0a0; } .gst-R { color: #9d8cff; } .gst-C { color: #9d8cff; }
      .gitem .gacts { display: none; gap: 2px; flex: 0 0 auto; }
      .gitem:hover .gacts { display: flex; }
      .gacts button {
        width: 18px; height: 18px; border: none; background: transparent; color: #9aa; border-radius: 4px;
        cursor: pointer; font-size: 12px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0;
      }
      .gacts button:hover { background: var(--border); color: var(--text); }
      #gitEmpty { padding: 20px 12px; color: #778; text-align: center; font-size: 12px; }
      /* caixa da revisão pré-commit da Lumi */
      #gitReview { border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--accent) 6%, transparent); }
      #gitReviewHead { display: flex; align-items: center; gap: 6px; padding: 6px 10px 0; font-size: 11px; color: var(--accent); font-weight: 600; }
      #gitReviewBody {
        padding: 6px 12px 10px; font-size: 12px; line-height: 1.55; color: var(--text);
        white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto;
      }
      /* histórico de commits */
      .gcommits > summary { padding: 8px 8px 4px; font-size: 10.5px; color: #9aa; text-transform: uppercase; letter-spacing: 0.4px; cursor: pointer; list-style: none; }
      .gcommits > summary::before { content: '▸ '; }
      .gcommits[open] > summary::before { content: '▾ '; }
      .gci { padding: 3px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gci:hover { background: var(--surface); }
      .gci .h { color: var(--accent); font-family: Consolas, monospace; font-size: 11px; }
      .gci .w { color: #667; font-size: 10.5px; }
      .cdiff {
        margin: 4px 8px 8px; padding: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
        font: 11px/1.5 Consolas, monospace; max-height: 260px; overflow: auto; white-space: pre; color: #aab;
      }
      .cdiff .cl-add { color: #7ee0a0; }
      .cdiff .cl-del { color: #ff9b9b; }
      .cdiff .cl-hunk { color: var(--accent); }
      .gsec-head .ga:disabled, #gitBranchRow .ga:disabled { opacity: 0.5; cursor: default; }
      /* menu de troca de branch */
      .brmenu {
        position: fixed; z-index: 90; background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 9px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); padding: 4px; min-width: 180px; max-height: 300px; overflow: auto;
      }
      .bri { padding: 6px 10px; border-radius: 6px; font-size: 12.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bri:hover { background: var(--surface); }
      .bri.cur { color: var(--accent); }
      .bri.new { color: #9aa; border-top: 1px solid var(--border); margin-top: 3px; }
      /* barrinhas de git na margem do editor */
      .gut-add { border-left: 3px solid #7ee0a0; margin-left: 3px; }
      .gut-mod { border-left: 3px solid #e2b75e; margin-left: 3px; }
      .gut-del { border-left: 3px solid #ff9b9b; margin-left: 3px; }
      /* ---- Ctrl+P: abrir arquivo rápido ---- */
      #qopen { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.25); z-index: 80; display: flex; justify-content: center; align-items: flex-start; padding-top: 64px; }
      #qopen[hidden] { display: none; }
      #qbox {
        width: min(560px, 86vw); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5); overflow: hidden;
      }
      #qinput {
        width: 100%; box-sizing: border-box; background: transparent; border: none; outline: none; color: var(--text);
        font-size: 14px; padding: 11px 14px; border-bottom: 1px solid var(--border); font-family: inherit;
      }
      #qlist { max-height: 320px; overflow: auto; padding: 4px 0; }
      .qitem { display: flex; align-items: center; gap: 8px; padding: 4px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; }
      .qitem .ic { width: 16px; height: 16px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
      .qitem .ic svg { width: 15px; height: 15px; }
      .qitem .qn { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
      .qitem .qp { color: #667; font-size: 11px; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
      .qitem.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); }
      #sbLeft:hover { color: var(--text); cursor: pointer; }
      #edcol { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #editor { flex: 1; min-width: 0; min-height: 0; }
      #diffeditor { flex: 1; min-width: 0; min-height: 0; display: none; }
      /* ---- live server (preview ao vivo) ---- */
      #liveview { flex: 1; min-width: 0; min-height: 0; display: none; flex-direction: column; background: var(--surface-2); }
      #liveview[hidden] { display: none; }
      #liveTools { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid var(--border); }
      #liveTools button {
        border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px;
        padding: 3px 9px; font-size: 11.5px; cursor: pointer;
      }
      #liveTools button:hover { border-color: var(--accent); }
      #liveTools button.on { background: color-mix(in srgb, var(--accent) 25%, transparent); border-color: var(--accent); color: var(--accent); }
      #liveUrl { font-size: 11px; color: #889; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #liveFrame { flex: 1; border: none; background: #fff; }
      /* ---- navegador embutido (webview) ---- */
      #webroot { flex: 1; min-width: 0; min-height: 0; display: none; flex-direction: column; background: var(--surface-2); }
      #webroot[hidden] { display: none; }
      #webTools { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid var(--border); }
      #webTools button {
        border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px;
        padding: 3px 9px; font-size: 11.5px; cursor: pointer; flex: 0 0 auto;
      }
      #webTools button:hover { border-color: var(--accent); }
      #webTools button.on { background: color-mix(in srgb, var(--accent) 25%, transparent); border-color: var(--accent); color: var(--accent); }
      #wbUrl {
        flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); color: var(--text);
        border-radius: 6px; padding: 5px 9px; font-size: 12px; outline: none; font-family: Consolas, monospace;
      }
      #wbUrl:focus { border-color: var(--accent); }
      #wb { flex: 1; background: #fff; display: flex; }
      /* abas de arquivos (estilo VS Code) */
      #tabs {
        display: flex;
        overflow-x: auto;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        scrollbar-width: thin;
      }
      #tabs:empty { display: none; }
      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 7px 6px 10px;
        font-size: 12px;
        cursor: pointer;
        border-right: 1px solid var(--border);
        white-space: nowrap;
        color: #9aa;
        max-width: 190px;
        user-select: none;
      }
      .tab:hover { background: var(--surface); }
      .tab.active {
        background: var(--bg);
        color: var(--text);
        box-shadow: inset 0 2px 0 var(--accent);
      }
      .tab .ticon svg { width: 13px; height: 13px; display: block; }
      .tab .tname { overflow: hidden; text-overflow: ellipsis; }
      .tab .tx {
        border: none;
        background: transparent;
        color: #778;
        width: 17px;
        height: 17px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 10px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }
      .tab .tx:hover { background: var(--border); color: var(--text); }
      .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: none; flex: 0 0 auto; margin: 0 4px; }
      .tab.dirty .dot { display: block; }
      .tab.dirty .tx { display: none; }
      .tab.dirty:hover .tx { display: flex; }
      .tab.dirty:hover .dot { display: none; }
      /* barra de status (linha/coluna, linguagem) */
      #statusbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 10px;
        height: 22px;
        font-size: 11px;
        color: #9aa;
        background: var(--surface-2);
        border-top: 1px solid var(--border);
        flex: 0 0 auto;
        white-space: nowrap;
        overflow: hidden;
      }
      #sbLeft { overflow: hidden; text-overflow: ellipsis; }
      /* indicador de "acontecendo algo" (conexão remota) na statusbar */
      #connBusy { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); white-space: nowrap; margin: 0 10px; }
      #connBusy[hidden] { display: none; }
      .cspin { width: 11px; height: 11px; border: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: cspin 0.7s linear infinite; }
      @keyframes cspin { to { transform: rotate(360deg); } }
      /* divisória do explorador (painel lateral redimensionável) */
      #sideresize {
        width: 5px; flex: 0 0 auto; cursor: col-resize; background: var(--border);
        transition: background 0.15s;
      }
      #sideresize:hover { background: var(--accent); }
      /* painel do chat (iframe reaproveitando chat.html) */
      #chatresize {
        width: 5px; flex: 0 0 auto; cursor: col-resize; background: var(--border);
        transition: background 0.15s;
      }
      #chatresize:hover { background: var(--accent); }
      #chatpane {
        width: 400px; flex: 0 0 auto; display: flex; flex-direction: column;
        border-left: 1px solid var(--border); background: var(--bg); min-width: 0;
      }
      #chatpane.hidden, #chatresize.hidden { display: none; }
      #chatframe { flex: 1; width: 100%; border: none; background: var(--bg); }
      #preview {
        flex: 1; min-width: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; overflow: auto; padding: 16px; background: var(--surface-2);
        background-image: linear-gradient(45deg, #1c1c26 25%, transparent 25%), linear-gradient(-45deg, #1c1c26 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #1c1c26 75%), linear-gradient(-45deg, transparent 75%, #1c1c26 75%);
        background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      }
      #preview img { max-width: 100%; max-height: calc(100% - 30px); object-fit: contain; border-radius: 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); }
      #previewMeta { font-size: 12px; color: #9aa; background: rgba(0, 0, 0, 0.4); padding: 4px 10px; border-radius: 6px; }
      #empty { margin: 16px auto; color: #667; font-size: 13px; text-align: center; padding: 10px; }
      /* menu de contexto (mesmo visual dos dropdowns) */
      .ctxmenu {
        position: fixed;
        z-index: 200;
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        backdrop-filter: blur(16px);
        border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
        border-radius: 12px;
        padding: 6px;
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55), 0 2px 10px rgba(0, 0, 0, 0.35);
        min-width: 172px;
        font-size: 12.5px;
        animation: menuIn 0.13s ease;
      }
      .ctxmenu .mi {
        padding: 7px 10px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 9px;
        transition: background 0.1s;
      }
      .ctxmenu .mi svg { width: 14px; height: 14px; flex: 0 0 auto; color: color-mix(in srgb, var(--text) 62%, transparent); }
      .ctxmenu .mi:hover { background: color-mix(in srgb, var(--accent) 17%, transparent); }
      .ctxmenu .mi:hover svg { color: var(--accent); }
      .ctxmenu .mi.danger { color: #ff9b9b; }
      .ctxmenu .mi.danger:hover { background: color-mix(in srgb, #e0556e 18%, transparent); }
      .ctxmenu .mi.danger svg { color: #ff9b9b; }
      /* modal de nome */
      .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 300; }
      .modal .box {
        background: color-mix(in srgb, var(--surface) 96%, transparent);
        border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
        border-radius: 14px;
        padding: 18px;
        width: 330px;
        max-width: 90%;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        animation: menuIn 0.15s ease;
      }
      .modal .t { font-size: 13px; margin-bottom: 10px; color: var(--text); }
      .modal input { width: 100%; padding: 9px 10px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface-2); color: var(--text); font-size: 13px; font-family: inherit; outline: none; }
      .modal .b { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
      .modal .b button { border: none; border-radius: 7px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
      .modal .b .cancel { background: var(--border); color: #fff; }
      .modal .b .ok { background: var(--accent); color: var(--accent-text); }
      /* barra de menus (refinada) */
      #menubar {
        display: flex;
        align-items: center;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        font-size: 12.5px;
        user-select: none;
        position: relative;
        z-index: 150;
        padding: 3px 6px;
        gap: 1px;
      }
      .mlabel {
        padding: 4px 10px;
        cursor: pointer;
        color: color-mix(in srgb, var(--text) 80%, transparent);
        border-radius: 6px;
        transition: background 0.12s, color 0.12s;
      }
      .mlabel:hover { background: var(--surface); color: var(--text); }
      .mlabel.open {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        color: var(--text);
      }
      .mdrop {
        position: absolute;
        top: calc(100% + 4px);
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        backdrop-filter: blur(16px);
        border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
        border-radius: 12px;

    <script>
      const CDN = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min';

      const tree = document.getElementById('tree');

      const diffEl = document.getElementById('diffeditor');
      const previewEl = document.getElementById('preview');
      const previewImg = document.getElementById('previewImg');
      const previewMeta = document.getElementById('previewMeta');
      let editor = null;
      let diffEditor = null; // editor de diff do painel git (criado junto com o Monaco)
      let current = null;
      let isImage = false;
      let treeData = [];
      let dragSrc = null;
      const expanded = new Set();
      const IMG_EXT = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'ico', 'svg', 'avif'];
      const LANG = {
        js: 'javascript', mjs: 'javascript', cjs: 'javascript', ts: 'typescript', tsx: 'typescript', jsx: 'javascript',
        json: 'json', html: 'html', css: 'css', scss: 'scss', md: 'markdown', py: 'python', go: 'go', rs: 'rust',
        java: 'java', kt: 'kotlin', c: 'c', cpp: 'cpp', h: 'cpp', cs: 'csharp', sh: 'shell', yml: 'yaml', yaml: 'yaml',

      };
      const langOf = (p) => LANG[(p.split('.').pop() || '').toLowerCase()] || 'plaintext';
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const dirOf = (p) => p.split('/').slice(0, -1).join('/');
      const fmtBytes = (b) => (b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB');

      // ---- ícones por tecnologia (estilo VS Code, SVG inline = funciona offline) ----
      // badge: quadradinho colorido com a sigla da linguagem (JS, TS, C#...)
      const badge = (label, bg, fg) =>
        '<svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="3.5" fill="' + bg + '"/>' +
        '<text x="8" y="11.3" text-anchor="middle" font-size="' + (label.length > 2 ? 5.6 : 7.2) + '" font-weight="700" ' +
        'font-family="Segoe UI, sans-serif" fill="' + fg + '">' + label + '</text></svg>';
      // picon: glifo desenhado (traço) na cor da tecnologia
      const picon = (paths, color) =>
        '<svg viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
      const GLYPH = {
        react:
          '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2" fill="#53c1de"/>' +
          '<ellipse cx="12" cy="12" rx="10" ry="4" stroke="#53c1de" stroke-width="1.4"/>' +

          '<ellipse cx="12" cy="12" rx="10" ry="4" stroke="#53c1de" stroke-width="1.4" transform="rotate(120 12 12)"/></svg>',
        term: (c) => picon('<polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/>', c),
        db: (c) => picon('<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>', c),
        img: (c) => picon('<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>', c),
        music: (c) => picon('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>', c),
        film: (c) => picon('<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M17 3v18"/><path d="M3 12h18"/>', c),
        lock: (c) => picon('<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', c),
        git: (c) => picon('<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>', c),
        gear: (c) => picon('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M4.9 19.1l2.2-2.2M16.9 7.1l2.2-2.2"/>', c),
        person: (c) => picon('<circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/>', c),
        gem: (c) => picon('<path d="M6 3h12l4 6-10 13L2 9z"/><path d="M2 9h20"/><path d="m9 3 3 6 3-6"/>', c),
        doc: (c) => picon('<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h8M8 17h5"/>', c),
        zip: (c) => picon('<path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/>', c),
      };
      const FILE_ICONS = {};
      (function () {
        const set = (exts, html) => exts.forEach((e) => (FILE_ICONS[e] = html));
        set(['js', 'mjs', 'cjs'], badge('JS', '#e8d44d', '#1c1c1c'));
        set(['ts'], badge('TS', '#3178c6', '#fff'));
        set(['jsx', 'tsx'], GLYPH.react);
        set(['json'], badge('{}', '#cbcb41', '#1c1c1c'));
        set(['html', 'htm'], badge('<>', '#e37933', '#fff'));
        set(['xml'], badge('<>', '#8fa3b8', '#16161e'));
        set(['css'], badge('#', '#519aba', '#fff'));
        set(['scss', 'sass', 'less'], badge('S', '#c6538c', '#fff'));
        set(['md', 'mdx'], badge('MD', '#7aa2ff', '#16161e'));
        set(['py'], badge('PY', '#3572a5', '#ffd84d'));
        set(['go'], badge('GO', '#00add8', '#fff'));
        set(['rs'], badge('RS', '#dea584', '#3a2a1a'));
        set(['java'], badge('J', '#cc3e44', '#fff'));
        set(['kt', 'kts'], badge('KT', '#a97bff', '#fff'));
        set(['c'], badge('C', '#519aba', '#fff'));
        set(['cpp', 'cc', 'cxx'], badge('C++', '#519aba', '#fff'));
        set(['h', 'hpp'], badge('H', '#a074c4', '#fff'));
        set(['cs'], badge('C#', '#178600', '#fff'));
        set(['php'], badge('PHP', '#8892bf', '#fff'));
        set(['rb'], GLYPH.gem('#cc342d'));
        set(['swift'], badge('SW', '#f05138', '#fff'));
        set(['dart'], badge('DT', '#00b4ab', '#fff'));
        set(['vue'], badge('V', '#41b883', '#fff'));
        set(['svelte'], badge('S', '#ff3e00', '#fff'));
        set(['sql', 'db', 'sqlite'], GLYPH.db('#e38c00'));
        set(['sh', 'bash', 'bat', 'cmd'], GLYPH.term('#89e051'));
        set(['ps1'], GLYPH.term('#0273b9'));
        set(['yml', 'yaml'], badge('Y', '#a074c4', '#fff'));
        set(['toml', 'ini', 'env', 'conf', 'cfg', 'properties'], GLYPH.gear('#9aa9b8'));
        set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'ico', 'bmp', 'avif'], GLYPH.img('#b07ae0'));
        set(['svg'], GLYPH.img('#ffb13b'));
        set(['mp3', 'wav', 'ogg', 'flac'], GLYPH.music('#e0556e'));
        set(['mp4', 'webm', 'mov', 'avi'], GLYPH.film('#e0556e'));
        set(['vrm', 'vrma'], GLYPH.person('#7ee0a0')); // os avatares da Lumi 💚
        set(['lock'], GLYPH.lock('#8a8a99'));
        set(['gitignore', 'gitattributes'], GLYPH.git('#f05033'));
        set(['dockerfile'], badge('D', '#2496ed', '#fff'));
        set(['pdf'], badge('PDF', '#d93f3f', '#fff'));
        set(['zip', 'rar', '7z', 'gz', 'tar'], GLYPH.zip('#c9a86a'));
        set(['txt', 'log'], GLYPH.doc('#9aa9b8'));
      })();
      const iconFor = (name) => FILE_ICONS[(name.split('.').pop() || '').toLowerCase()] || SVG.file;

      const SVG = {
        chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
        folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>',
        folderOpen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>',
        file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>',
      };

      async function loadTree() {
        const [td] = await Promise.all([window.api.getWorkspaceFullTree(), loadGit()]);
        treeData = td || [];
        qFlat = null; // árvore mudou → o cache do Ctrl+P refaz na próxima busca
        // restaura pastas que você tinha aberto mas que o BFS não recarregou (lazy) — senão
        // voltariam vazias após um refresh (ex.: ao salvar um arquivo)
        for (const p of expanded) {
          const n = findNode(treeData, p);
          if (n && n.dir && !n.loaded) {
            n.loaded = true;
            n.children = (await window.api.getWorkspaceChildren(p)) || [];
          }
        }
        drawTree();
      }
      function drawTree() {
        if (searchMode && wsSearch.value.trim().length >= 2) return; // não clobra os resultados da busca
        tree.innerHTML = '';
        if (!treeData.length) {
          tree.innerHTML = '<div id="empty">Defina o workspace no<br>Modo arquiteto.</div>';
          return;
        }
        renderNodes(treeData, tree, 0);
      }
      function renderNodes(nodes, container, depth) {
        nodes.forEach((node) => {
          const row = document.createElement('div');
          row.className = 'item' + (node.dir ? ' dir' : '') + (node.path === current ? ' active' : '');
          row.style.paddingLeft = 6 + depth * 12 + 'px';
          if (depth) {
            // indent guides (linhas de hierarquia, estilo VS Code)
            row.style.backgroundImage = 'repeating-linear-gradient(to right, transparent 0 11px, color-mix(in srgb, var(--border) 60%, transparent) 11px 12px)';
            row.style.backgroundSize = depth * 12 + 'px 100%';
            row.style.backgroundRepeat = 'no-repeat';
          }
          const open = node.dir && expanded.has(node.path);
          const chev = node.dir ? '<span class="chev' + (open ? ' open' : '') + '">' + SVG.chev + '</span>' : '<span class="chev"></span>';
          const icon = node.dir
            ? '<span class="ic">' + (open ? SVG.folderOpen : SVG.folder) + '</span>'
            : '<span class="ic">' + iconFor(node.name) + '</span>';
          const g = gitMap[node.path]; // status git: M/A/U/D (arquivo) ou 'dir' (tem mudanças dentro)
          const nmCls = g && g !== 'dir' ? ' git-' + g : '';
          const dot = node.dir && g ? '<span class="gitdot"></span>' : '';
          row.innerHTML = chev + icon + '<span class="nm' + nmCls + '">' + esc(node.name) + '</span>' + dot;
          row.title = node.path;
          row.addEventListener('click', () => (node.dir ? toggle(node.path) : openFile(node.path)));
          row.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showMenu(e, node);
          });
          // ---- drag & drop (mover) ----
          row.draggable = true;
          row.addEventListener('dragstart', (e) => {
            dragSrc = node.path;
            row.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            try {
              e.dataTransfer.setData('text/plain', node.path);
            } catch (_) {}
          });
          row.addEventListener('dragend', () => {
            row.classList.remove('dragging');
            dragSrc = null;
          });
          if (node.dir) {
            // pastas são alvo de soltura (move pra dentro)
            row.addEventListener('dragover', (e) => {
              if (!dragSrc || dragSrc === node.path) return;
              e.preventDefault();
              e.dataTransfer.dropEffect = 'move';
              row.classList.add('drop-target');
            });
            row.addEventListener('dragleave', () => row.classList.remove('drop-target'));
            row.addEventListener('drop', (e) => {
              e.preventDefault();
              e.stopPropagation();
              row.classList.remove('drop-target');
              doMove(dragSrc, node.path);
            });
          }
          container.appendChild(row);
          if (open && node.children && node.children.length) renderNodes(node.children, container, depth + 1);
        });
      }
      async function toggle(p) {
        if (expanded.has(p)) {
          expanded.delete(p);
          drawTree();
          return;
        }
        expanded.add(p);
        // lazy: pasta que o BFS não chegou a expandir (loaded=false) → busca os filhos ao abrir
        const node = findNode(treeData, p);
        if (node && node.dir && !node.loaded) {
          node.loaded = true;
          node.children = (await window.api.getWorkspaceChildren(p)) || [];
        }
        drawTree();
      }
      function findNode(nodes, p) {
        for (const n of nodes || []) {
          if (n.path === p) return n;
          if (n.dir && n.children && n.children.length && p.startsWith(n.path + '/')) {
            const f = findNode(n.children, p);
            if (f) return f;
          }
        }
        return null;
      }

      const toast = (m, ok) => (window.__lumiToast ? window.__lumiToast(m, ok) : (curpath.textContent = m));

      // ---------- abas de arquivos (estilo VS Code) ----------
      const tabsBar = document.getElementById('tabs');
      const sbLeft = document.getElementById('sbLeft');
      const sbRight = document.getElementById('sbRight');
      const openTabs = []; // [{path, model?, viewState?, savedVer?, dirty, image?, url?, bytes?}]
      let active = null; // path da aba ativa
      const baseName = (p) => p.split('/').pop();
      const findTab = (p) => openTabs.find((t) => t.path === p);

      function renderTabs() {
        tabsBar.innerHTML = '';
        openTabs.forEach((t) => {
          const el = document.createElement('div');
          el.className = 'tab' + (t.path === active ? ' active' : '') + (t.dirty ? ' dirty' : '');
          el.title = t.live ? 'Live Server (preview ao vivo)' : t.web ? 'Navegador embutido' : t.diff ? t.rel + ' (alterações)' : t.path;
          const nm = t.live || t.web ? t.title : t.diff ? '⇆ ' + baseName(t.rel) : baseName(t.path);
          el.innerHTML =
            '<span class="ticon">' + (t.live ? LIVE_ICON : t.web ? WEB_ICON : iconFor(baseName(t.diff ? t.rel : t.path))) + '</span>' +
            '<span class="tname">' + esc(nm) + '</span>' +
            '<span class="dot"></span><button class="tx" title="Fechar (clique do meio)">✕</button>';
          el.addEventListener('click', (e) => {
            if (!e.target.closest('.tx')) activate(t.path);
          });
          el.addEventListener('auxclick', (e) => {
            if (e.button === 1) {
              e.preventDefault();
              closeTab(t.path);
            }
          });
          el.querySelector('.tx').addEventListener('click', (e) => {
            e.stopPropagation();
            closeTab(t.path);
          });
          tabsBar.appendChild(el);
        });
      }
      function updateDirty(t) {
        const d = !!(t.model && t.model.getAlternativeVersionId() !== t.savedVer);
        if (d !== t.dirty) {
          t.dirty = d;
          renderTabs();
        }
      }
      function updateStatus() {
        const t = active && findTab(active);
        const git = gitBranch ? '⎇ ' + gitBranch + (gitChanges ? ' • ' + gitChanges + '±' : '') + '   ' : '';
        const remote = remoteActive ? '📡 ' + remoteActive + '   ' : '';
        sbLeft.textContent = remote + git + (active || 'Lumi Workspace');
        if (!t) sbRight.textContent = '';
        else if (t.image) sbRight.textContent = 'imagem · ' + fmtBytes(t.bytes || 0);
        else if (t.diff) sbRight.textContent = 'git diff · ' + langOf(t.rel);
        else if (t.live) sbRight.textContent = 'live server · recarrega ao salvar';
        else if (t.web) sbRight.textContent = 'navegador embutido';
        else {
          const pos = editor && editor.getPosition();
          sbRight.textContent = (pos ? 'Ln ' + pos.lineNumber + ', Col ' + pos.column + '   ·   ' : '') + langOf(t.path);
        }
      }
      function showNothing() {
        active = null;
        current = null;
        window.api.setEditorActive('');
        curpath.textContent = 'Nenhum arquivo aberto';
        previewEl.style.display = 'none';
        diffEl.style.display = 'none';
        liveviewEl.hidden = true;
        liveviewEl.style.display = 'none';
        webrootEl.hidden = true;
        webrootEl.style.display = 'none';
        editorEl.style.display = 'block';
        if (editor) editor.setModel(monaco.editor.createModel('', 'plaintext'));
        renderTabs();
        updateStatus();
      }
      function activate(p) {
        const t = findTab(p);
        if (!t) return;
        if (active && active !== p) {
          const prev = findTab(active);
          if (prev && prev.model && !prev.diff && editor) prev.viewState = editor.saveViewState(); // memoriza cursor/scroll
        }
        if (t.stale) refreshTab(t); // arquivo mudou no disco enquanto a aba estava em segundo plano
        active = p;
        current = t.diff || t.live || t.web ? null : p;
        isImage = !!t.image;
        curpath.textContent = t.diff ? t.rel + '  ·  HEAD ⇆ atual' : t.live ? liveUrl : t.web ? 'navegador embutido' : p;
        previewEl.style.display = 'none';
        editorEl.style.display = 'none';
        diffEl.style.display = 'none';
        liveviewEl.hidden = true;
        liveviewEl.style.display = 'none';
        webrootEl.hidden = true;
        webrootEl.style.display = 'none';
        if (t.image) {
          previewEl.style.display = 'flex';
          previewImg.src = t.url;
          previewImg.onload = () =>
            (previewMeta.textContent = previewImg.naturalWidth + ' × ' + previewImg.naturalHeight + ' px  ·  ' + fmtBytes(t.bytes));
        } else if (t.diff) {
          diffEl.style.display = 'block';
          if (diffEditor) diffEditor.setModel({ original: t.orig, modified: t.model });
        } else if (t.live) {
          liveviewEl.hidden = false;
          liveviewEl.style.display = 'flex';
        } else if (t.web) {
          webrootEl.hidden = false;
          webrootEl.style.display = 'flex';
        } else {
          editorEl.style.display = 'block';
          if (editor) {
            editor.setModel(t.model);
            if (t.viewState) editor.restoreViewState(t.viewState);
            editor.focus();
          }
        }
        renderTabs();
        drawTree();
        updateStatus();
        updateGitGutter(); // barrinhas de linhas alteradas
        window.api.setEditorActive(t.image || t.diff || t.live || t.web ? '' : p); // o chat mostra/anexa o arquivo ativo
      }
      function closeTab(p, force) {
        const i = openTabs.findIndex((t) => t.path === p);
        if (i < 0) return;
        const t = openTabs[i];
        if (!force && t.dirty && !confirm('"' + baseName(p) + '" tem alterações não salvas. Fechar mesmo assim?')) return;
        if (t.model) t.model.dispose();
        if (t.orig) t.orig.dispose(); // lado "original" das abas de diff
        if (t.live) stopLiveServer(); // fechar a aba desliga o servidor
        if (t.web) {
          try {
            wb.src = 'about:blank'; // libera a página carregada
          } catch (e) {}
        }
        openTabs.splice(i, 1);
        if (active === p) {
          const next = openTabs[i] || openTabs[i - 1];
          if (next) activate(next.path);
          else showNothing();
        } else renderTabs();
      }

      async function openFile(rel) {
        let t = findTab(rel);
        if (!t) {
          const ext = (rel.split('.').pop() || '').toLowerCase();
          if (IMG_EXT.includes(ext)) {
            const r = await window.api.readWorkspaceImage(rel);
            if (!r || !r.url) return toast('⚠ não consegui abrir ' + rel, false);
            t = { path: rel, image: true, url: r.url, bytes: r.bytes, dirty: false };
          } else {
            const content = await window.api.readWorkspaceFile(rel);
            if (content == null) return;
            const model = monaco.editor.createModel(content, langOf(rel));
            t = { path: rel, model, savedVer: model.getAlternativeVersionId(), dirty: false };
            model.onDidChangeContent(() => updateDirty(t));
          }
          openTabs.push(t);
        }
        activate(rel);
      }

      async function save() {
        const t = active && findTab(active);
        if (!t || t.image || t.diff || t.live || t.web || !editor) return;
        const ok = await window.api.writeWorkspaceFile(t.path, t.model.getValue());
        if (ok) {
          t.savedVer = t.model.getAlternativeVersionId();
          t.dirty = false;
          renderTabs();
          toast('✓ ' + baseName(t.path) + ' salvo');
          updateGitGutter(); // o salvamento muda o diff vs HEAD
        } else toast('⚠ erro ao salvar', false);
      }

      // ---- modal de nome (prompt não funciona no Electron) ----
      function askName(title, initial) {
        return new Promise((resolve) => {
          const ov = document.createElement('div');
          ov.className = 'modal';
          ov.innerHTML =
            '<div class="box"><div class="t">' + esc(title) + '</div><input type="text" spellcheck="false" />' +
            '<div class="b"><button class="cancel">Cancelar</button><button class="ok">OK</button></div></div>';
          document.body.appendChild(ov);
          const inp = ov.querySelector('input');
          inp.value = initial || '';
          inp.focus();
          inp.select();
          const done = (v) => {
            ov.remove();
            resolve(v);
          };
          ov.querySelector('.ok').onclick = () => done(inp.value.trim() || null);
          ov.querySelector('.cancel').onclick = () => done(null);
          ov.addEventListener('mousedown', (e) => {
            if (e.target === ov) done(null);
          });
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              done(inp.value.trim() || null);
            } else if (e.key === 'Escape') done(null);
          });
        });
      }

      // ---- menu de contexto ----
      let curMenu = null;
      function closeMenu() {
        if (curMenu) {
          curMenu.remove();
          curMenu = null;
        }
      }
      document.addEventListener('click', closeMenu);
      function showMenu(e, node) {
        closeMenu();
        const m = document.createElement('div');
        m.className = 'ctxmenu';
        const items = [];
        if (node.dir) {
          items.push(['Novo arquivo', () => newEntry(node.path, false), false, MI.filePlus]);
          items.push(['Nova pasta', () => newEntry(node.path, true), false, MI.folderPlus]);
        }
        items.push(['Renomear', () => renameEntry(node), false, MI.pencil]);
        items.push(['Revelar no Explorer', () => window.api.revealInExplorer(node.path), false, MI.reveal]);
        items.push(['Excluir', () => delEntry(node), true, MI.trash]);
        items.forEach(([label, fn, danger, icon]) => {
          const it = document.createElement('div');
          it.className = 'mi' + (danger ? ' danger' : '');
          it.innerHTML = (icon || '') + '<span></span>';
          it.lastChild.textContent = label;
          it.onclick = () => {
            closeMenu();
            fn();
          };
          m.appendChild(it);
        });
        m.style.left = Math.min(e.clientX, window.innerWidth - 160) + 'px';
        m.style.top = e.clientY + 'px';
        document.body.appendChild(m);
        curMenu = m;
      }

      // ---- operações de arquivo ----
      async function newEntry(parentRel, isDir) {
        const name = await askName(isDir ? 'Nome da nova pasta' : 'Nome do novo arquivo', '');
        if (!name) return;
        const rel = parentRel ? parentRel + '/' + name : name;
        const r = await window.api.createWorkspaceEntry(rel, isDir);
        if (r && r.error) {
          curpath.textContent = '⚠ ' + r.error;
          return;
        }
        if (parentRel) expanded.add(parentRel);
        await loadTree();
        if (!isDir) openFile(rel);
      }
      // troca o prefixo dos caminhos das abas quando algo é renomeado/movido (inclui filhos de pastas)
      function retargetTabs(oldPath, newPath) {
        let activeChanged = false;
        openTabs.forEach((t) => {
          if (t.path === oldPath || t.path.startsWith(oldPath + '/')) {
            const np = newPath + t.path.slice(oldPath.length);
            if (t.path === active) {
              active = np;
              current = np;
              curpath.textContent = np;
              activeChanged = true;
            }
            t.path = np;
          }
        });
        renderTabs();
        if (activeChanged) updateStatus();
      }
      async function renameEntry(node) {
        const name = await askName('Novo nome', node.name);
        if (!name || name === node.name) return;
        const r = await window.api.renameWorkspaceEntry(node.path, name);
        if (r && r.error) return toast('⚠ ' + r.error, false);
        if (r && r.path) retargetTabs(node.path, r.path);
        await loadTree();
      }
      async function delEntry(node) {
        if (!confirm('Excluir "' + node.name + '"' + (node.dir ? ' e todo o conteúdo' : '') + '? Não dá pra desfazer.')) return;
        const r = await window.api.deleteWorkspaceEntry(node.path);
        if (r && r.error) return toast('⚠ ' + r.error, false);
        // fecha as abas dos arquivos apagados (sem perguntar — já eram)
        openTabs
          .filter((t) => t.path === node.path || t.path.startsWith(node.path + '/'))
          .map((t) => t.path)
          .forEach((p) => closeTab(p, true));
        await loadTree();
      }

      async function doMove(src, destDir) {
        if (!src) return;
        if (dirOf(src) === (destDir || '')) return; // já está nessa pasta
        if (destDir === src || destDir.startsWith(src + '/')) return; // dentro de si mesma
        const r = await window.api.moveWorkspaceEntry(src, destDir);
        if (r && r.error) return toast('⚠ ' + r.error, false);
        if (r && r.path) retargetTabs(src, r.path);
        if (destDir) expanded.add(destDir);
        dragSrc = null;
        await loadTree();
      }

      // soltar na área vazia da árvore = mover para a raiz
      tree.addEventListener('dragover', (e) => {
        if (!dragSrc || e.target.closest('.item')) return;
        e.preventDefault();
        tree.classList.add('drop-root');
      });
      tree.addEventListener('dragleave', (e) => {
        if (e.target === tree) tree.classList.remove('drop-root');
      });
      tree.addEventListener('drop', (e) => {
        tree.classList.remove('drop-root');
        if (!dragSrc || e.target.closest('.item')) return;
        e.preventDefault();
        doMove(dragSrc, '');
      });

      // clique direito no vazio da árvore = criar na raiz
      tree.addEventListener('contextmenu', (e) => {
        if (e.target.closest('.item')) return;
        e.preventDefault();
        closeMenu();
        const m = document.createElement('div');
        m.className = 'ctxmenu';
        [
          ['Novo arquivo', () => newEntry('', false), MI.filePlus],
          ['Nova pasta', () => newEntry('', true), MI.folderPlus],
        ].forEach(([l, fn, icon]) => {
          const it = document.createElement('div');
          it.className = 'mi';
          it.innerHTML = (icon || '') + '<span></span>';
          it.lastChild.textContent = l;
          it.onclick = () => {
            closeMenu();
            fn();
          };
          m.appendChild(it);
        });
        m.style.left = Math.min(e.clientX, window.innerWidth - 160) + 'px';
        m.style.top = e.clientY + 'px';
        document.body.appendChild(m);
        curMenu = m;
      });

      // auto-refresh: o main avisa quando arquivos mudam (cria/edita/apaga, inclusive a Lumi)
      let refreshTimer = null;
      window.api.onWorkspaceChanged(() => {
        if (document.querySelector('.modal')) return; // não atrapalha criação/rename em andamento
        clearTimeout(refreshTimer);
        refreshTimer = setTimeout(() => {
          loadTree();
          if (sideMode === 'git') loadGitPanel(); // painel git acompanha as mudanças
          // abas: a ativa recarrega na hora (se você não tiver edição pendente); as outras
          // ficam marcadas e recarregam quando você clicar nelas
          openTabs.forEach((t) => (t.stale = true));
          const cur = active && findTab(active);
          if (cur) refreshTab(cur);
          updateGitGutter();
        }, 150);
      });

      // ============================================================
      //  Painel inferior: TERMINAL (xterm + PTY/pipe no main) + PORTAS
      // ============================================================
      const panel = document.getElementById('panel');
      const panelResize = document.getElementById('panelResize');
      const termBody = document.getElementById('termBody');
      const portsBodyEl = document.getElementById('portsBody');
      const termSel = document.getElementById('termSel');
      const termsUi = new Map(); // id -> {term, fit, host, title}
      let activeTerm = null;
      let panelTab = 'term';

      function xtermTheme() {
        const acc = cssVarHex('--accent', '#7aa2ff');
        return {
          background: cssVarHex('--surface-2', '#0f0f16'),
          foreground: cssVarHex('--text', '#eeeeee'),
          cursor: acc,
          selectionBackground: acc + '55',
        };
      }
      function showPanel(show) {
        panel.hidden = !show;
        panelResize.hidden = !show;
        if (show) setTimeout(fitActive, 30);
      }
      function setPanelTab(t) {
        panelTab = t;
        document.querySelectorAll('.ptab').forEach((x) => x.classList.toggle('active', x.dataset.tab === t));
        termBody.style.display = t === 'term' ? '' : 'none';
        portsBodyEl.hidden = t !== 'ports';
        document.getElementById('dockerBody').hidden = t !== 'docker';
        document.getElementById('dbBody').style.display = t === 'db' ? 'flex' : 'none';
        if (t === 'ports') loadPorts(true); // força o desenho (os dados já estavam frescos do poll)
        if (t === 'docker') loadDocker(true);
        if (t === 'db') dbInit();
        if (t === 'term') setTimeout(fitActive, 30);
      }

      // ============================================================
      //  Aba BANCO: conecta (Postgres/MySQL), lista tabelas, roda query, SQL em português
      // ============================================================
      let dbReady = false; // já conectou nesta sessão do painel?
      let dbInited = false; // já populou as conexões detectadas?
      const dbUrlEl = document.getElementById('dbUrl');
      const dbPickEl = document.getElementById('dbPick');
      const dbStatusEl = document.getElementById('dbStatus');
      async function dbInit() {
        if (dbInited) return;
        dbInited = true;
        const found = await window.api.dbDetect();
        dbPickEl.innerHTML = '';
        if (found.length) {
          found.forEach((d) => {
            const o = document.createElement('option');
            o.value = d.url;
            o.textContent = d.from + ' · ' + d.masked;
            dbPickEl.appendChild(o);
          });
          dbUrlEl.value = found[0].url;
          dbPickEl.style.display = '';
          dbStatusEl.textContent = found.length + ' conexão(ões) no .env';
        } else {
          dbPickEl.style.display = 'none';
          dbStatusEl.textContent = 'cole uma URL ou defina DATABASE_URL no .env';
        }
      }
      dbPickEl.addEventListener('change', () => (dbUrlEl.value = dbPickEl.value));
      document.getElementById('dbConnBtn').onclick = async () => {
        const r = await window.api.dbConnect(dbUrlEl.value.trim());
        if (r && r.error) {
          dbStatusEl.textContent = '⚠ ' + r.error;
          return;
        }
        dbReady = true;
        dbStatusEl.textContent = '✓ ' + r.kind + ' · ' + r.label;
        document.getElementById('dbMain').hidden = false;
        dbLoadTables();
      };
      document.getElementById('dbDisc').onclick = async () => {
        await window.api.dbDisconnect();
        dbReady = false;
        document.getElementById('dbMain').hidden = true;
        dbStatusEl.textContent = 'desconectado';
      };
      async function dbLoadTables() {
        const tables = await window.api.dbTables();
        const box = document.getElementById('dbTables');
        box.innerHTML = '';
        tables.forEach((t) => {
          const d = document.createElement('div');
          d.className = 'dbt';
          d.textContent = t;
          d.title = 'clique: SELECT * · duplo: só o nome';
          d.onclick = () => {
            document.getElementById('dbSql').value = 'SELECT * FROM ' + t + ' LIMIT 100';
            dbRunQuery();
          };
          box.appendChild(d);
        });
        if (!tables.length) box.innerHTML = '<div class="dbt" style="cursor:default;color:#667">sem tabelas</div>';
      }
      function dbRenderResult(r) {
        const box = document.getElementById('dbResult');
        const info = document.getElementById('dbResInfo');
        if (r.error) {
          box.innerHTML = '<div class="dberr">' + esc(r.error) + '</div>';
          info.textContent = '';
          return;
        }
        if (!r.columns || !r.columns.length) {
          box.innerHTML = '<div class="dbmsg">✓ OK' + (r.rowCount != null ? ' · ' + r.rowCount + ' linha(s) afetada(s)' : '') + '</div>';
          info.textContent = '';
          return;
        }
        const th = r.columns.map((c) => '<th>' + esc(c) + '</th>').join('');
        const trs = r.rows
          .map((row) => '<tr>' + r.columns.map((c) => '<td title="' + esc(fmtCell(row[c])) + '">' + esc(fmtCell(row[c])) + '</td>').join('') + '</tr>')
          .join('');
        box.innerHTML = '<table><thead><tr>' + th + '</tr></thead><tbody>' + trs + '</tbody></table>';
        info.textContent = r.rows.length + ' linha(s)' + (r.truncated ? ' (1000 primeiras)' : '');
      }
      function fmtCell(v) {
        if (v == null) return 'NULL';
        if (typeof v === 'object') return JSON.stringify(v);
        return String(v);
      }
      async function dbRunQuery() {
        const sql = document.getElementById('dbSql').value.trim();
        if (!sql) return;
        document.getElementById('dbResInfo').textContent = '⏳ rodando…';
        dbRenderResult(await window.api.dbQuery(sql));
      }
      document.getElementById('dbRun').onclick = dbRunQuery;
      document.getElementById('dbSql').addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          dbRunQuery();
        }
      });
      document.getElementById('dbAi').onclick = async () => {
        const q = await askName('O que você quer saber? (a Lumi escreve o SQL)', '');
        if (!q) return;
        document.getElementById('dbResInfo').textContent = '✦ pensando no SQL…';
        const r = await window.api.dbAiSql(q);
        if (r && r.error) return dbRenderResult({ error: r.error });
        document.getElementById('dbSql').value = r.sql; // mostra o SQL — você confere e roda
        document.getElementById('dbResInfo').textContent = '✦ revise e clique ▶ Rodar';
      };

      // ============================================================
      //  Painel .env: lista mascarada, revelar, editar, salvar
      // ============================================================
      const envOv = document.getElementById('envOv');
      const envFileEl = document.getElementById('envFile');
      const envListEl = document.getElementById('envList');
      let envRevealed = false;
      async function openEnv() {
        const files = await window.api.envList();
        if (!files.length) return toast('⚠ nenhum .env no workspace', false);
        envFileEl.innerHTML = '';
        files.forEach((f) => {
          const o = document.createElement('option');
          o.value = o.textContent = f;
          envFileEl.appendChild(o);
        });
        envRevealed = false;
        await envLoad();
        envOv.hidden = false;
      }
      async function envLoad() {
        const r = await window.api.envRead(envFileEl.value);
        envListEl.innerHTML = '';
        if (r && r.error) return (envListEl.innerHTML = '<div style="padding:14px;color:#ff9b9b">' + esc(r.error) + '</div>');
        (r.vars || []).forEach((v) => {
          const row = document.createElement('div');
          row.className = 'envrow';
          const k = document.createElement('span');
          k.className = 'ek';
          k.textContent = v.key;
          k.title = v.key;
          const inp = document.createElement('input');
          inp.className = 'ev';
          inp.type = envRevealed ? 'text' : 'password';
          inp.value = v.value;
          inp.dataset.key = v.key;
          row.appendChild(k);
          row.appendChild(inp);
          envListEl.appendChild(row);
        });
        if (!(r.vars || []).length) envListEl.innerHTML = '<div style="padding:14px;color:#667">arquivo vazio</div>';
      }
      envFileEl.addEventListener('change', envLoad);
      document.getElementById('envReveal').onclick = () => {
        envRevealed = !envRevealed;
        envListEl.querySelectorAll('.ev').forEach((i) => (i.type = envRevealed ? 'text' : 'password'));
      };
      document.getElementById('envSave').onclick = async () => {
        const vars = [...envListEl.querySelectorAll('.ev')].map((i) => ({ key: i.dataset.key, value: i.value }));
        const r = await window.api.envSave(envFileEl.value, vars);
        if (r && r.error) return toast('⚠ ' + r.error, false);
        toast('✓ ' + envFileEl.value + ' salvo');
        envOv.hidden = true;
      };
      document.getElementById('envClose').onclick = () => (envOv.hidden = true);
      envOv.addEventListener('mousedown', (e) => {
        if (e.target === envOv) envOv.hidden = true;
      });

      // túnel público disponível? (cloudflared/ngrok — checado 1x)
      let tunnelTool = null;
      window.api.tunnelCheck().then((t) => (tunnelTool = t));

      // ---- barrinha do docker-compose (up/down/restart/logs do compose do workspace) ----
      let composeFileName; // undefined = ainda não checado neste workspace
      async function refreshComposeBar() {
        if (composeFileName === undefined) composeFileName = await window.api.dockerComposeFile();
        const bar = document.getElementById('composeBar');
        if (!composeFileName) {
          bar.hidden = true;
          return;
        }
        if (bar.dataset.f !== composeFileName) {
          bar.dataset.f = composeFileName;
          bar.innerHTML = '';
          const lbl = document.createElement('span');
          lbl.className = 'cf';
          lbl.textContent = '🐙 ' + composeFileName;
          bar.appendChild(lbl);
          const mk = (label, args, title) => {
            const b = document.createElement('button');
            b.textContent = label;
            b.title = title;
            b.onclick = async () => {
              const r = await window.api.termCreate({ shell: 'docker', args: ['compose', '-f', composeFileName, ...args], title: 'compose' });
              if (r && r.error) toast(r.error, false);
            };
            bar.appendChild(b);
          };
          mk('▲ up', ['up', '-d'], 'docker compose up -d');
          mk('▼ down', ['down'], 'docker compose down');
          mk('🔄 restart', ['restart'], 'docker compose restart');
          mk('📜 logs', ['logs', '-f', '--tail', '100'], 'docker compose logs -f');
        }
        bar.hidden = false;
      }

      // ---- aba DOCKER: containers ao vivo + ações ----
      let lastDockerSig = '';
      async function loadDocker(force) {
        refreshComposeBar();
        const r = await window.api.dockerList();
        const tabEl = document.querySelector('.ptab[data-tab="docker"]');
        const running = r.ok ? r.containers.filter((c) => c.state === 'running').length : 0;
        if (tabEl) tabEl.textContent = 'DOCKER' + (r.ok && r.containers.length ? ' (' + running + '↑)' : '');
        if (panelTab !== 'docker') return;
        const sig = JSON.stringify(r);
        if (!force && sig === lastDockerSig) return; // nada mudou → não pisca
        lastDockerSig = sig;
        const tb = document.getElementById('dockerRows');
        tb.innerHTML = '';
        if (r.error) {
          tb.innerHTML = '<tr><td colspan="6" style="color:#9aa;padding:14px;text-align:center">🐳 ' + esc(r.error) + '</td></tr>';
          return;
        }
        if (!r.containers.length) {
          tb.innerHTML = '<tr><td colspan="6" style="color:#667;padding:14px;text-align:center">Nenhum container. (docker run/compose cria por aqui mesmo 😉)</td></tr>';
          return;
        }
        r.containers.forEach((c) => {
          const up = c.state === 'running';
          const tr = document.createElement('tr');
          tr.innerHTML =
            '<td><span class="dkdot' + (up ? ' up' : '') + '" title="' + esc(c.state) + '"></span></td>' +
            '<td><b>' + esc(c.name) + '</b></td><td title="' + esc(c.image) + '">' + esc(c.image) + '</td>' +
            '<td title="' + esc(c.status) + '">' + esc(c.status) + '</td><td title="' + esc(c.ports) + '">' + esc(c.ports || '—') + '</td>';
          const td = document.createElement('td');
          td.className = 'pact';
          const act = (label, title, fn, danger) => {
            const b = document.createElement('button');
            b.textContent = label;
            b.title = title;
            if (danger) b.className = 'danger';
            b.onclick = fn;
            td.appendChild(b);
          };
          const doAct = (action) => async () => {
            const res = await window.api.dockerAction(c.id, action);
            if (res && res.error) toast('⚠ ' + res.error, false);
            loadDocker(true);
          };
          if (up) act('⏹', 'Parar', doAct('stop'));
          else act('▶', 'Iniciar', doAct('start'));
          act('🔄', 'Reiniciar', doAct('restart'));
          act('📜', 'Logs ao vivo (terminal)', async () => {
            const t = await window.api.termCreate({ shell: 'docker', args: ['logs', '-f', '--tail', '200', c.id], title: 'logs:' + c.name });
            if (t && t.error) toast(t.error, false);
          });
          if (up)
            act('🐚', 'Shell dentro do container', async () => {
              const t = await window.api.termCreate({ shell: 'docker', args: ['exec', '-it', c.id, 'sh'], title: 'sh:' + c.name });
              if (t && t.error) toast(t.error, false);
            });
          act('✕', 'Remover container', async () => {
            if (!confirm('Remover o container "' + c.name + '"? (docker rm -f)')) return;
            doAct('rm')();
          }, true);
          tr.appendChild(td);
          tb.appendChild(tr);
        });
      }
      setInterval(() => {
        // ao vivo só com a aba aberta E a janela visível (em background não há pra quem mostrar)
        if (!document.hidden && !panel.hidden && panelTab === 'docker') loadDocker();
      }, 5000);
      function fitActive() {
        const u = activeTerm && termsUi.get(activeTerm);
        if (u) {
          try {
            u.fit.fit();
            window.api.termResize(activeTerm, u.term.cols, u.term.rows);
          } catch (e) {
            /* ok */
          }
        }
      }
      function renderTermSel() {
        termSel.innerHTML = '';
        for (const [id, u] of termsUi) {
          const o = document.createElement('option');
          o.value = id;
          o.textContent = id + ' · ' + u.title;
          termSel.appendChild(o);
        }
        if (activeTerm) termSel.value = activeTerm;
      }
      function selectTerm(id) {
        activeTerm = id;
        termsUi.forEach((u, k) => u.host.classList.toggle('active', k === id));
        renderTermSel();
        fitActive();
        const u = termsUi.get(id);
        if (u) u.term.focus();
      }
      function attachTerm(id, title, ptyMode, replay) {
        if (termsUi.has(id)) return selectTerm(id);
        if (!window.Terminal) return toast('xterm não carregou (reinstale as dependências)', false);
        const host = document.createElement('div');
        host.className = 'termhost';
        termBody.appendChild(host);
        const term = new Terminal({
          fontSize: 12.5,
          fontFamily: '"Cascadia Mono", Consolas, monospace',
          theme: xtermTheme(),
          cursorBlink: true,
          scrollback: 4000,
        });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        // URLs viram links clicáveis (ex.: o http://localhost:3000 do dev server)
        if (window.WebLinksAddon) term.loadAddon(new WebLinksAddon.WebLinksAddon((_ev, uri) => window.api.openExternal(uri)));
        term.open(host);
        if (ptyMode) {
          term.onData((d) => window.api.termInput(id, d)); // PTY real: teclas direto pro shell
        } else {
          // modo PIPE (sem node-pty): edição de linha local — eco aqui, envia no Enter
          let lineBuf = '';
          term.onData((d) => {
            for (const ch of d) {
              if (ch === '\r') {
                term.write('\r\n');
                window.api.termInput(id, lineBuf + '\n');
                lineBuf = '';
              } else if (ch === '\x7f') {
                if (lineBuf) {
                  lineBuf = lineBuf.slice(0, -1);
                  term.write('\b \b');
                }
              } else if (ch >= ' ') {
                lineBuf += ch;
                term.write(ch);
              }
            }
          });
        }
        termsUi.set(id, { term, fit, host, title });
        if (replay) term.write(replay);
        const wasHidden = panel.hidden;
        showPanel(true);
        // não rouba a aba se você está olhando as PORTAS (o terminal anexa em segundo plano)
        if (wasHidden || panelTab !== 'ports') setPanelTab('term');
        selectTerm(id);
      }

        attachTerm(d.id, d.title, d.pty, replay);
      });

      document.getElementById('termKillBtn').onclick = () => {

      // ---- aba PORTAS: processos escutando TCP, AO VIVO (poll com o painel visível) ----
      let lastPortsSig = '';
      let lastPortsSet = new Set();
      async function loadPorts(force) {
        const list = (await window.api.portsList()) || [];
        // contador no rótulo da aba (você vê mudar mesmo estando na aba TERMINAL)
        const tabEl = document.querySelector('.ptab[data-tab="ports"]');
        if (tabEl) tabEl.textContent = 'PORTAS' + (list.length ? ' (' + list.length + ')' : '');
        const sig = JSON.stringify(list);
        if (!force && sig === lastPortsSig && panelTab === 'ports') return; // nada mudou → não pisca a tabela
        const prev = lastPortsSet;
        lastPortsSig = sig;
        lastPortsSet = new Set(list.map((p) => p.port + ':' + p.pid));
        if (panelTab !== 'ports') return; // dados/badge sempre frescos; tabela só quando visível
        const tb = document.getElementById('portsRows');
        tb.innerHTML = '';
        if (!list.length) {
          tb.innerHTML = '<tr><td colspan="4" style="color:#667;padding:14px;text-align:center">Nenhuma porta TCP escutando.</td></tr>';
          return;
        }
        list.forEach((p) => {
          const tr = document.createElement('tr');
          if (prev.size && !prev.has(p.port + ':' + p.pid)) tr.classList.add('pnew'); // porta recém-aberta pisca verde
          tr.innerHTML = '<td><b>:' + p.port + '</b></td><td>' + esc(p.name || '?') + '</td><td>' + (p.pid || '—') + '</td>';
          const td = document.createElement('td');
          td.className = 'pact';
          const inApp = document.createElement('button');
          inApp.textContent = '🗔 aqui';
          inApp.title = 'Abrir no navegador embutido';
          inApp.onclick = () => openBrowserTab('http://localhost:' + p.port);
          td.appendChild(inApp);
          if (tunnelTool) {
            // túnel público em 1 clique — a URL aparece no terminal (e é clicável)
            const tun = document.createElement('button');
            tun.textContent = '🌍 expor';
            tun.title = 'Túnel público via ' + tunnelTool + ' — a URL aparece no terminal';
            tun.onclick = async () => {
              const args = tunnelTool === 'cloudflared' ? ['tunnel', '--url', 'http://localhost:' + p.port] : ['http', String(p.port)];
              const r = await window.api.termCreate({ shell: tunnelTool, args, title: '🌍 :' + p.port });
              if (r && r.error) toast(r.error, false);
            };
            td.appendChild(tun);
          }
          const open = document.createElement('button');
          open.textContent = '↗ abrir';
          open.title = 'Abrir no navegador do sistema';
          open.onclick = () => window.api.portsOpen(p.port);
          td.appendChild(open);
          if (p.pid) {
            const kill = document.createElement('button');
            kill.textContent = '✕ matar';
            kill.className = 'danger';
            kill.onclick = async () => {
              if (!confirm('Matar o processo ' + (p.name || '') + ' (PID ' + p.pid + ')?')) return;
              const r = await window.api.portsKill(p.pid);
              if (r && r.error) toast(r.error, false);
              loadPorts(true);
            };
            td.appendChild(kill);
          }
          tr.appendChild(td);
          tb.appendChild(tr);
        });
      }
      // poll de portas: netstat é caro, então só roda com a janela VISÍVEL e o painel aberto;
      // na aba PORTAS a 3s (responsivo), nas outras a cada ~9s (só atualiza o badge de contagem)
      let portsTick = 0;

      // ---- busca global no projeto (Ctrl+Shift+F) ----
      const searchRow = document.getElementById('searchRow');
      const wsSearch = document.getElementById('wsSearch');
      let searchMode = false;
      function toggleSearch(on) {

      async function runWsSearch() {
        const q = wsSearch.value.trim();
        if (q.length < 2) return drawTree();
        const { results, truncated } = await window.api.searchWorkspace(q);
        tree.innerHTML = '';
        if (!results.length) {
          tree.innerHTML = '<div id="empty">Nada encontrado.</div>';
          return;
        }
        let lastFile = null;
        results.forEach((r) => {
          if (r.path !== lastFile) {
            lastFile = r.path;
            const f = document.createElement('div');
            f.className = 'sresfile';
            f.textContent = r.path;
            f.title = r.path;
            f.onclick = () => openFile(r.path);
            tree.appendChild(f);
          }
          const l = document.createElement('div');
          l.className = 'sresline';
          const i = r.text.toLowerCase().indexOf(q.toLowerCase());
          l.innerHTML =
            r.line + ':  ' +
            (i >= 0 ? esc(r.text.slice(0, i)) + '<b>' + esc(r.text.slice(i, i + q.length)) + '</b>' + esc(r.text.slice(i + q.length)) : esc(r.text));
          l.onclick = async () => {
            await openFile(r.path);
            if (editor && !isImage) {
              editor.revealLineInCenter(r.line);
              editor.setPosition({ lineNumber: r.line, column: r.col });
              editor.focus();
            }
          };
          tree.appendChild(l);
        });
        if (truncated) {
          const d = document.createElement('div');
          d.className = 'sresline';
          d.textContent = '… resultados limitados a 400';
          tree.appendChild(d);
        }
      }

      // ---- git status no explorer (cores estilo VS Code) + branch na statusbar ----
      let gitMap = {};

      async function loadGit() {

      // ============================================================
      //  Controle de fontes (painel git, estilo VS Code)

      const gitviewEl = document.getElementById('gitview');

      const gitAiBtn = document.getElementById('gitAiBtn');
      const gitCommitBtn = document.getElementById('gitCommitBtn');
      const gitBranchNameEl = document.getElementById('gitBranchName');
      const gitSyncEl = document.getElementById('gitSync');
      const btnGit = document.getElementById('btnGit');
      const btnFiles = document.getElementById('btnFiles');
      let sideMode = 'files'; // 'files' (explorer) | 'git'

      function setSideMode(m) {

      async function loadGitPanel() {
        const st = await window.api.gitPanelStatus();
        gitSt = st && !st.error ? st : null;
        if (!gitSt) {
          gitBranchNameEl.textContent = '—';
          gitSyncEl.textContent = '';
          gitListsEl.innerHTML = '<div id="gitEmpty">' + esc((st && st.error) || 'git indisponível') + '</div>';
          return;
        }
        gitBranchNameEl.textContent = st.branch;
        gitSyncEl.textContent = (st.ahead ? '↑' + st.ahead : '') + (st.behind ? ' ↓' + st.behind : '');
        gitListsEl.innerHTML = '';
        if (!st.staged.length && !st.unstaged.length) {
          gitListsEl.innerHTML = '<div id="gitEmpty">Nenhuma alteração ✨</div>';
        } else {
          if (st.staged.length) gitListsEl.appendChild(gitSection('Preparadas (staged)', st.staged, true));
          if (st.unstaged.length) gitListsEl.appendChild(gitSection('Alterações', st.unstaged, false));
        }

        refreshGh(); // GitHub (gh CLI): status do CI, botão de PR e lista de PRs

      // ---- GitHub via gh CLI (dormente se o gh não estiver instalado/autenticado) ----

      document.getElementById('ghPrBtn').onclick = async () => {

      async function gitAct(promise) {
        const r = await promise;

        loadGitPanel();

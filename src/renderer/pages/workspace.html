<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Workspace</title>
    <style>
      * { box-sizing: border-box; }
      :root {
        --bg: #16161e; --surface: #24242f; --surface-2: #0f0f16;
        --accent: #7aa2ff; --accent-text: #fff; --text: #eee; --border: #2a2a38;
      }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #top {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }
      #top .path { flex: 1; font-size: 12px; color: #9aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #top button {
        border: 1px solid var(--border);
        border-radius: 7px;
        background: transparent;
        color: color-mix(in srgb, var(--text) 85%, transparent);
        padding: 5px 11px;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s, color 0.12s;
      }
      #top button:hover {
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
        color: var(--text);
      }
      #save {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      #save:hover { background: color-mix(in srgb, var(--accent) 85%, #fff); color: var(--accent-text); }
      #toggleChat.on, #toggleTerm.on {
        background: color-mix(in srgb, var(--accent) 22%, transparent);
        border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
        color: var(--text);
      }
      #main { flex: 1; display: flex; min-height: 0; }
      #side {
        width: 250px; flex: 0 0 auto; display: flex; flex-direction: column;
        background: var(--surface-2); border-right: 1px solid var(--border);
      }
      #sidebar {
        display: flex; align-items: center; gap: 2px; padding: 5px 8px;
        border-bottom: 1px solid var(--border); font-size: 11px; color: #9aa; text-transform: uppercase; letter-spacing: 0.3px;
      }
      #sidebar .ttl { flex: 1; }
      #sidebar .tb {
        width: 24px; height: 24px; border: none; background: transparent; color: #9aa; cursor: pointer;
        border-radius: 5px; display: flex; align-items: center; justify-content: center;
      }
      #sidebar .tb:hover { background: var(--surface); color: var(--text); }
      #sidebar .tb svg { width: 15px; height: 15px; }
      #tree { flex: 1; overflow: auto; padding: 4px 0; font-size: 13px; }
      .item {
        display: flex; align-items: center; gap: 4px; padding: 2px 8px; cursor: pointer;
        white-space: nowrap; overflow: hidden; user-select: none; height: 24px;
      }
      .item:hover { background: var(--surface); }
      .item.active { background: color-mix(in srgb, var(--accent) 22%, transparent); }
      .item.drop-target { background: color-mix(in srgb, var(--accent) 38%, transparent); outline: 1px dashed var(--accent); outline-offset: -2px; }
      .item.dragging { opacity: 0.45; }
      #tree.drop-root { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 6px; }
      .item .chev { width: 14px; height: 14px; flex: 0 0 auto; color: #889; display: flex; align-items: center; justify-content: center; transition: transform 0.12s; }
      .item .chev.open { transform: rotate(90deg); }
      .item .chev svg { width: 12px; height: 12px; }
      .item .ic { width: 16px; height: 16px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
      .item .ic svg { width: 15px; height: 15px; }
      .item.dir .ic { color: var(--accent); }
      .item:not(.dir) .ic { color: #8fa3b8; }
      .item .nm { overflow: hidden; text-overflow: ellipsis; }
      #edcol { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #editor { flex: 1; min-width: 0; min-height: 0; }
      /* abas de arquivos (estilo VS Code) */
      #tabs {
        display: flex;
        overflow-x: auto;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        scrollbar-width: thin;
      }
      #tabs:empty { display: none; }
      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 7px 6px 10px;
        font-size: 12px;
        cursor: pointer;
        border-right: 1px solid var(--border);
        white-space: nowrap;
        color: #9aa;
        max-width: 190px;
        user-select: none;
      }
      .tab:hover { background: var(--surface); }
      .tab.active {
        background: var(--bg);
        color: var(--text);
        box-shadow: inset 0 2px 0 var(--accent);
      }
      .tab .ticon svg { width: 13px; height: 13px; display: block; }
      .tab .tname { overflow: hidden; text-overflow: ellipsis; }
      .tab .tx {
        border: none;
        background: transparent;
        color: #778;
        width: 17px;
        height: 17px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 10px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }
      .tab .tx:hover { background: var(--border); color: var(--text); }
      .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: none; flex: 0 0 auto; margin: 0 4px; }
      .tab.dirty .dot { display: block; }
      .tab.dirty .tx { display: none; }
      .tab.dirty:hover .tx { display: flex; }
      .tab.dirty:hover .dot { display: none; }
      /* barra de status (linha/coluna, linguagem) */
      #statusbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 10px;
        height: 22px;
        font-size: 11px;
        color: #9aa;
        background: var(--surface-2);
        border-top: 1px solid var(--border);
        flex: 0 0 auto;
        white-space: nowrap;
        overflow: hidden;
      }
      #sbLeft { overflow: hidden; text-overflow: ellipsis; }
      /* painel do chat (iframe reaproveitando chat.html) */
      #chatresize {
        width: 5px; flex: 0 0 auto; cursor: col-resize; background: var(--border);
        transition: background 0.15s;
      }
      #chatresize:hover { background: var(--accent); }
      #chatpane {
        width: 400px; flex: 0 0 auto; display: flex; flex-direction: column;
        border-left: 1px solid var(--border); background: var(--bg); min-width: 0;
      }
      #chatpane.hidden, #chatresize.hidden { display: none; }
      #chatframe { flex: 1; width: 100%; border: none; background: var(--bg); }
      #preview {
        flex: 1; min-width: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; overflow: auto; padding: 16px; background: var(--surface-2);
        background-image: linear-gradient(45deg, #1c1c26 25%, transparent 25%), linear-gradient(-45deg, #1c1c26 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #1c1c26 75%), linear-gradient(-45deg, transparent 75%, #1c1c26 75%);
        background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      }
      #preview img { max-width: 100%; max-height: calc(100% - 30px); object-fit: contain; border-radius: 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); }
      #previewMeta { font-size: 12px; color: #9aa; background: rgba(0, 0, 0, 0.4); padding: 4px 10px; border-radius: 6px; }
      #empty { margin: 16px auto; color: #667; font-size: 13px; text-align: center; padding: 10px; }
      /* menu de contexto (mesmo visual dos dropdowns) */
      .ctxmenu {
        position: fixed;
        z-index: 200;
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        backdrop-filter: blur(16px);
        border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
        border-radius: 12px;
        padding: 6px;
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55), 0 2px 10px rgba(0, 0, 0, 0.35);
        min-width: 172px;
        font-size: 12.5px;
        animation: menuIn 0.13s ease;
      }
      .ctxmenu .mi {
        padding: 7px 10px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 9px;
        transition: background 0.1s;
      }
      .ctxmenu .mi svg { width: 14px; height: 14px; flex: 0 0 auto; color: color-mix(in srgb, var(--text) 62%, transparent); }
      .ctxmenu .mi:hover { background: color-mix(in srgb, var(--accent) 17%, transparent); }
      .ctxmenu .mi:hover svg { color: var(--accent); }
      .ctxmenu .mi.danger { color: #ff9b9b; }
      .ctxmenu .mi.danger:hover { background: color-mix(in srgb, #e0556e 18%, transparent); }
      .ctxmenu .mi.danger svg { color: #ff9b9b; }
      /* modal de nome */
      .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 300; }
      .modal .box {
        background: color-mix(in srgb, var(--surface) 96%, transparent);
        border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
        border-radius: 14px;
        padding: 18px;
        width: 330px;
        max-width: 90%;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        animation: menuIn 0.15s ease;
      }
      .modal .t { font-size: 13px; margin-bottom: 10px; color: var(--text); }
      .modal input { width: 100%; padding: 9px 10px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface-2); color: var(--text); font-size: 13px; font-family: inherit; outline: none; }
      .modal .b { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
      .modal .b button { border: none; border-radius: 7px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
      .modal .b .cancel { background: var(--border); color: #fff; }
      .modal .b .ok { background: var(--accent); color: var(--accent-text); }
      /* barra de menus (refinada) */
      #menubar {
        display: flex;
        align-items: center;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
        font-size: 12.5px;
        user-select: none;
        position: relative;
        z-index: 150;
        padding: 3px 6px;
        gap: 1px;
      }
      .mlabel {
        padding: 4px 10px;
        cursor: pointer;
        color: color-mix(in srgb, var(--text) 80%, transparent);
        border-radius: 6px;
        transition: background 0.12s, color 0.12s;
      }
      .mlabel:hover { background: var(--surface); color: var(--text); }
      .mlabel.open {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        color: var(--text);
      }
      .mdrop {
        position: absolute;
        top: calc(100% + 4px);
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        backdrop-filter: blur(16px);
        border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
        border-radius: 12px;
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55), 0 2px 10px rgba(0, 0, 0, 0.35);
        min-width: 264px;
        padding: 6px;
        z-index: 200;
        animation: menuIn 0.13s ease;
      }
      @keyframes menuIn {
        from { opacity: 0; transform: translateY(-5px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      .mitem {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 10px;
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
        color: var(--text);
        transition: background 0.1s;
      }
      .mitem:hover { background: color-mix(in srgb, var(--accent) 17%, transparent); }
      .mitem:active { background: color-mix(in srgb, var(--accent) 28%, transparent); }
      .mitem .mic {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        color: color-mix(in srgb, var(--text) 62%, transparent);
      }
      .mitem:hover .mic { color: var(--accent); }
      .mitem .mic svg { width: 14px; height: 14px; }
      .mitem .mtx { flex: 1; overflow: hidden; text-overflow: ellipsis; }
      .mitem .mhint {
        font-size: 10px;
        color: #98a;
        background: color-mix(in srgb, var(--surface-2) 80%, transparent);
        border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
        border-radius: 5px;
        padding: 1px 6px;
        font-family: Consolas, monospace;
      }
      .msep { height: 1px; background: color-mix(in srgb, var(--border) 75%, transparent); margin: 5px 10px; }
      .mhead { padding: 6px 10px 3px; font-size: 9.5px; text-transform: uppercase; color: #788; letter-spacing: 0.6px; font-weight: 600; }
      /* painel inferior: TERMINAL + PORTAS (estilo VS Code) */
      #panelResize { height: 4px; cursor: row-resize; background: var(--border); flex: 0 0 auto; }
      #panelResize:hover { background: var(--accent); }
      #panelResize[hidden], #panel[hidden] { display: none; }
      #panel {
        height: 230px; min-height: 80px; flex: 0 0 auto; display: flex; flex-direction: column;
        background: var(--surface-2); border-top: 1px solid var(--border);
      }
      #panelHead { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
      .ptab { font-size: 11px; letter-spacing: 0.4px; padding: 6px 8px 5px; cursor: pointer; color: #9aa; border-bottom: 2px solid transparent; user-select: none; }
      .ptab.active { color: var(--text); border-bottom-color: var(--accent); }
      .pgrow { flex: 1; }
      #termSel { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; padding: 3px 6px; max-width: 170px; }
      .pbtn { width: 24px; height: 24px; border: none; background: transparent; color: #9aa; border-radius: 5px; cursor: pointer; font-size: 12px; padding: 0; }
      .pbtn:hover { background: var(--surface); color: var(--text); }
      #termBody { flex: 1; min-height: 0; position: relative; }
      .termhost { position: absolute; inset: 4px 0 0 8px; display: none; }
      .termhost.active { display: block; }
      #portsBody { flex: 1; overflow: auto; padding: 6px 10px; }
      #portsBody table { width: 100%; border-collapse: collapse; font-size: 12px; }
      #portsBody th { text-align: left; color: #9aa; font-size: 10px; text-transform: uppercase; padding: 4px 8px; border-bottom: 1px solid var(--border); }
      #portsBody td { padding: 5px 8px; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
      #portsBody .pact { display: flex; gap: 6px; }
      #portsBody .pact button { border: none; border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer; background: var(--border); color: var(--text); }
      #portsBody .pact button:hover { background: var(--accent); color: var(--accent-text); }
      #portsBody .pact button.danger:hover { background: #e0556e; color: #fff; }
      #portsBody tr.pnew { animation: pnewFlash 1.8s ease; }
      @keyframes pnewFlash {
        from { background: color-mix(in srgb, #7ee0a0 28%, transparent); }
        to { background: transparent; }
      }
      /* git status no explorer */
      .item .nm.git-M { color: #e2c08d; }
      .item .nm.git-A, .item .nm.git-U { color: #73c991; }
      .item .nm.git-D { color: #f48771; text-decoration: line-through; }
      .item .gitdot { width: 6px; height: 6px; border-radius: 50%; background: #e2c08d; flex: 0 0 auto; margin-left: auto; margin-right: 6px; }
      /* busca global no projeto */
      #searchRow { padding: 6px 8px; border-bottom: 1px solid var(--border); display: none; gap: 4px; }
      #searchRow.on { display: flex; }
      #searchRow input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 8px; font-size: 12px; outline: none; font-family: inherit; }
      #searchRow input:focus { border-color: var(--accent); }
      .sresfile { padding: 5px 8px 2px; font-weight: 600; font-size: 12px; color: var(--accent); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sresline { padding: 2px 8px 2px 18px; font-size: 11px; color: #aab; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: Consolas, monospace; }
      .sresline:hover { background: var(--surface); }
      .sresline b { color: var(--text); background: color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 2px; font-weight: 600; }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 6px; }
    </style>
    <link rel="stylesheet" href="../../../node_modules/@xterm/xterm/css/xterm.css" />
  </head>
  <body>
    <div id="menubar"></div>
    <div id="top">
      <span class="path" id="curpath">Nenhum arquivo aberto</span>
      <button id="toggleTerm" title="Terminal (Ctrl+`)">⌨ Terminal</button>
      <button id="toggleChat" class="on" title="Mostrar/ocultar o chat da Lumi">💬 Chat</button>
      <button id="save" title="Salvar (Ctrl+S)">💾 Salvar</button>
    </div>
    <div id="main">
      <div id="side">
        <div id="sidebar">
          <span class="ttl" id="rootname">Explorer</span>
          <button class="tb" id="newFile" title="Novo arquivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 18v-6"/></svg></button>
          <button class="tb" id="newFolder" title="Nova pasta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></button>
          <button class="tb" id="collapse" title="Recolher tudo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg></button>
          <button class="tb" id="refresh" title="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
          <button class="tb" id="btnSearch" title="Buscar no projeto (Ctrl+Shift+F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
        </div>
        <div id="searchRow"><input id="wsSearch" type="text" placeholder="Buscar no projeto..." spellcheck="false" /></div>
        <div id="tree"></div>
      </div>
      <div id="edcol">
        <div id="tabs"></div>
        <div id="editor"></div>
        <div id="preview"><img id="previewImg" alt="" /><div id="previewMeta"></div></div>
        <div id="panelResize" hidden title="Arraste para redimensionar"></div>
        <div id="panel" hidden>
          <div id="panelHead">
            <span class="ptab active" data-tab="term">TERMINAL</span>
            <span class="ptab" data-tab="ports">PORTAS</span>
            <span class="pgrow"></span>
            <select id="termSel" title="Terminais abertos"></select>
            <button class="pbtn" id="termNew" title="Novo terminal">＋</button>
            <button class="pbtn" id="termKillBtn" title="Matar o terminal atual">🗑</button>
            <button class="pbtn" id="panelClose" title="Fechar painel (Ctrl+`)">✕</button>
          </div>
          <div id="termBody"></div>
          <div id="portsBody" hidden>
            <table>
              <thead><tr><th>Porta</th><th>Processo</th><th>PID</th><th>Ações</th></tr></thead>
              <tbody id="portsRows"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div id="chatresize" title="Arraste para redimensionar"></div>
      <div id="chatpane"><iframe id="chatframe" src="chat.html" title="Chat da Lumi"></iframe></div>
    </div>
    <div id="statusbar"><span id="sbLeft">Lumi Workspace</span><span id="sbRight"></span></div>

    <script src="../../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script>
      const CDN = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min';
      self.MonacoEnvironment = {
        getWorkerUrl: function () {
          return (
            'data:text/javascript;charset=utf-8,' +
            encodeURIComponent("self.MonacoEnvironment={baseUrl:'" + CDN + "/'};importScripts('" + CDN + "/vs/base/worker/workerMain.js');")
          );
        },
      };

      const tree = document.getElementById('tree');
      const curpath = document.getElementById('curpath');
      const editorEl = document.getElementById('editor');
      const previewEl = document.getElementById('preview');
      const previewImg = document.getElementById('previewImg');
      const previewMeta = document.getElementById('previewMeta');
      let editor = null;
      let current = null;
      let isImage = false;
      let treeData = [];
      let dragSrc = null;
      const expanded = new Set();
      const IMG_EXT = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'ico', 'svg', 'avif'];
      const LANG = {
        js: 'javascript', mjs: 'javascript', cjs: 'javascript', ts: 'typescript', tsx: 'typescript', jsx: 'javascript',
        json: 'json', html: 'html', css: 'css', scss: 'scss', md: 'markdown', py: 'python', go: 'go', rs: 'rust',
        java: 'java', kt: 'kotlin', c: 'c', cpp: 'cpp', h: 'cpp', cs: 'csharp', sh: 'shell', yml: 'yaml', yaml: 'yaml',
        xml: 'xml', php: 'php', rb: 'ruby', sql: 'sql', swift: 'swift', dart: 'dart', vue: 'html', svelte: 'html',
      };
      const langOf = (p) => LANG[(p.split('.').pop() || '').toLowerCase()] || 'plaintext';
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      const FILE_ICONS = {};
      (function () {

        set(['js', 'mjs', 'cjs'], badge('JS', '#e8d44d', '#1c1c1c'));

        set(['c'], badge('C', '#519aba', '#fff'));

        set(['vue'], badge('V', '#41b883', '#fff'));
        set(['svelte'], badge('S', '#ff3e00', '#fff'));
        set(['sql', 'db', 'sqlite'], GLYPH.db('#e38c00'));
        set(['sh', 'bash', 'bat', 'cmd'], GLYPH.term('#89e051'));
        set(['ps1'], GLYPH.term('#0273b9'));
        set(['yml', 'yaml'], badge('Y', '#a074c4', '#fff'));
        set(['toml', 'ini', 'env', 'conf', 'cfg', 'properties'], GLYPH.gear('#9aa9b8'));
        set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'ico', 'bmp', 'avif'], GLYPH.img('#b07ae0'));

      })();
      const iconFor = (name) => FILE_ICONS[(name.split('.').pop() || '').toLowerCase()] || SVG.file;

      const SVG = {
        chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
        folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>',
        folderOpen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>',
        file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>',
      };

      async function loadTree() {
        const [td] = await Promise.all([window.api.getWorkspaceFullTree(), loadGit()]);
        treeData = td || [];
        drawTree();
      }
      function drawTree() {
        if (searchMode && wsSearch.value.trim().length >= 2) return; // não clobra os resultados da busca
        tree.innerHTML = '';
        if (!treeData.length) {
          tree.innerHTML = '<div id="empty">Defina o workspace no<br>Modo arquiteto.</div>';
          return;
        }
        renderNodes(treeData, tree, 0);
      }
      function renderNodes(nodes, container, depth) {
        nodes.forEach((node) => {
          const row = document.createElement('div');
          row.className = 'item' + (node.dir ? ' dir' : '') + (node.path === current ? ' active' : '');
          row.style.paddingLeft = 6 + depth * 12 + 'px';
          if (depth) {
            // indent guides (linhas de hierarquia, estilo VS Code)
            row.style.backgroundImage = 'repeating-linear-gradient(to right, transparent 0 11px, color-mix(in srgb, var(--border) 60%, transparent) 11px 12px)';
            row.style.backgroundSize = depth * 12 + 'px 100%';
            row.style.backgroundRepeat = 'no-repeat';
          }
          const open = node.dir && expanded.has(node.path);
          const chev = node.dir ? '<span class="chev' + (open ? ' open' : '') + '">' + SVG.chev + '</span>' : '<span class="chev"></span>';
          const icon = node.dir
            ? '<span class="ic">' + (open ? SVG.folderOpen : SVG.folder) + '</span>'
            : '<span class="ic">' + iconFor(node.name) + '</span>';
          const g = gitMap[node.path]; // status git: M/A/U/D (arquivo) ou 'dir' (tem mudanças dentro)
          const nmCls = g && g !== 'dir' ? ' git-' + g : '';
          const dot = node.dir && g ? '<span class="gitdot"></span>' : '';
          row.innerHTML = chev + icon + '<span class="nm' + nmCls + '">' + esc(node.name) + '</span>' + dot;
          row.title = node.path;
          row.addEventListener('click', () => (node.dir ? toggle(node.path) : openFile(node.path)));
          row.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showMenu(e, node);
          });
          // ---- drag & drop (mover) ----
          row.draggable = true;
          row.addEventListener('dragstart', (e) => {
            dragSrc = node.path;
            row.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            try {
              e.dataTransfer.setData('text/plain', node.path);
            } catch (_) {}
          });
          row.addEventListener('dragend', () => {
            row.classList.remove('dragging');
            dragSrc = null;
          });
          if (node.dir) {
            // pastas são alvo de soltura (move pra dentro)
            row.addEventListener('dragover', (e) => {
              if (!dragSrc || dragSrc === node.path) return;
              e.preventDefault();
              e.dataTransfer.dropEffect = 'move';
              row.classList.add('drop-target');
            });
            row.addEventListener('dragleave', () => row.classList.remove('drop-target'));
            row.addEventListener('drop', (e) => {
              e.preventDefault();
              e.stopPropagation();
              row.classList.remove('drop-target');
              doMove(dragSrc, node.path);
            });
          }
          container.appendChild(row);
          if (open && node.children && node.children.length) renderNodes(node.children, container, depth + 1);
        });
      }
      function toggle(p) {
        if (expanded.has(p)) expanded.delete(p);
        else expanded.add(p);
        drawTree();
      }

      const toast = (m, ok) => (window.__lumiToast ? window.__lumiToast(m, ok) : (curpath.textContent = m));

      // ---------- abas de arquivos (estilo VS Code) ----------
      const tabsBar = document.getElementById('tabs');
      const sbLeft = document.getElementById('sbLeft');
      const sbRight = document.getElementById('sbRight');
      const openTabs = []; // [{path, model?, viewState?, savedVer?, dirty, image?, url?, bytes?}]
      let active = null; // path da aba ativa
      const baseName = (p) => p.split('/').pop();
      const findTab = (p) => openTabs.find((t) => t.path === p);

      function renderTabs() {
        tabsBar.innerHTML = '';
        openTabs.forEach((t) => {
          const el = document.createElement('div');
          el.className = 'tab' + (t.path === active ? ' active' : '') + (t.dirty ? ' dirty' : '');
          el.title = t.path;
          el.innerHTML =
            '<span class="ticon">' + iconFor(baseName(t.path)) + '</span>' +
            '<span class="tname">' + esc(baseName(t.path)) + '</span>' +
            '<span class="dot"></span><button class="tx" title="Fechar (clique do meio)">✕</button>';
          el.addEventListener('click', (e) => {
            if (!e.target.closest('.tx')) activate(t.path);
          });
          el.addEventListener('auxclick', (e) => {
            if (e.button === 1) {
              e.preventDefault();
              closeTab(t.path);
            }
          });
          el.querySelector('.tx').addEventListener('click', (e) => {
            e.stopPropagation();
            closeTab(t.path);
          });
          tabsBar.appendChild(el);
        });
      }
      function updateDirty(t) {
        const d = !!(t.model && t.model.getAlternativeVersionId() !== t.savedVer);
        if (d !== t.dirty) {
          t.dirty = d;
          renderTabs();
        }
      }
      function updateStatus() {
        const t = active && findTab(active);
        const git = gitBranch ? '⎇ ' + gitBranch + (gitChanges ? ' • ' + gitChanges + '±' : '') + '   ' : '';
        sbLeft.textContent = git + (active || 'Lumi Workspace');
        if (!t) sbRight.textContent = '';
        else if (t.image) sbRight.textContent = 'imagem · ' + fmtBytes(t.bytes || 0);
        else {
          const pos = editor && editor.getPosition();
          sbRight.textContent = (pos ? 'Ln ' + pos.lineNumber + ', Col ' + pos.column + '   ·   ' : '') + langOf(t.path);
        }
      }
      function showNothing() {
        active = null;
        current = null;
        window.api.setEditorActive('');
        curpath.textContent = 'Nenhum arquivo aberto';
        previewEl.style.display = 'none';
        editorEl.style.display = 'block';
        if (editor) editor.setModel(monaco.editor.createModel('', 'plaintext'));
        renderTabs();
        updateStatus();
      }
      function activate(p) {
        const t = findTab(p);
        if (!t) return;
        if (active && active !== p) {
          const prev = findTab(active);
          if (prev && prev.model && editor) prev.viewState = editor.saveViewState(); // memoriza cursor/scroll
        }
        if (t.stale) refreshTab(t); // arquivo mudou no disco enquanto a aba estava em segundo plano
        active = p;
        current = p;
        isImage = !!t.image;
        curpath.textContent = p;
        if (t.image) {
          editorEl.style.display = 'none';
          previewEl.style.display = 'flex';
          previewImg.src = t.url;
          previewImg.onload = () =>
            (previewMeta.textContent = previewImg.naturalWidth + ' × ' + previewImg.naturalHeight + ' px  ·  ' + fmtBytes(t.bytes));
        } else {
          previewEl.style.display = 'none';
          editorEl.style.display = 'block';
          if (editor) {
            editor.setModel(t.model);
            if (t.viewState) editor.restoreViewState(t.viewState);
            editor.focus();
          }
        }
        renderTabs();
        drawTree();
        updateStatus();
        window.api.setEditorActive(t.image ? '' : p); // o chat mostra/anexa o arquivo ativo
      }
      function closeTab(p, force) {
        const i = openTabs.findIndex((t) => t.path === p);
        if (i < 0) return;
        const t = openTabs[i];
        if (!force && t.dirty && !confirm('"' + baseName(p) + '" tem alterações não salvas. Fechar mesmo assim?')) return;
        if (t.model) t.model.dispose();
        openTabs.splice(i, 1);
        if (active === p) {
          const next = openTabs[i] || openTabs[i - 1];
          if (next) activate(next.path);
          else showNothing();
        } else renderTabs();
      }

      async function openFile(rel) {
        let t = findTab(rel);
        if (!t) {
          const ext = (rel.split('.').pop() || '').toLowerCase();
          if (IMG_EXT.includes(ext)) {
            const r = await window.api.readWorkspaceImage(rel);
            if (!r || !r.url) return toast('⚠ não consegui abrir ' + rel, false);
            t = { path: rel, image: true, url: r.url, bytes: r.bytes, dirty: false };
          } else {
            const content = await window.api.readWorkspaceFile(rel);
            if (content == null) return;
            const model = monaco.editor.createModel(content, langOf(rel));
            t = { path: rel, model, savedVer: model.getAlternativeVersionId(), dirty: false };
            model.onDidChangeContent(() => updateDirty(t));
          }
          openTabs.push(t);
        }
        activate(rel);
      }

      async function save() {
        const t = active && findTab(active);
        if (!t || t.image || !editor) return;
        const ok = await window.api.writeWorkspaceFile(t.path, t.model.getValue());
        if (ok) {
          t.savedVer = t.model.getAlternativeVersionId();
          t.dirty = false;
          renderTabs();
          toast('✓ ' + baseName(t.path) + ' salvo');
        } else toast('⚠ erro ao salvar', false);
      }

      // ---- modal de nome (prompt não funciona no Electron) ----
      function askName(title, initial) {
        return new Promise((resolve) => {
          const ov = document.createElement('div');
          ov.className = 'modal';
          ov.innerHTML =
            '<div class="box"><div class="t">' + esc(title) + '</div><input type="text" spellcheck="false" />' +
            '<div class="b"><button class="cancel">Cancelar</button><button class="ok">OK</button></div></div>';
          document.body.appendChild(ov);
          const inp = ov.querySelector('input');
          inp.value = initial || '';
          inp.focus();
          inp.select();
          const done = (v) => {
            ov.remove();
            resolve(v);
          };
          ov.querySelector('.ok').onclick = () => done(inp.value.trim() || null);
          ov.querySelector('.cancel').onclick = () => done(null);
          ov.addEventListener('mousedown', (e) => {
            if (e.target === ov) done(null);
          });
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              done(inp.value.trim() || null);
            } else if (e.key === 'Escape') done(null);
          });
        });
      }

      // ---- menu de contexto ----
      let curMenu = null;
      function closeMenu() {
        if (curMenu) {
          curMenu.remove();
          curMenu = null;
        }
      }
      document.addEventListener('click', closeMenu);
      function showMenu(e, node) {
        closeMenu();
        const m = document.createElement('div');
        m.className = 'ctxmenu';
        const items = [];
        if (node.dir) {
          items.push(['Novo arquivo', () => newEntry(node.path, false), false, MI.filePlus]);
          items.push(['Nova pasta', () => newEntry(node.path, true), false, MI.folderPlus]);
        }
        items.push(['Renomear', () => renameEntry(node), false, MI.pencil]);
        items.push(['Revelar no Explorer', () => window.api.revealInExplorer(node.path), false, MI.reveal]);
        items.push(['Excluir', () => delEntry(node), true, MI.trash]);
        items.forEach(([label, fn, danger, icon]) => {
          const it = document.createElement('div');
          it.className = 'mi' + (danger ? ' danger' : '');
          it.innerHTML = (icon || '') + '<span></span>';
          it.lastChild.textContent = label;
          it.onclick = () => {
            closeMenu();
            fn();
          };
          m.appendChild(it);
        });
        m.style.left = Math.min(e.clientX, window.innerWidth - 160) + 'px';
        m.style.top = e.clientY + 'px';
        document.body.appendChild(m);
        curMenu = m;
      }

      // ---- operações de arquivo ----
      async function newEntry(parentRel, isDir) {
        const name = await askName(isDir ? 'Nome da nova pasta' : 'Nome do novo arquivo', '');
        if (!name) return;
        const rel = parentRel ? parentRel + '/' + name : name;
        const r = await window.api.createWorkspaceEntry(rel, isDir);
        if (r && r.error) {
          curpath.textContent = '⚠ ' + r.error;
          return;
        }
        if (parentRel) expanded.add(parentRel);
        await loadTree();
        if (!isDir) openFile(rel);
      }
      // troca o prefixo dos caminhos das abas quando algo é renomeado/movido (inclui filhos de pastas)
      function retargetTabs(oldPath, newPath) {
        let activeChanged = false;
        openTabs.forEach((t) => {
          if (t.path === oldPath || t.path.startsWith(oldPath + '/')) {
            const np = newPath + t.path.slice(oldPath.length);
            if (t.path === active) {
              active = np;
              current = np;
              curpath.textContent = np;
              activeChanged = true;
            }
            t.path = np;
          }
        });
        renderTabs();
        if (activeChanged) updateStatus();
      }
      async function renameEntry(node) {
        const name = await askName('Novo nome', node.name);
        if (!name || name === node.name) return;
        const r = await window.api.renameWorkspaceEntry(node.path, name);
        if (r && r.error) return toast('⚠ ' + r.error, false);
        if (r && r.path) retargetTabs(node.path, r.path);
        await loadTree();
      }
      async function delEntry(node) {
        if (!confirm('Excluir "' + node.name + '"' + (node.dir ? ' e todo o conteúdo' : '') + '? Não dá pra desfazer.')) return;
        const r = await window.api.deleteWorkspaceEntry(node.path);
        if (r && r.error) return toast('⚠ ' + r.error, false);
        // fecha as abas dos arquivos apagados (sem perguntar — já eram)
        openTabs
          .filter((t) => t.path === node.path || t.path.startsWith(node.path + '/'))
          .map((t) => t.path)
          .forEach((p) => closeTab(p, true));
        await loadTree();
      }

      async function doMove(src, destDir) {
        if (!src) return;
        if (dirOf(src) === (destDir || '')) return; // já está nessa pasta
        if (destDir === src || destDir.startsWith(src + '/')) return; // dentro de si mesma
        const r = await window.api.moveWorkspaceEntry(src, destDir);
        if (r && r.error) return toast('⚠ ' + r.error, false);
        if (r && r.path) retargetTabs(src, r.path);
        if (destDir) expanded.add(destDir);
        dragSrc = null;
        await loadTree();
      }

      // soltar na área vazia da árvore = mover para a raiz
      tree.addEventListener('dragover', (e) => {
        if (!dragSrc || e.target.closest('.item')) return;
        e.preventDefault();
        tree.classList.add('drop-root');
      });
      tree.addEventListener('dragleave', (e) => {
        if (e.target === tree) tree.classList.remove('drop-root');
      });
      tree.addEventListener('drop', (e) => {
        tree.classList.remove('drop-root');
        if (!dragSrc || e.target.closest('.item')) return;
        e.preventDefault();
        doMove(dragSrc, '');
      });

      // clique direito no vazio da árvore = criar na raiz
      tree.addEventListener('contextmenu', (e) => {
        if (e.target.closest('.item')) return;
        e.preventDefault();
        closeMenu();
        const m = document.createElement('div');
        m.className = 'ctxmenu';
        [
          ['Novo arquivo', () => newEntry('', false), MI.filePlus],
          ['Nova pasta', () => newEntry('', true), MI.folderPlus],
        ].forEach(([l, fn, icon]) => {
          const it = document.createElement('div');
          it.className = 'mi';
          it.innerHTML = (icon || '') + '<span></span>';
          it.lastChild.textContent = l;
          it.onclick = () => {
            closeMenu();
            fn();
          };
          m.appendChild(it);
        });
        m.style.left = Math.min(e.clientX, window.innerWidth - 160) + 'px';
        m.style.top = e.clientY + 'px';
        document.body.appendChild(m);
        curMenu = m;
      });

      // auto-refresh: o main avisa quando arquivos mudam (cria/edita/apaga, inclusive a Lumi)
      let refreshTimer = null;
      window.api.onWorkspaceChanged(() => {
        if (document.querySelector('.modal')) return; // não atrapalha criação/rename em andamento
        clearTimeout(refreshTimer);
        refreshTimer = setTimeout(() => {
          loadTree();
          // abas: a ativa recarrega na hora (se você não tiver edição pendente); as outras
          // ficam marcadas e recarregam quando você clicar nelas
          openTabs.forEach((t) => (t.stale = true));
          const cur = active && findTab(active);
          if (cur) refreshTab(cur);
        }, 150);
      });

      // ============================================================
      //  Painel inferior: TERMINAL (xterm + PTY/pipe no main) + PORTAS
      // ============================================================
      const panel = document.getElementById('panel');
      const panelResize = document.getElementById('panelResize');
      const termBody = document.getElementById('termBody');
      const portsBodyEl = document.getElementById('portsBody');
      const termSel = document.getElementById('termSel');
      const termsUi = new Map(); // id -> {term, fit, host, title}
      let activeTerm = null;
      let panelTab = 'term';

      function xtermTheme() {
        const acc = cssVarHex('--accent', '#7aa2ff');
        return {
          background: cssVarHex('--surface-2', '#0f0f16'),
          foreground: cssVarHex('--text', '#eeeeee'),
          cursor: acc,
          selectionBackground: acc + '55',
        };
      }
      function showPanel(show) {
        panel.hidden = !show;
        panelResize.hidden = !show;
        if (show) setTimeout(fitActive, 30);
      }
      function setPanelTab(t) {
        panelTab = t;
        document.querySelectorAll('.ptab').forEach((x) => x.classList.toggle('active', x.dataset.tab === t));
        termBody.style.display = t === 'term' ? '' : 'none';
        portsBodyEl.hidden = t !== 'ports';
        if (t === 'ports') loadPorts(true); // força o desenho (os dados já estavam frescos do poll)
        if (t === 'term') setTimeout(fitActive, 30);
      }
      function fitActive() {
        const u = activeTerm && termsUi.get(activeTerm);
        if (u) {
          try {
            u.fit.fit();
            window.api.termResize(activeTerm, u.term.cols, u.term.rows);
          } catch (e) {
            /* ok */
          }
        }
      }
      function renderTermSel() {
        termSel.innerHTML = '';
        for (const [id, u] of termsUi) {
          const o = document.createElement('option');
          o.value = id;
          o.textContent = id + ' · ' + u.title;
          termSel.appendChild(o);
        }
        if (activeTerm) termSel.value = activeTerm;
      }
      function selectTerm(id) {
        activeTerm = id;
        termsUi.forEach((u, k) => u.host.classList.toggle('active', k === id));
        renderTermSel();
        fitActive();
        const u = termsUi.get(id);
        if (u) u.term.focus();
      }
      function attachTerm(id, title, ptyMode, replay) {
        if (termsUi.has(id)) return selectTerm(id);
        if (!window.Terminal) return toast('xterm não carregou (reinstale as dependências)', false);
        const host = document.createElement('div');
        host.className = 'termhost';
        termBody.appendChild(host);
        const term = new Terminal({
          fontSize: 12.5,
          fontFamily: '"Cascadia Mono", Consolas, monospace',
          theme: xtermTheme(),
          cursorBlink: true,
          scrollback: 4000,
        });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(host);
        if (ptyMode) {
          term.onData((d) => window.api.termInput(id, d)); // PTY real: teclas direto pro shell
        } else {
          // modo PIPE (sem node-pty): edição de linha local — eco aqui, envia no Enter
          let lineBuf = '';
          term.onData((d) => {
            for (const ch of d) {
              if (ch === '\r') {
                term.write('\r\n');
                window.api.termInput(id, lineBuf + '\n');
                lineBuf = '';
              } else if (ch === '\x7f') {
                if (lineBuf) {
                  lineBuf = lineBuf.slice(0, -1);
                  term.write('\b \b');
                }
              } else if (ch >= ' ') {
                lineBuf += ch;
                term.write(ch);
              }
            }
          });
        }
        termsUi.set(id, { term, fit, host, title });
        if (replay) term.write(replay);
        const wasHidden = panel.hidden;
        showPanel(true);
        // não rouba a aba se você está olhando as PORTAS (o terminal anexa em segundo plano)
        if (wasHidden || panelTab !== 'ports') setPanelTab('term');
        selectTerm(id);
      }
      async function newTerminal() {
        const r = await window.api.termCreate({});
        if (r.error) return toast(r.error, false);
        if (!termsUi.has(r.id)) attachTerm(r.id, r.shell, r.pty);
      }
      window.api.onTermOpened(async (d) => {
        // terminais abertos pela LUMI (run_in_terminal) aparecem aqui automaticamente
        if (termsUi.has(d.id)) return;
        const replay = await window.api.termBuffer(d.id);
        attachTerm(d.id, d.title, d.pty, replay);
      });
      window.api.onTermData((d) => {
        const u = termsUi.get(d.id);
        if (u) u.term.write(d.data);
      });
      window.api.onTermExit((d) => {
        const u = termsUi.get(d.id);
        if (u) u.term.write('\r\n\x1b[90m[processo encerrado' + (d.exitCode != null ? ' · código ' + d.exitCode : '') + ']\x1b[0m\r\n');
      });
      document.getElementById('termNew').onclick = newTerminal;
      document.getElementById('termKillBtn').onclick = () => {
        if (!activeTerm) return;
        window.api.termKill(activeTerm);
        const u = termsUi.get(activeTerm);
        if (u) {
          u.term.dispose();
          u.host.remove();
        }
        termsUi.delete(activeTerm);
        activeTerm = termsUi.keys().next().value || null;
        if (activeTerm) selectTerm(activeTerm);
        else renderTermSel();
      };
      document.getElementById('panelClose').onclick = () => showPanel(false);
      termSel.onchange = () => selectTerm(termSel.value);
      document.querySelectorAll('.ptab').forEach((t) => (t.onclick = () => setPanelTab(t.dataset.tab)));
      document.getElementById('toggleTerm').onclick = () => {
        const show = panel.hidden;
        showPanel(show);
        if (show && !termsUi.size) newTerminal();
      };
      window.addEventListener('resize', fitActive);
      // QUALQUER mudança no espaço do terminal (redimensionar o chat lateral, o painel,
      // a janela, toggles...) re-ajusta colunas/linhas do xterm — sem precisar reabrir
      if (window.ResizeObserver) {
        let fitTimer = null;
        new ResizeObserver(() => {
          clearTimeout(fitTimer);
          fitTimer = setTimeout(fitActive, 60);
        }).observe(termBody);
      }
      // redimensionar o painel (arrastando a divisória)
      (function () {
        let dragP = false;
        panelResize.addEventListener('mousedown', (e) => {
          dragP = true;
          e.preventDefault();
          document.body.style.userSelect = 'none';
          chatframe.style.pointerEvents = 'none';
        });
        window.addEventListener('mousemove', (e) => {
          if (!dragP) return;
          const r = panel.parentElement.getBoundingClientRect();
          panel.style.height = Math.min(r.height - 120, Math.max(80, r.bottom - e.clientY)) + 'px';
          fitActive();
        });
        window.addEventListener('mouseup', () => {
          if (dragP) {
            dragP = false;
            document.body.style.userSelect = '';
            chatframe.style.pointerEvents = '';
          }
        });
      })();

      // ---- aba PORTAS: processos escutando TCP, AO VIVO (poll com o painel visível) ----
      let lastPortsSig = '';
      let lastPortsSet = new Set();
      async function loadPorts(force) {
        const list = (await window.api.portsList()) || [];
        // contador no rótulo da aba (você vê mudar mesmo estando na aba TERMINAL)
        const tabEl = document.querySelector('.ptab[data-tab="ports"]');
        if (tabEl) tabEl.textContent = 'PORTAS' + (list.length ? ' (' + list.length + ')' : '');
        const sig = JSON.stringify(list);
        if (!force && sig === lastPortsSig && panelTab === 'ports') return; // nada mudou → não pisca a tabela
        const prev = lastPortsSet;
        lastPortsSig = sig;
        lastPortsSet = new Set(list.map((p) => p.port + ':' + p.pid));
        if (panelTab !== 'ports') return; // dados/badge sempre frescos; tabela só quando visível
        const tb = document.getElementById('portsRows');
        tb.innerHTML = '';
        if (!list.length) {
          tb.innerHTML = '<tr><td colspan="4" style="color:#667;padding:14px;text-align:center">Nenhuma porta TCP escutando.</td></tr>';
          return;
        }
        list.forEach((p) => {
          const tr = document.createElement('tr');
          if (prev.size && !prev.has(p.port + ':' + p.pid)) tr.classList.add('pnew'); // porta recém-aberta pisca verde
          tr.innerHTML = '<td><b>:' + p.port + '</b></td><td>' + esc(p.name || '?') + '</td><td>' + (p.pid || '—') + '</td>';
          const td = document.createElement('td');
          td.className = 'pact';
          const open = document.createElement('button');
          open.textContent = '🌐 abrir';
          open.onclick = () => window.api.portsOpen(p.port);
          td.appendChild(open);
          if (p.pid) {
            const kill = document.createElement('button');
            kill.textContent = '✕ matar';
            kill.className = 'danger';
            kill.onclick = async () => {
              if (!confirm('Matar o processo ' + (p.name || '') + ' (PID ' + p.pid + ')?')) return;
              const r = await window.api.portsKill(p.pid);
              if (r && r.error) toast(r.error, false);
              loadPorts(true);
            };
            td.appendChild(kill);
          }
          tr.appendChild(td);
          tb.appendChild(tr);
        });
      }
      setInterval(() => {
        if (!panel.hidden) loadPorts(); // AO VIVO sempre que o painel está aberto (qualquer aba)
      }, 3000);

      // ---- busca global no projeto (Ctrl+Shift+F) ----
      const searchRow = document.getElementById('searchRow');
      const wsSearch = document.getElementById('wsSearch');
      let searchMode = false;
      function toggleSearch(on) {
        searchMode = on;
        searchRow.classList.toggle('on', on);
        if (on) {
          wsSearch.focus();
          wsSearch.select();
          if (wsSearch.value.trim().length >= 2) runWsSearch();
        } else drawTree();
      }
      document.getElementById('btnSearch').onclick = () => toggleSearch(!searchMode);
      let wsSearchTimer = null;
      wsSearch.addEventListener('input', () => {
        clearTimeout(wsSearchTimer);
        wsSearchTimer = setTimeout(runWsSearch, 350);
      });
      wsSearch.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') toggleSearch(false);
      });
      async function runWsSearch() {
        const q = wsSearch.value.trim();
        if (q.length < 2) return drawTree();
        const { results, truncated } = await window.api.searchWorkspace(q);
        tree.innerHTML = '';
        if (!results.length) {
          tree.innerHTML = '<div id="empty">Nada encontrado.</div>';
          return;
        }
        let lastFile = null;
        results.forEach((r) => {
          if (r.path !== lastFile) {
            lastFile = r.path;
            const f = document.createElement('div');
            f.className = 'sresfile';
            f.textContent = r.path;
            f.title = r.path;
            f.onclick = () => openFile(r.path);
            tree.appendChild(f);
          }
          const l = document.createElement('div');
          l.className = 'sresline';
          const i = r.text.toLowerCase().indexOf(q.toLowerCase());
          l.innerHTML =
            r.line + ':  ' +
            (i >= 0 ? esc(r.text.slice(0, i)) + '<b>' + esc(r.text.slice(i, i + q.length)) + '</b>' + esc(r.text.slice(i + q.length)) : esc(r.text));
          l.onclick = async () => {
            await openFile(r.path);
            if (editor && !isImage) {
              editor.revealLineInCenter(r.line);
              editor.setPosition({ lineNumber: r.line, column: r.col });
              editor.focus();
            }
          };
          tree.appendChild(l);
        });
        if (truncated) {
          const d = document.createElement('div');
          d.className = 'sresline';
          d.textContent = '… resultados limitados a 400';
          tree.appendChild(d);
        }
      }

      // ---- git status no explorer (cores estilo VS Code) + branch na statusbar ----
      let gitMap = {};
      let gitBranch = '';
      let gitChanges = 0;
      async function loadGit() {
        const [map, info] = await Promise.all([window.api.gitStatus(), window.api.gitInfo()]);
        gitMap = map || {};
        gitBranch = (info && info.branch) || '';
        gitChanges = (info && info.changes) || 0;
        updateStatus();
      }

      // ---- auto-reload de abas quando o arquivo muda no disco (ex.: a Lumi editou) ----
      function refreshTab(t) {
        if (!t || t.image || t.dirty || !t.model) return;
        t.stale = false;
        window.api.readWorkspaceFile(t.path).then((c) => {
          if (c == null || !t.model || c === t.model.getValue()) return;
          const isActive = active === t.path && editor;
          const vs = isActive ? editor.saveViewState() : null;
          t.model.setValue(c);
          t.savedVer = t.model.getAlternativeVersionId();
          t.dirty = false;
          renderTabs();
          if (isActive && vs) editor.restoreViewState(vs);
        });
      }

      // ---- painel do chat (iframe) ----
      const chatpane = document.getElementById('chatpane');
      const chatresize = document.getElementById('chatresize');
      const chatframe = document.getElementById('chatframe');
      const toggleChat = document.getElementById('toggleChat');
      toggleChat.onclick = () => {
        const show = chatpane.classList.contains('hidden');
        chatpane.classList.toggle('hidden', !show);
        chatresize.classList.toggle('hidden', !show);
        toggleChat.classList.toggle('on', show);

      // divisória arrastável (largura do chat). pointer-events:none no iframe durante o arraste

        chatresize.addEventListener('mousedown', (e) => {

          chatpane.style.width = w + 'px';

        window.addEventListener('mouseup', () => {

          dragging = false;
          document.body.style.userSelect = '';
          chatframe.style.pointerEvents = '';
        });

      // ============================================================

      const rootnameEl = document.getElementById('rootname');
      async function updateRoot() {
        try {
          const ws = (await window.api.getConfig()).workspace || '';
          rootnameEl.textContent = ws ? ws.replace(/\\/g, '/').split('/').pop().toUpperCase() : 'Explorer';
          rootnameEl.title = ws;

        }

      async function openFolder() {

        await window.api.setConfig({ workspace: dir, architectMode: true });
        // o main faz broadcast 'workspace:switched' → resetWorkspaceUI roda aqui e o chat ganha a nota
      }
      function resetWorkspaceUI() {
        [...openTabs].forEach((t) => closeTab(t.path, true));

        updateRoot();

        toast('📁 Workspace: ' + ws);

      function revealCurrent() {
        window.api.revealInExplorer(active || '');
      }
      function showHelp() {

          '<div class="box" style="width:380px"><div class="t" style="font-size:14px;font-weight:600">Atalhos do editor</div>' +

          '<b>Ctrl+S</b> — salvar arquivo<br><b>Ctrl+`</b> — terminal<br><b>Ctrl+Shift+F</b> — buscar no projeto<br>' +
          '<b>Ctrl+F / Ctrl+H</b> — buscar/substituir no arquivo<br><b>Ctrl+G</b> — ir para a linha<br>' +
          '<b>Clique do meio</b> — fecha aba<br><b>Clique direito</b> — menu na árvore<br><b>Arrastar</b> — mover arquivos/pastas' +
          '</div><div class="b"><button class="ok">Fechar</button></div></div>';
        document.body.appendChild(ov);
        ov.querySelector('.ok').onclick = () => ov.remove();
        ov.addEventListener('mousedown', (e) => {

      }

      // ícones dos menus (lucide, 14px)
      const MNI = (p) =>
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
      const MI = {

      const MENUS = [
        {

        {

          items: [
            { label: 'Terminal', icon: MI.term, hint: 'Ctrl+`', fn: () => document.getElementById('toggleTerm').click() },
            {

              },

            { label: 'Chat da Lumi', icon: MI.chat, fn: () => toggleChat.click() },
            '-',
            {
              label: 'Recolher pastas',
              icon: MI.collapse,
              fn: () => {
                expanded.clear();
                drawTree();
              },
            },
            { label: 'Atualizar árvore', icon: MI.refresh, fn: loadTree },
          ],
        },
        {
          label: 'Ir',
          items: [
            { label: 'Buscar no projeto…', icon: MI.search, hint: 'Ctrl+Shift+F', fn: () => toggleSearch(true) },
            { label: 'Ir para a linha…', icon: MI.goto, hint: 'Ctrl+G', fn: () => editor && (editor.focus(), editor.trigger('menu', 'editor.action.gotoLine')) },
          ],
        },
        {
          label: 'Terminal',
          items: [
            { label: 'Novo terminal', icon: MI.plus, fn: newTerminal },
            { label: 'Matar terminal atual', icon: MI.trash, fn: () => document.getElementById('termKillBtn').click() },
            { label: 'Ver portas', icon: MI.plug, fn: () => { showPanel(true); setPanelTab('ports'); } },
          ],
        },
        { label: 'Ajuda', items: [{ label: 'Atalhos do editor', icon: MI.help, fn: showHelp }] },
      ];
      (function buildMenubar() {
        const bar = document.getElementById('menubar');
        let openDrop = null;
        let openLbl = null;
        function closeMenu() {
          if (openDrop) openDrop.remove();
          if (openLbl) openLbl.classList.remove('open');
          openDrop = openLbl = null;
        }
        async function openMenu(menu, lbl) {
          closeMenu();
          const items = typeof menu.items === 'function' ? await menu.items() : menu.items;
          const drop = document.createElement('div');
          drop.className = 'mdrop';
          drop.style.left = lbl.offsetLeft + 'px';
          items.forEach((it) => {
            if (it === '-') {
              const s = document.createElement('div');
              s.className = 'msep';
              drop.appendChild(s);
              return;
            }
            if (it.head) {
              const h = document.createElement('div');
              h.className = 'mhead';
              h.textContent = it.head;
              drop.appendChild(h);
              return;
            }
            const el = document.createElement('div');
            el.className = 'mitem';
            el.innerHTML =
              '<span class="mic">' + (it.icon || '') + '</span><span class="mtx">' + esc(it.label) + '</span>' +
              (it.hint ? '<span class="mhint">' + it.hint + '</span>' : '');
            if (it.title) el.title = it.title;
            el.onclick = () => {
              closeMenu();
              it.fn();
            };
            drop.appendChild(el);
          });
          bar.appendChild(drop);
          lbl.classList.add('open');
          openDrop = drop;
          openLbl = lbl;
        }
        MENUS.forEach((m) => {
          const lbl = document.createElement('span');
          lbl.className = 'mlabel';
          lbl.textContent = m.label;
          lbl.onclick = (e) => {
            e.stopPropagation();
            if (openLbl === lbl) closeMenu();
            else openMenu(m, lbl);
          };
          lbl.onmouseenter = () => {
            if (openDrop && openLbl !== lbl) openMenu(m, lbl); // navegação por hover quando já aberto
          };
          bar.appendChild(lbl);
        });
        document.addEventListener('click', closeMenu);
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeMenu();
        });
      })();

      document.getElementById('newFile').onclick = () => newEntry('', false);
      document.getElementById('newFolder').onclick = () => newEntry('', true);
      document.getElementById('refresh').onclick = loadTree;
      document.getElementById('collapse').onclick = () => {
        expanded.clear();
        drawTree();
      };
      document.getElementById('save').onclick = save;
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          save();
        } else if ((e.ctrlKey || e.metaKey) && (e.key === '`' || e.key === "'")) {
          e.preventDefault();
          document.getElementById('toggleTerm').click(); // Ctrl+` abre/fecha o terminal
        } else if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'f') {
          e.preventDefault();
          toggleSearch(true); // busca global no projeto
        }
      });

      // tema do Monaco casado com as cores do app (lê as variáveis CSS do tema)
      function cssVarHex(n, fb) {
        const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
        return /^#([0-9a-f]{6}|[0-9a-f]{3})$/i.test(v) ? (v.length === 4 ? '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3] : v) : fb;
      }
      function defineLumiTheme() {
        if (!window.monaco) return;
        const bg = cssVarHex('--surface-2', '#0f0f16');
        const txt = cssVarHex('--text', '#eeeeee');
        const acc = cssVarHex('--accent', '#7aa2ff');
        const border = cssVarHex('--border', '#2a2a38');
        monaco.editor.defineTheme('lumi', {
          base: 'vs-dark',
          inherit: true,
          rules: [],
          colors: {
            'editor.background': bg,
            'editor.foreground': txt,
            'editorCursor.foreground': acc,
            'editor.lineHighlightBackground': border + '66',
            'editorLineNumber.foreground': '#5a5a6a',
            'editorLineNumber.activeForeground': acc,
            'editor.selectionBackground': acc + '44',
            'editorIndentGuide.background': border,
            'scrollbarSlider.background': border + '99',
            'editorWidget.background': bg,
            'editorWidget.border': border,
          },
        });
        monaco.editor.setTheme('lumi');
      }
      if (window.api.onThemeChanged)
        window.api.onThemeChanged(() =>
          setTimeout(() => {
            defineLumiTheme(); // Monaco acompanha o tema
            termsUi.forEach((u) => (u.term.options.theme = xtermTheme())); // terminais também
          }, 0)
        );

      const loader = document.createElement('script');
      loader.src = CDN + '/vs/loader.js';
      loader.onload = () => {
        require.config({ paths: { vs: CDN + '/vs' } });
        require(['vs/editor/editor.main'], () => {
          defineLumiTheme();
          editor = monaco.editor.create(editorEl, {
            value: '',
            language: 'plaintext',
            theme: 'lumi',
            automaticLayout: true,
            fontSize: 13,
            minimap: { enabled: true },
          });
          editor.onDidChangeCursorPosition(updateStatus); // Ln/Col na barra de status
          loadTree();
        });
      };
      loader.onerror = () => {
        editorEl.innerHTML = '<div id="empty">Não consegui carregar o editor (Monaco precisa de internet na 1ª vez).</div>';
        loadTree();
      };
      document.head.appendChild(loader);
    </script>
    <script>
      window.__lumiThemed = true;
    </script>
    <script src="theme.js"></script>
    <script src="_chrome.js"></script>
  </body>
</html>

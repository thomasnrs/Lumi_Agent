      function gitSection(title, files, staged) {
        const sec = document.createElement('div');
        const head = document.createElement('div');
        head.className = 'gsec-head';
        head.innerHTML =
          '<span>' + title + '</span><span class="cnt">' + files.length + '</span><span class="grow"></span>' +
          (staged
            ? '<button class="ga" title="Despreparar tudo">−</button>'
            : '<button class="ga" title="Descartar todas as alterações">↶</button><button class="ga" title="Preparar tudo (stage)">＋</button>');
        const btns = head.querySelectorAll('.ga');
        const paths = files.map((f) => f.path);
        if (staged) btns[0].onclick = () => gitAct(window.api.gitUnstage(paths));
        else {
          btns[0].onclick = () => {
            if (confirm('Descartar TODAS as alterações (' + paths.length + ' arquivos)? Os não rastreados serão apagados. Não dá pra desfazer.'))
              gitAct(window.api.gitDiscard(paths));
          };
          btns[1].onclick = () => gitAct(window.api.gitStage(paths));
        }
        sec.appendChild(head);
        files.forEach((f) => sec.appendChild(gitRow(f, staged)));
        return sec;
      }

      function gitRow(f, staged) {
        const d = document.createElement('div');
        d.className = 'gitem';
        d.title = f.path;
        const nm = baseName(f.path);
        d.innerHTML =
          '<span class="ic">' + iconFor(nm) + '</span><span class="nm">' + esc(nm) + '</span><span class="dr">' + esc(dirOf(f.path)) + '</span>' +
          '<span class="gacts">' +
          (staged ? '<button title="Despreparar">−</button>' : '<button title="Descartar alterações">↶</button><button title="Preparar (stage)">＋</button>') +
          '</span><span class="gst gst-' + f.st + '">' + f.st + '</span>';
        d.addEventListener('click', (e) => {
          if (e.target.closest('.gacts')) return;
          openDiffFor(f);
        });
        const btns = d.querySelectorAll('.gacts button');
        if (staged) btns[0].onclick = () => gitAct(window.api.gitUnstage([f.path]));
        else {
          btns[0].onclick = () => {
            const aviso = f.st === 'U' ? ' O arquivo é novo e será APAGADO.' : '';
            if (confirm('Descartar as alterações de "' + f.path + '"?' + aviso)) gitAct(window.api.gitDiscard([f.path]));
          };
          btns[1].onclick = () => gitAct(window.api.gitStage([f.path]));
        }
        return d;
      }

      // clique no arquivo → diff HEAD ⇆ atual numa aba (Monaco diff editor)
      function openDiffFor(f) {
        const ext = (f.path.split('.').pop() || '').toLowerCase();
        if (IMG_EXT.includes(ext)) {
          if (f.st !== 'D') openFile(f.path); // imagem não tem diff de texto — abre o preview
          return;
        }
        openDiff(f.path);
      }
      async function openDiff(rel) {
        if (!window.monaco || !diffEditor) return toast('⚠ o editor ainda está carregando…', false);
        const p = 'diff:' + rel;
        let t = findTab(p);
        const [orig, cur] = await Promise.all([window.api.gitHeadFile(rel), window.api.readWorkspaceFile(rel)]);
        if (!t) {
          t = {
            path: p,
            diff: true,
            rel,
            orig: monaco.editor.createModel(orig || '', langOf(rel)),
            model: monaco.editor.createModel(cur == null ? '' : cur, langOf(rel)),
            dirty: false,
          };
          openTabs.push(t);
        } else {
          t.orig.setValue(orig || '');
          t.model.setValue(cur == null ? '' : cur);
        }
        activate(p);
      }

      async function doCommit() {
        const message = gitMsgEl.value.trim();
        if (!message) {
          toast('⚠ escreva a mensagem do commit', false);
          gitMsgEl.focus();
          return;
        }
        let stageAll = false;
        if (!gitSt || !gitSt.staged.length) {
          if (!gitSt || !gitSt.unstaged.length) return toast('⚠ nenhuma alteração para commitar', false);
          if (!confirm('Nada está preparado (staged). Commitar TODAS as alterações?')) return;
          stageAll = true;
        }
        gitCommitBtn.disabled = true;
        const r = await window.api.gitCommit({ message, stageAll });
        gitCommitBtn.disabled = false;
        if (r && r.error) return toast('⚠ ' + String(r.error).slice(0, 160), false);
        gitMsgEl.value = '';
        toast('✓ commit feito');
        loadGitPanel();
        openTabs.filter((t) => t.diff).forEach((t) => refreshTab(t)); // HEAD mudou → diffs abertos atualizam
      }

      // ---- 🔍 revisão pré-commit: a Lumi lê o diff e aponta o que importa ----

        gitReviewBody.textContent = r.review + (r.truncated ? '\n\n(diff grande — revisei a primeira parte)' : '');

      // ---- histórico de commits (clique → diff expandível) ----
      let gitLogOpen = false; // lembra se a seção estava aberta entre refreshes
      async function renderCommits() {
        const log = await window.api.gitLog();
        if (!log.length || gitListsEl.querySelector('.gcommits')) return; // refresh em paralelo não duplica
        const det = document.createElement('details');
        det.className = 'gcommits';
        det.open = gitLogOpen;
        det.addEventListener('toggle', () => (gitLogOpen = det.open));

          const d = document.createElement('div');
          d.className = 'gci';
          d.title = c.subject + ' — ' + c.author;
          d.innerHTML = '<span class="h">' + esc(c.hash) + '</span> ' + esc(c.subject) + ' <span class="w">· ' + esc(c.when) + '</span>';
          let pre = null;
          d.addEventListener('click', async () => {
            if (pre) {
              pre.remove();
              pre = null;
              return;
            }
            const r = await window.api.gitShowCommit(c.hash);
            if (r && r.error) return toast('⚠ ' + r.error, false);
            pre = document.createElement('div');
            pre.className = 'cdiff';
            const lines = (r.text || '').split('\n').slice(0, 600);
            pre.innerHTML = lines
              .map((l) => {
                const e = esc(l);
                if (l.startsWith('+') && !l.startsWith('+++')) return '<span class="cl-add">' + e + '</span>';
                if (l.startsWith('-') && !l.startsWith('---')) return '<span class="cl-del">' + e + '</span>';
                if (l.startsWith('@@')) return '<span class="cl-hunk">' + e + '</span>';

      // ---- push / pull (cabeçalho do painel git) ----

        btn.disabled = false;
        btn.textContent = old;
        if (r && r.error) toast('⚠ ' + String(r.error).slice(0, 180), false);
        else toast('✓ ' + kind + ' feito' + (r.out ? ' · ' + r.out.split('\n')[0].slice(0, 60) : ''));

      // ---- trocar de branch: clique no nome → menu com as branches + criar nova ----

      gitBranchNameEl.addEventListener('click', async (e) => {

      // ============================================================

      const edPrefs = {

      function applyEditorPrefs() {

        localStorage.setItem('ws.minimap', edPrefs.minimap ? '1' : '0');

      // barrinhas de git na margem do editor (linhas alteradas vs HEAD, estilo VS Code)
      let gitDecor = null;
      async function updateGitGutter() {
        if (!editor || !window.monaco) return;
        const t = active && findTab(active);
        if (gitDecor) {
          gitDecor.clear();
          gitDecor = null;

        if (!t || t.image || t.diff) return;

        if (!ls || active !== t.path) return; // trocou de aba enquanto buscava
        const decs = [];
        const mk = (a, b, cls) => decs.push({ range: new monaco.Range(a, 1, b, 1), options: { isWholeLine: true, linesDecorationsClassName: cls } });
        (ls.added || []).forEach(([a, b]) => mk(a, b, 'gut-add'));
        (ls.modified || []).forEach(([a, b]) => mk(a, b, 'gut-mod'));
        (ls.deleted || []).forEach((n) => mk(n, n, 'gut-del'));

      // ---- Ctrl+P: abrir arquivo rápido (busca fuzzy no nome/caminho) ----
      const qopen = document.getElementById('qopen');
      const qinput = document.getElementById('qinput');
      const qlist = document.getElementById('qlist');
      let qItems = [];
      let qSel = 0;
      let qFlat = null; // cache da árvore achatada (zera quando a árvore recarrega)
      function flatFiles(nodes, out) {
        (nodes || []).forEach((n) => {
          if (n.dir) flatFiles(n.children, out);
          else out.push(n.path);
        });
        return out;
      }
      function fuzzyScore(q, s) {
        // subsequência com bônus: trechos contíguos e match no nome do arquivo pesam mais
        let qi = 0;
        let score = 0;
        let streak = 0;
        for (let i = 0; i < s.length && qi < q.length; i++) {
          if (s[i] === q[qi]) {
            qi++;
            streak++;
            score += 2 + streak;
          } else streak = 0;
        }
        if (qi < q.length) return -1; // não casou tudo
        const nm = s.split('/').pop();
        if (nm.startsWith(q)) score += 30;
        else if (nm.includes(q)) score += 18;
        return score - s.length * 0.05; // empate: caminho mais curto primeiro
      }
      function qRender() {
        qlist.innerHTML = '';
        qItems.slice(0, 40).forEach((p, i) => {
          const d = document.createElement('div');
          d.className = 'qitem' + (i === qSel ? ' sel' : '');
          const nm = baseName(p);
          d.innerHTML = '<span class="ic">' + iconFor(nm) + '</span><span class="qn">' + esc(nm) + '</span><span class="qp">' + esc(dirOf(p)) + '</span>';
          d.onclick = () => {
            qClose();
            openFile(p);
          };
          qlist.appendChild(d);
        });
        const sel = qlist.children[qSel];
        if (sel) sel.scrollIntoView({ block: 'nearest' });
      }
      function qFilter() {
        const q = qinput.value.trim().toLowerCase();
        const all = qFlat || (qFlat = flatFiles(treeData, []));
        qItems = !q
          ? all.slice(0, 40)
          : all
              .map((p) => [fuzzyScore(q, p.toLowerCase()), p])
              .filter((x) => x[0] >= 0)
              .sort((a, b) => b[0] - a[0])
              .map((x) => x[1]);
        qSel = 0;
        qRender();
      }
      function qOpen() {
        qopen.hidden = false;
        qinput.value = '';
        qFilter();
        qinput.focus();
      }
      function qClose() {
        qopen.hidden = true;
      }
      qinput.addEventListener('input', qFilter);
      qinput.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          qSel = Math.min(qSel + 1, Math.min(qItems.length, 40) - 1);
          qRender();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          qSel = Math.max(qSel - 1, 0);
          qRender();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const p = qItems[qSel];
          if (p) {
            qClose();
            openFile(p);
          }
        } else if (e.key === 'Escape') qClose();
      });
      qopen.addEventListener('mousedown', (e) => {
        if (e.target === qopen) qClose(); // clicou fora da caixa
      });

      // ---- ✦ corrigir: manda a saída do terminal ativo pro chat da Lumi ----
      document.getElementById('termFix').onclick = () => {
        const u = activeTerm != null && termsUi.get(activeTerm);

        const lines = [];

        const text = lines.join('\n').trim().slice(-6000); // últimas linhas (cap)

      };

      // ---- seleção → Lumi: manda o trecho pro chat lateral (com arquivo e linhas) ----

        if (chatpane.classList.contains('hidden')) document.getElementById('toggleChat').click(); // garante o chat visível
        document.getElementById('chatframe').contentWindow.postMessage({ __lumi: 'insert', text: msg, send: !!autoSend }, '*');
      }

      // ============================================================

      // ============================================================
      //  Navegador embutido (webview): localhost dos dev servers, docs etc.
      // ============================================================
      const webrootEl = document.getElementById('webroot');

      const wbPickBtn = document.getElementById('wbPick');
      const WEB_TAB = 'web:browser';

        '<svg viewBox="0 0 24 24" fill="none" stroke="#53c1de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>';

      // "3000", ":3000", "localhost:3000", "site.com" → URL navegável
      function normalizeUrl(u) {
        u = String(u || '').trim();
        if (!u) return '';
        if (/^\d+$/.test(u)) u = 'localhost:' + u;
        if (/^:\d+/.test(u)) u = 'localhost' + u;
        if (/^(localhost|127\.|0\.0\.0\.0|192\.168\.|\[::1\])/i.test(u)) u = 'http://' + u;

      // erros do console da página → badge ⚠ → manda pra Lumi corrigir

      // 🎯 apontar DENTRO do navegador: injeta o picker na página e recebe via console-message
      const WB_PICKER =
        '(function(){' +
        'var box=null;' +
        'function ov(){if(box)return box;box=document.createElement("div");box.style.cssText="position:fixed;pointer-events:none;z-index:2147483647;border:2px solid #7aa2ff;background:rgba(122,162,255,.18);border-radius:3px;";document.body.appendChild(box);return box;}' +
        'function sel(el){var parts=[];var n=el;while(n&&n.nodeType===1&&parts.length<5){var s=n.tagName.toLowerCase();if(n.id){parts.unshift(s+"#"+n.id);break;}var cl=(typeof n.className==="string")?n.className.trim().split(/\\s+/).filter(Boolean).slice(0,2).join("."):"";if(cl)s+="."+cl;var p=n.parentElement;if(p){var sib=[].filter.call(p.children,function(c){return c.tagName===n.tagName;});if(sib.length>1)s+=":nth-of-type("+(sib.indexOf(n)+1)+")";}parts.unshift(s);n=p;}return parts.join(" > ");}' +
        'function mv(e){var el=document.elementFromPoint(e.clientX,e.clientY);if(!el||el===box)return;var r=el.getBoundingClientRect();var b=ov();b.style.left=r.left+"px";b.style.top=r.top+"px";b.style.width=r.width+"px";b.style.height=r.height+"px";}' +
        'function st(){document.removeEventListener("mousemove",mv,true);document.removeEventListener("click",ck,true);document.removeEventListener("keydown",ky,true);document.documentElement.style.cursor="";if(box){box.remove();box=null;}console.log("__LUMIPICK_OFF__");}' +
        'function ck(e){e.preventDefault();e.stopPropagation();var el=document.elementFromPoint(e.clientX,e.clientY);if(el){console.log("__LUMIPICK__"+JSON.stringify({selector:sel(el),text:(el.innerText||"").trim().slice(0,200),html:(el.outerHTML||"").slice(0,1200),page:location.href}));}st();}' +

      // ---- auto-reload de abas quando o arquivo muda no disco (ex.: a Lumi editou) ----
      function refreshTab(t) {
        if (t && (t.live || t.web)) {
          t.stale = false; // essas abas se cuidam sozinhas
          return;
        }
        if (t && t.diff) {
          // aba de diff: recarrega os DOIS lados (HEAD pode ter mudado com um commit)
          t.stale = false;
          Promise.all([window.api.gitHeadFile(t.rel), window.api.readWorkspaceFile(t.rel)]).then(([o, c]) => {
            if (t.orig) t.orig.setValue(o || '');
            if (t.model) t.model.setValue(c == null ? '' : c);
          });
          return;
        }
        if (!t || t.image || t.dirty || !t.model) return;
        t.stale = false;
        window.api.readWorkspaceFile(t.path).then((c) => {
          if (c == null || !t.model || c === t.model.getValue()) return;
          const isActive = active === t.path && editor;
          const vs = isActive ? editor.saveViewState() : null;
          t.model.setValue(c);
          t.savedVer = t.model.getAlternativeVersionId();
          t.dirty = false;
          renderTabs();
          if (isActive && vs) editor.restoreViewState(vs);
        });
      }

          if (!dragging) return;

          chatpane.style.width = w + 'px';

      async function openRemote() {
        if (!(await window.api.sshAvailable())) {

          const cmd = await window.api.sshInstallCmd();
          if (!cmd) return toast('⚠ instale o sshfs manualmente (Linux: sudo apt install sshfs · Windows: SSHFS-Win + WinFsp)', false);
          if (!confirm('Pra montar pastas remotas eu preciso do sshfs, que ainda não está instalado.\n\nInstalar agora? Vou rodar no terminal integrado:\n\n' + cmd)) return;
          showPanel(true);
          const r = await window.api.termCreate({ command: cmd, title: 'instalar sshfs' });
          if (r && r.error) return toast(r.error, false);
          toast('⏳ quando a instalação terminar, clique de novo em 📡 Abrir pasta remota');
          return;
        }
        const hosts = await window.api.sshHosts();
        if (!hosts.length) return toast('⚠ nenhum host no seu ~/.ssh/config', false);
        document.querySelectorAll('.brmenu').forEach((x) => x.remove());

        menu.className = 'brmenu';

          const it = document.createElement('div');
          it.className = 'bri';
          it.textContent = h;
          it.onclick = async () => {
            menu.remove();

            if (remotePath === null) return; // cancelou
            showPanel(true);

            const r = await window.api.sshMount(h, remotePath);
            clearBusy();
            if (r && r.error) return toast('⚠ ' + r.error, false);
            remoteActive = h;
            updateStatus();
            toast('📡 montado: ' + h + ' — workspace remoto ativo!');

          };
          menu.appendChild(it);
        });

        setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 0);

      let rbrResolve = null; // promessa do pickRemotePath

      // indicador "acontecendo algo" no rodapé (conexão leva alguns segundos)
      function setBusy(msg) {

      function clearBusy() {

      function pickRemotePath(host) {
        return new Promise(async (resolve) => {
          rbrResolve = resolve;
          document.getElementById('rbrHost').textContent = host;
          rbrPathEl.value = '';

          rbrMsgEl.textContent = '🔑 verificando acesso… (se pedir senha, responda no terminal "chave: ' + host + '")';

            rbrMsgEl.textContent = '⚠ ' + k.error;
            return; // deixa o usuário fechar/cancelar

          rbrBrowse(host, '.'); // chave ok → lista a home

      async function rbrBrowse(host, p) {
        rbrMsgEl.textContent = '⏳ listando…';

        if (r && r.error) {
          rbrMsgEl.textContent = '⚠ ' + r.error;
          return;

        rbrCwd = r.cwd;
        rbrPathEl.value = r.cwd;
        rbrMsgEl.textContent = r.dirs.length + ' subpasta(s) · clique pra entrar, ou "Abrir esta pasta"';
        rbrListEl.innerHTML = '';
        // ".." pra subir (se não está na raiz)
        if (r.cwd !== '/') {
          const up = document.createElement('div');
          up.className = 'rbrItem';
          up.innerHTML = '<span class="ic">↩</span><span>.. (subir)</span>';
          up.onclick = () => rbrBrowse(host, r.cwd.replace(/\/[^/]+\/?$/, '') || '/');
          rbrListEl.appendChild(up);
        }
        r.dirs.forEach((d) => {
          const it = document.createElement('div');
          it.className = 'rbrItem';
          it.innerHTML = '<span class="ic">📁</span><span>' + esc(d) + '</span>';

            { label: 'Ver portas', icon: MI.plug, fn: () => { showPanel(true); setPanelTab('ports'); } },
          ],
        },
        { label: 'Ajuda', items: [{ label: 'Atalhos do editor', icon: MI.help, fn: showHelp }] },
      ];
      (function buildMenubar() {
        const bar = document.getElementById('menubar');
        let openDrop = null;
        let openLbl = null;
        function closeMenu() {
          if (openDrop) openDrop.remove();
          if (openLbl) openLbl.classList.remove('open');
          openDrop = openLbl = null;
        }
        async function openMenu(menu, lbl) {
          closeMenu();
          const items = typeof menu.items === 'function' ? await menu.items() : menu.items;
          const drop = document.createElement('div');
          drop.className = 'mdrop';
          drop.style.left = lbl.offsetLeft + 'px';
          items.forEach((it) => {
            if (it === '-') {
              const s = document.createElement('div');
              s.className = 'msep';
              drop.appendChild(s);
              return;
            }
            if (it.head) {
              const h = document.createElement('div');
              h.className = 'mhead';
              h.textContent = it.head;
              drop.appendChild(h);
              return;
            }
            const el = document.createElement('div');
            el.className = 'mitem';
            el.innerHTML =
              '<span class="mic">' + (it.icon || '') + '</span><span class="mtx">' + esc(it.label) + '</span>' +
              (it.hint ? '<span class="mhint">' + it.hint + '</span>' : '');
            if (it.title) el.title = it.title;
            el.onclick = () => {
              closeMenu();
              it.fn();
            };
            drop.appendChild(el);
          });
          bar.appendChild(drop);
          lbl.classList.add('open');
          openDrop = drop;
          openLbl = lbl;
        }
        MENUS.forEach((m) => {
          const lbl = document.createElement('span');
          lbl.className = 'mlabel';
          lbl.textContent = m.label;
          lbl.onclick = (e) => {
            e.stopPropagation();
            if (openLbl === lbl) closeMenu();
            else openMenu(m, lbl);
          };
          lbl.onmouseenter = () => {
            if (openDrop && openLbl !== lbl) openMenu(m, lbl); // navegação por hover quando já aberto
          };
          bar.appendChild(lbl);
        });
        document.addEventListener('click', closeMenu);
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeMenu();
        });
      })();

      document.getElementById('newFile').onclick = () => newEntry('', false);
      document.getElementById('newFolder').onclick = () => newEntry('', true);
      document.getElementById('refresh').onclick = () => {
        loadTree();
        if (sideMode === 'git') loadGitPanel(); // no modo git, o ⟳ atualiza o painel também
      };
      document.getElementById('collapse').onclick = () => {
        expanded.clear();
        drawTree();
      };
      document.getElementById('save').onclick = save;
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          save();
        } else if ((e.ctrlKey || e.metaKey) && (e.key === '`' || e.key === "'")) {
          e.preventDefault();
          document.getElementById('toggleTerm').click(); // Ctrl+` abre/fecha o terminal
        } else if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'f') {
          e.preventDefault();
          toggleSearch(true); // busca global no projeto
        } else if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'g') {
          e.preventDefault();
          setSideMode(sideMode === 'git' ? 'files' : 'git'); // controle de fontes
        } else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'p') {
          e.preventDefault();
          qOpen(); // abrir arquivo rápido
        }
      });

      // tema do Monaco casado com as cores do app (lê as variáveis CSS do tema)
      function cssVarHex(n, fb) {
        const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
        return /^#([0-9a-f]{6}|[0-9a-f]{3})$/i.test(v) ? (v.length === 4 ? '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3] : v) : fb;
      }
      function defineLumiTheme() {
        if (!window.monaco) return;
        const bg = cssVarHex('--surface-2', '#0f0f16');
        const txt = cssVarHex('--text', '#eeeeee');
        const acc = cssVarHex('--accent', '#7aa2ff');
        const border = cssVarHex('--border', '#2a2a38');
        monaco.editor.defineTheme('lumi', {
          base: 'vs-dark',
          inherit: true,
          rules: [],
          colors: {
            'editor.background': bg,
            'editor.foreground': txt,
            'editorCursor.foreground': acc,
            'editor.lineHighlightBackground': border + '66',
            'editorLineNumber.foreground': '#5a5a6a',
            'editorLineNumber.activeForeground': acc,
            'editor.selectionBackground': acc + '44',
            'editorIndentGuide.background': border,
            'scrollbarSlider.background': border + '99',
            'editorWidget.background': bg,
            'editorWidget.border': border,
          },
        });
        monaco.editor.setTheme('lumi');
      }
      if (window.api.onThemeChanged)
        window.api.onThemeChanged(() =>
          setTimeout(() => {
            defineLumiTheme(); // Monaco acompanha o tema
            termsUi.forEach((u) => (u.term.options.theme = xtermTheme())); // terminais também
          }, 0)
        );

      const loader = document.createElement('script');
      loader.src = CDN + '/vs/loader.js';
      loader.onload = () => {
        require.config({ paths: { vs: CDN + '/vs' } });
        require(['vs/editor/editor.main'], () => {
          defineLumiTheme();
          editor = monaco.editor.create(editorEl, {
            value: '',
            language: 'plaintext',
            theme: 'lumi',
            automaticLayout: true,
            fontSize: 13,
            minimap: { enabled: edPrefs.minimap },
            wordWrap: edPrefs.wrap ? 'on' : 'off',
            stickyScroll: { enabled: edPrefs.sticky }, // função/classe atual grudada no topo
            mouseWheelZoom: true, // Ctrl+scroll = zoom da fonte
          });
          editor.onDidChangeCursorPosition(updateStatus); // Ln/Col na barra de status
          editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyP, qOpen); // Ctrl+P dentro do editor
          // seleção → Lumi (menu de contexto do editor)
          editor.addAction({ id: 'lumi-send', label: '✦ Enviar seleção pra Lumi', contextMenuGroupId: '0_lumi', contextMenuOrder: 1, precondition: 'editorHasSelection', run: () => sendSelectionToLumi('', false) });
          editor.addAction({ id: 'lumi-explain', label: '✦ Explicar com a Lumi', contextMenuGroupId: '0_lumi', contextMenuOrder: 2, precondition: 'editorHasSelection', run: () => sendSelectionToLumi('Me explica esse trecho:', true) });
          editor.addAction({ id: 'lumi-refactor', label: '✦ Refatorar com a Lumi', contextMenuGroupId: '0_lumi', contextMenuOrder: 3, precondition: 'editorHasSelection', run: () => sendSelectionToLumi('Refatore este trecho (pode editar o arquivo direto):', false) });
          // editor de diff do painel git (HEAD ⇆ atual); inline quando o espaço aperta
          diffEditor = monaco.editor.createDiffEditor(diffEl, {
            theme: 'lumi',
            automaticLayout: true,
            readOnly: true,
            originalEditable: false,
            fontSize: 13,
            renderSideBySide: true,
            useInlineViewWhenSpaceIsLimited: true,
            wordWrap: edPrefs.wrap ? 'on' : 'off',
            mouseWheelZoom: true,
          });
          loadTree();
        });
      };
      loader.onerror = () => {
        editorEl.innerHTML = '<div id="empty">Não consegui carregar o editor (Monaco precisa de internet na 1ª vez).</div>';
        loadTree();
      };
      document.head.appendChild(loader);
    </script>
    <script>
      window.__lumiThemed = true;
    </script>
    <script src="theme.js"></script>
    <script src="_chrome.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Gerar imagem</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      .scroll {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #9aa;
        margin: 10px 0 4px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-2);
        color: #fff;
        font-size: 13px;
        outline: none;
      }
      textarea {
        resize: vertical;
        min-height: 70px;
        font-family: inherit;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      .row input {
        flex: 1;
        min-width: 0;
      }
      .row button {
        flex: 0 0 auto;
        width: 42px;
        border: none;
        border-radius: 8px;
        background: var(--border);
        color: #fff;
        cursor: pointer;
        font-size: 15px;
      }
      .hint {
        font-size: 11px;
        color: #777;
        margin: 4px 0 0;
      }
      #gen {
        width: 100%;
        margin-top: 14px;
        padding: 11px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #gen:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        font-size: 12px;
        color: #9aa;
        margin-top: 8px;
        min-height: 16px;
      }
      #result img {
        width: 100%;
        border-radius: 10px;
        margin-top: 10px;
        display: block;
      }
      .footerbtn {
        margin-top: 8px;
        border: none;
        border-radius: 8px;
        background: var(--border);
        color: #ccc;
        padding: 8px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #33333f;
        border-radius: 6px;
      }
      :root {
        --bg: #16161e; --surface: #24242f; --surface-2: #0f0f16;
        --accent: #7aa2ff; --accent-text: #fff; --text: #eee; --border: #2a2a38;
      }
    </style>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="lumi-page" data-lumi-page="imagegen">
    <div class="scroll">
      <h1 class="lumi-page-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>Estúdio de imagem</h1>
      <p class="lumi-page-subtitle">Configure seu provedor e transforme ideias em imagens sem sair da Lumi.</p>

      <section class="studio-section">
        <h2 class="lumi-section-title">Provedor e modelo</h2>
        <label for="preset">Provedor</label>
        <select id="preset"></select>

        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" type="text" placeholder="https://openrouter.ai/api/v1" />

        <label for="apiKey">Chave de API</label>
        <input id="apiKey" type="password" placeholder="sk-or-... (vazio = usa a do chat)" />

        <label for="model">Modelo</label>
        <div class="row">
          <input id="model" type="text" list="models" placeholder="sourceful/riverflow-v2.5-fast:free" />
          <button id="fetch" class="lumi-icon-btn" title="Buscar modelos" aria-label="Buscar modelos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>
          </button>
        </div>
        <datalist id="models">
          <option value="sourceful/riverflow-v2.5-fast:free">Riverflow 2.5 Fast (grátis)</option>
          <option value="sourceful/riverflow-v2.5-pro:free">Riverflow 2.5 Pro (grátis)</option>
        </datalist>
        <div id="modelsStatus" class="hint"></div>

        <button id="saveCfg" class="lumi-btn lumi-btn-secondary">Salvar configuração</button>
        <div id="saveMsg" class="hint" aria-live="polite"></div>
      </section>

      <section class="studio-section">
        <h2 class="lumi-section-title">Criação</h2>
        <label for="prompt">Prompt da imagem</label>
        <textarea id="prompt" placeholder="ex: a cute cat astronaut floating in space, digital art"></textarea>

        <button id="gen" class="lumi-btn lumi-btn-primary">Gerar imagem</button>
        <div id="status" aria-live="polite"></div>
        <div id="result"></div>
        <button id="openFolder" class="lumi-btn lumi-btn-secondary">Abrir pasta da galeria</button>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const presetEl = $('preset');
      const baseUrlEl = $('baseUrl');
      const apiKeyEl = $('apiKey');
      const modelEl = $('model');
      const modelsList = $('models');
      const modelsStatus = $('modelsStatus');
      const promptEl = $('prompt');
      const genBtn = $('gen');
      const statusEl = $('status');
      const resultEl = $('result');

      const PRESETS = {
        OpenRouter: { baseUrl: 'https://openrouter.ai/api/v1' },
        'Mesmo do chat': { baseUrl: '' },
        Personalizado: null,
      };
      Object.keys(PRESETS).forEach((n) => {
        const o = document.createElement('option');
        o.value = n;
        o.textContent = n;
        presetEl.appendChild(o);
      });
      presetEl.addEventListener('change', () => {
        const p = PRESETS[presetEl.value];
        if (p) baseUrlEl.value = p.baseUrl;
      });

      // carrega a config atual
      window.api.getConfig().then((c) => {
        baseUrlEl.value = c.imageBaseUrl || '';
        apiKeyEl.value = c.imageApiKey || '';
        modelEl.value = c.imageModel || 'sourceful/riverflow-v2.5-fast:free';
        presetEl.value = !baseUrlEl.value
          ? 'Mesmo do chat'
          : /openrouter/i.test(baseUrlEl.value)
            ? 'OpenRouter'
            : 'Personalizado';
      });

      // buscar modelos do endpoint
      $('fetch').addEventListener('click', async () => {
        modelsStatus.textContent = 'Buscando modelos…';
        try {
          const ids = await window.api.listModels({
            provider: 'openai',
            baseUrl: baseUrlEl.value.trim(),
            apiKey: apiKeyEl.value.trim(),
          });
          modelsList.innerHTML = '';
          ids.forEach((id) => {
            const o = document.createElement('option');
            o.value = id;
            modelsList.appendChild(o);
          });
          modelsStatus.textContent = `${ids.length} modelos — digite no campo para filtrar.`;
        } catch (e) {
          modelsStatus.textContent = '⚠ ' + (e.message || e);
        }
      });

      // salva so a configuracao de imagem (merge no main, nao apaga o resto)
      async function saveImageCfg() {
        await window.api.setConfig({
          imageBaseUrl: baseUrlEl.value.trim(),
          imageApiKey: apiKeyEl.value.trim(),
          imageModel: modelEl.value.trim() || 'sourceful/riverflow-v2.5-fast:free',
        });
      }
      $('saveCfg').addEventListener('click', async () => {
        await saveImageCfg();
        const m = $('saveMsg');
        m.textContent = 'Salvo! A assistente vai usar este provedor pra gerar imagens. ✅';
        setTimeout(() => (m.textContent = ''), 4000);
      });

      // gerar (salva o provedor de imagem na config e gera)
      genBtn.addEventListener('click', async () => {
        const prompt = promptEl.value.trim();
        if (!prompt) {
          statusEl.textContent = 'Escreva um prompt.';
          return;
        }
        await saveImageCfg(); // salva (a assistente tambem passa a usar)

        genBtn.disabled = true;
        statusEl.textContent = 'Gerando… 🎨';
        resultEl.innerHTML = '';
        try {
          const r = await window.api.generateImage(prompt);
          if (r && r.images && r.images.length) {
            statusEl.textContent = `Pronto! Salva em Imagens/Lumi. ✅`;
            r.images.forEach((url) => {
              const im = document.createElement('img');
              im.src = url;
              resultEl.appendChild(im);
            });
          } else {
            statusEl.textContent = '⚠ ' + ((r && r.error) || 'não veio imagem');
          }
        } catch (e) {
          statusEl.textContent = '⚠ ' + (e.message || e);
        }
        genBtn.disabled = false;
      });

      $('openFolder').addEventListener('click', () => window.api.openGalleryFolder());
    </script>
    <script>
      window.__lumiThemed = true;
    </script>
    <script src="theme.js"></script>
    <script src="_chrome.js"></script>
  </body>
</html>

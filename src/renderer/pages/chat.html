<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Chat</title>
    <style>
      :root {
        --bg: #16161e; --surface: #24242f; --surface-2: #0f0f16;
        --accent: #7aa2ff; --accent-text: #fff; --text: #eee; --border: #2a2a38;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      #msgs {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .history-pager {
        align-self: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        color: #aeb7c6;
        padding: 6px 12px;
        font: 600 11px/1 "Segoe UI", sans-serif;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      }
      .history-pager:hover { border-color: var(--accent); color: var(--text); }
      .history-pager small { opacity: 0.65; font-weight: 400; margin-left: 4px; }
      .msg {
        max-width: 85%;
        padding: 8px 11px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.45;
        word-break: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 3px;
        white-space: pre-wrap;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .msg.user img {
        max-width: 100%;
        border-radius: 8px;
        display: block;
      }
      .msg.user.steer {
        background: color-mix(in srgb, var(--accent) 78%, #e0556e);
        border: 1px dashed rgba(255, 255, 255, 0.5);
      }
      .steerbadge {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        opacity: 0.85;
        font-weight: 600;
      }
      .msg.assistant {
        align-self: flex-start;
        background: var(--surface);
        border-bottom-left-radius: 3px;
      }
      .msg.error {
        align-self: center;
        background: #3a2030;
        color: #ffb4b4;
        font-size: 12px;
      }
      .msg.tool {
        align-self: stretch;
        max-width: 100%;
        background: #1c2630;
        color: #8fb3c7;
        font-size: 11px;
      }
      .msg.diff {
        align-self: stretch;
        max-width: 100%;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0;
        overflow: hidden;
        font-family: Consolas, monospace;
        font-size: 11px;
      }
      .msg.diff .head {
        padding: 5px 8px;
        background: #1c2630;
        color: #9cc;
      }
      .msg.diff pre {
        margin: 0;
        padding: 6px 8px;
        max-height: 260px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.diff .add {
        color: #7ee0a0;
      }
      .msg.diff .del {
        color: #ff9b9b;
      }
      .msg.diff .ctx {
        color: #5a6672;
      }
      .msg.tool summary {
        cursor: pointer;
        list-style: none;
      }
      .msg.tool summary::-webkit-details-marker {
        display: none;
      }
      .msg.tool pre {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 6px 0 0;
        font-family: Consolas, monospace;
        font-size: 11px;
        max-height: 220px;
        overflow: auto;
        background: var(--surface-2);
        padding: 6px 8px;
        border-radius: 6px;
        color: #cfe;
      }
      .msg.assistant b {
        color: #fff;
      }
      .msg.assistant code {
        background: var(--surface-2);
        padding: 1px 5px;
        border-radius: 4px;
        font-family: Consolas, monospace;
        font-size: 12px;
      }
      .msg.assistant pre {
        background: var(--surface-2);
        padding: 8px 10px;
        border-radius: 6px;
        overflow-x: auto;
        margin: 6px 0;
      }
      .msg.assistant pre code {
        background: none;
        padding: 0;
      }
      /* blocos de código: header com linguagem + botão copiar */
      .codewrap {
        margin: 6px 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface-2);
      }
      .codehead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 8px 3px 10px;
        background: color-mix(in srgb, var(--surface-2) 60%, var(--surface));
        border-bottom: 1px solid var(--border);
        font-size: 10px;
        color: #9aa;
        text-transform: lowercase;
        letter-spacing: 0.4px;
      }
      .codehead .cpy {
        border: none;
        background: transparent;
        color: #9aa;
        font-size: 10px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 5px;
        font-family: inherit;
      }
      .codehead .cpy:hover {
        background: var(--border);
        color: var(--text);
      }
      .codewrap pre {
        margin: 0;
        border: none;
        border-radius: 0;
      }
      /* horário discreto nas bolhas */
      .mtime {
        font-size: 9px;
        opacity: 0.55;
        align-self: flex-end;
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
        user-select: none;
      }
      .msg.assistant .mtime {
        display: block;
        text-align: right;
      }
      /* indicador "digitando…" (3 pontinhos) */
      #typing {
        align-self: flex-start;
        background: var(--surface);
        border-radius: 14px;
        border-bottom-left-radius: 3px;
        padding: 10px 14px;
        display: flex;
        gap: 5px;
        align-items: center;
      }
      #typing i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--text) 65%, transparent);
        animation: typdot 1.2s infinite ease-in-out;
      }
      #typing i:nth-child(2) { animation-delay: 0.15s; }
      #typing i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes typdot {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
        30% { transform: translateY(-4px); opacity: 1; }
      }
      /* micro-animações: mensagens surgem suaves, botões respondem ao toque */
      .msg {
        animation: msgIn 0.22s ease both;
      }
      @keyframes msgIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      #bar button,
      .hbtn {
        transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease;
      }
      #bar button:hover,
      .hbtn:hover {
        transform: scale(1.08);
      }
      #bar button:active,
      .hbtn:active {
        transform: scale(0.94);
      }
      /* fundo aurora sutil (gradientes suaves se movendo bem devagar) */
      html { background: var(--bg); }
      body { background: transparent; }
      body::before {
        content: '';
        position: fixed;
        inset: -30%;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(ellipse 45% 38% at 22% 26%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%),
          radial-gradient(ellipse 42% 36% at 78% 72%, color-mix(in srgb, #b07ae0 11%, transparent), transparent 70%),
          radial-gradient(ellipse 38% 32% at 62% 18%, color-mix(in srgb, #5ec9c0 8%, transparent), transparent 70%);
        animation: aurora 36s ease-in-out infinite alternate;
      }
      @keyframes aurora {
        0% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(3%, -4%) rotate(3deg); }
        100% { transform: translate(-3%, 3%) rotate(-2deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .msg, body::before, #typing i, #stop, .agentlive .spin { animation: none !important; }
        #bar button, .hbtn { transition: none; }
      }
      /* ações no hover das bolhas (copiar / editar / regenerar) */
      .msg.user, .msg.assistant { position: relative; }
      .mact {
        position: absolute;
        top: -13px;
        right: 8px;
        display: flex;
        gap: 2px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 2px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
        z-index: 5;
      }
      .msg:hover > .mact { opacity: 1; pointer-events: auto; }
      .mact button {
        border: none;
        background: transparent;
        color: #9aa;
        width: 22px;
        height: 22px;
        border-radius: 5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .mact button:hover { background: var(--border); color: var(--text); }
      .mact button svg { width: 13px; height: 13px; }
      /* busca na conversa (Ctrl+F) */
      #searchBar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }
      #searchBar[hidden] { display: none; }
      #searchBar input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        padding: 5px 9px;
        font-size: 12px;
        font-family: inherit;
        outline: none;
      }
      #searchBar input:focus { border-color: var(--accent); }
      #searchCount { font-size: 11px; color: #9aa; white-space: nowrap; }
      #searchBar button {
        border: none;
        background: transparent;
        color: #9aa;
        width: 22px;
        height: 22px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 10px;
        padding: 0;
      }
      #searchBar button:hover { background: var(--border); color: var(--text); }
      #msgs.searching .msg { opacity: 0.25; }
      #msgs.searching .msg.smatch { opacity: 1; }
      #msgs.searching .msg.scur { outline: 2px solid var(--accent); outline-offset: 1px; }
      .qchk {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text);
        padding: 4px 0;
        cursor: pointer;
      }
      .qchk input { accent-color: var(--accent); width: 15px; height: 15px; flex: 0 0 auto; }
      /* plano de tarefas da Lumi (checklist vivo) */
      #planBox {
        flex: 0 0 auto;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        max-height: 180px;
        overflow-y: auto;
      }
      #planBox[hidden] { display: none; }
      #planSum {
        cursor: pointer;
        padding: 6px 8px 6px 12px;
        color: #9aa;
        user-select: none;
        list-style: none;
        position: sticky;
        top: 0;
        background: var(--surface-2);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #planSum .psp { flex: 1; }
      #planHide {
        border: none;
        background: transparent;
        color: #778;
        width: 20px;
        height: 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 11px;
        padding: 0;
      }
      #planHide:hover { background: var(--border); color: var(--text); }
      #planSum::before { content: '▸ '; }
      #planBox[open] #planSum::before { content: '▾ '; }
      #planItems { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 3px; }
      .pitem { display: flex; gap: 7px; align-items: baseline; }
      .pitem.done { color: #7a8a7d; text-decoration: line-through; }
      .pitem.doing { color: var(--text); font-weight: 600; }
      .pitem.pending { color: #9aa; }
      .pitem .pic { flex: 0 0 auto; }
      .pitem.doing .pic { animation: pulse 1.2s infinite; display: inline-block; }
      /* checkpoint (desfazer mudanças do turno) */
      .cpline { display: flex; align-items: center; gap: 8px; }
      .cpline button {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        border-radius: 7px;
        padding: 3px 10px;
        font-size: 11px;
        cursor: pointer;
        font-family: inherit;
      }
      .cpline button:hover:not(:disabled) { background: #3a2030; border-color: #e0556e; color: #ffb4b4; }
      .cpline button:disabled { opacity: 0.5; cursor: default; }
      /* botão "voltar ao vivo" (aparece quando você rola pra cima durante a geração) */
      #toBottom {
        position: fixed;
        bottom: 124px;
        right: 16px;
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: color-mix(in srgb, var(--surface) 90%, transparent);
        color: var(--text);
        font-size: 16px;
        cursor: pointer;
        z-index: 50;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(6px);
      }
      #toBottom:hover { background: var(--accent); color: var(--accent-text); }
      #toBottom[hidden] { display: none; }
      /* card de pergunta (ask_user — ela espera sua resposta) */
      .askcard {
        align-self: stretch;
        max-width: 100%;
        background: color-mix(in srgb, var(--accent) 7%, var(--surface-2));
        border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
        border-radius: 12px;
        padding: 11px 13px;
        animation: msgIn 0.22s ease both;
      }
      .askcard .aq {
        font-size: 13px;
        color: var(--text);
        margin-bottom: 9px;
        display: flex;
        gap: 8px;
        align-items: baseline;
        white-space: pre-wrap;
      }
      .askcard .aq::before { content: '🙋‍♀️'; }
      .askcard .aopts { display: flex; flex-wrap: wrap; gap: 6px; }
      .askcard .aopt {
        border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--border));
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--text);
        border-radius: 16px;
        padding: 6px 13px;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.12s, transform 0.1s;
      }
      .askcard .aopt:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 28%, transparent); transform: scale(1.03); }
      .askcard .aopt:disabled { opacity: 0.45; cursor: default; }
      .askcard .aopt.chosen {
        background: var(--accent);
        color: var(--accent-text);
        opacity: 1;
      }
      .askcard .afree { display: flex; gap: 6px; margin-top: 8px; }
      .askcard .afree input,
      .askcard .afree textarea {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        padding: 6px 10px;
        font-size: 12px;
        font-family: inherit;
        outline: none;
        resize: vertical;
      }
      .askcard .afree button {
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-text);
        padding: 0 12px;
        cursor: pointer;
        font-size: 12px;
      }
      .askcard .aans { margin-top: 8px; font-size: 12px; color: #8fa; }
      /* card de diff (edição de arquivo) */
      .diffcard {
        align-self: stretch;
        max-width: 100%;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .diffcard > summary {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        cursor: pointer;
        list-style: none;
        user-select: none;
        font-size: 12px;
      }
      .diffcard > summary:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
      .diffcard .dic { display: flex; color: var(--accent); }
      .diffcard .dic svg { width: 13px; height: 13px; }
      .diffcard .dpath {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: Consolas, monospace;
        color: var(--text);
      }
      .dbadge {
        flex: 0 0 auto;
        font-size: 10px;
        font-weight: 700;
        font-family: Consolas, monospace;
        border-radius: 5px;
        padding: 1px 6px;
      }
      .dbadge.add { background: color-mix(in srgb, #7ee0a0 18%, transparent); color: #7ee0a0; }
      .dbadge.del { background: color-mix(in srgb, #e0556e 18%, transparent); color: #ff9b9b; }
      .diffcard .dbody {
        margin: 0;
        padding: 6px 10px 8px;
        border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 260px;
        overflow: auto;
        font-family: Consolas, monospace;
        font-size: 11px;
        line-height: 1.5;
      }
      .dl-add { color: #7ee0a0; background: color-mix(in srgb, #7ee0a0 7%, transparent); }
      .dl-del { color: #ff9b9b; background: color-mix(in srgb, #e0556e 7%, transparent); }
      .dl-ctx { color: #667; }
      /* grupo de atividade (ações consecutivas colapsadas num card) */
      .actgroup {
        align-self: stretch;
        max-width: 100%;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 12px;
        animation: msgIn 0.22s ease both;
      }
      .actgroup > summary {
        cursor: pointer;
        padding: 7px 12px;
        color: #9aa;
        user-select: none;
        list-style: none;
      }
      .actgroup > summary::before { content: '▸ '; }
      .actgroup[open] > summary::before { content: '▾ '; }
      .actgroup .actbody { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 6px; }
      .actgroup .actbody .msg { align-self: stretch; max-width: 100%; animation: none; }
      /* narração ao vivo do subagente (stream dentro do card dele) */
      .agstream {
        margin-top: 6px; padding-top: 5px; border-top: 1px dashed var(--border);
        max-height: 140px; overflow: auto; font-size: 11.5px; line-height: 1.5;
        color: #9aa9b8; white-space: pre-wrap; word-break: break-word;
      }
      .msg.assistant .lnk {
        color: #8ab4ff;
        text-decoration: underline;
      }
      .msg.assistant table {
        border-collapse: collapse;
        margin: 6px 0;
        font-size: 12px;
      }
      .msg.assistant th,
      .msg.assistant td {
        border: 1px solid #3a3a48;
        padding: 3px 8px;
        text-align: left;
      }
      .msg.assistant th {
        background: var(--border);
      }
      #previews {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        padding: 4px 4px 2px;
      }
      #previews:empty { display: none; }
      #previews .thumb {
        position: relative;
      }
      #previews .thumb img {
        height: 46px;
        border-radius: 6px;
        display: block;
      }
      #previews .rm {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        line-height: 16px;
        padding: 0;
        border-radius: 50%;
        background: #e0556e;
        color: #fff;
        border: none;
        font-size: 12px;
        cursor: pointer;
      }
      /* card de input (estilo Claude Code): texto em cima, ferramentas embaixo */
      #bar {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin: 6px 10px 10px;
        padding: 6px 8px 7px;
        background: color-mix(in srgb, var(--surface-2) 92%, transparent);
        border: 1px solid var(--border);
        border-radius: 14px;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      #bar:focus-within {
        border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent);
      }
      /* wrapper: textarea por cima + camada de destaque atrás (alinhadas) */
      #inputWrap {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      #input,
      #inputHL {
        width: 100%;
        padding: 7px 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        font-size: 13px;
        font-family: inherit;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      #inputHL {
        position: absolute;
        inset: 0;
        background: transparent;
        color: transparent;
        overflow: hidden;
        pointer-events: none;
      }
      /* fileira de ferramentas do card */
      #inputTools {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .tgrow { flex: 1; }
      #modelLabel {
        font-size: 11px;
        color: #889;
        cursor: pointer;
        padding: 3px 8px;
        border-radius: 6px;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #modelLabel:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--text); }
      /* chip do arquivo ativo do editor (indexação automática, clique liga/desliga) */
      .fchip {
        display: flex;
        align-items: center;
        gap: 5px;
        border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        color: var(--text);
        border-radius: 7px;
        padding: 3px 8px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        max-width: 170px;
        margin-left: 4px;
      }
      .fchip svg { width: 12px; height: 12px; flex: 0 0 auto; color: var(--accent); }
      .fchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .fchip[hidden] { display: none; }
      .fchip.off {
        opacity: 0.5;
        border-style: dashed;
        background: transparent;
      }
      .fchip.off svg { color: #778; }
      #input {
        position: relative;

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>

    <script>
      const msgs = document.getElementById('msgs');
      const input = document.getElementById('input');
      const sendBtn = document.getElementById('send');
      const stopBtn = document.getElementById('stop');
      const micBtn = document.getElementById('micBtn');
      const imgBtn = document.getElementById('imgBtn');
      const forkBtn = document.getElementById('forkBtn');
      function setProcessing(on) {
        stopBtn.hidden = !on;
        input.placeholder = on
          ? 'Processando…  digite pra orientar (steering)  ·  ⏹ pra parar'
          : 'Mensagem...   / comandos   ·   @ arquivos   ·   Ctrl+V imagens';
      }
      stopBtn.addEventListener('click', () => window.api.stopChat());
      const fileInput = document.getElementById('fileInput');
      const previews = document.getElementById('previews');
      let curAssistant = null;
      let curRaw = '';
      let curThinking = null;
      let curThinkingDet = null;
      const HISTORY_PAGE = 120; // janela de render (mais fôlego pro papo — antes 60)
      const HISTORY_STEP = 60;
      let historyRows = [];
      let historyPageStart = 0;
      let historyLastPlan = null;

      function addThinking(t) {
        if (!curThinking) {
          clearEmpty();
          const d = document.createElement('div');
          d.className = 'msg tool';
          curThinkingDet = document.createElement('details');
          curThinkingDet.open = true;
          const sum = document.createElement('summary');
          sum.textContent = '💭 Pensando…';
          curThinking = document.createElement('pre');
          curThinkingDet.appendChild(sum);
          curThinkingDet.appendChild(curThinking);
          d.appendChild(curThinkingDet);
          msgs.appendChild(d);
        }
        curThinking.textContent = (curThinking.textContent + t).slice(-24000);
        scrollBottom();
      }
      function collapseThinking() {
        if (curThinkingDet && curThinkingDet.open) {
          curThinkingDet.open = false;
          curThinkingDet.querySelector('summary').textContent = '💭 Raciocínio';
        }
      }

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // ---------- markdown ----------
      function inlineMd(h) {
        h = h.replace(/(\*\*|__)(.+?)\1/g, '<b>$2</b>');
        h = h.replace(/(\*|_)(.+?)\1/g, '<i>$2</i>');
        h = h.replace(/~~(.+?)~~/g, '<s>$1</s>');
        h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<span class="lnk" title="$2">$1</span>');
        return h;
      }
      function renderTable(block) {
        const lines = block.trim().split(/\r?\n/).filter((l) => l.trim());
        if (lines.length < 2) return escapeHtml(block);
        const cells = (line) =>
          line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim());
        const fmt = (c) => inlineMd(escapeHtml(c));
        const header = cells(lines[0]);
        const body = lines.slice(2).map(cells);
        let h = '<table><thead><tr>' + header.map((c) => '<th>' + fmt(c) + '</th>').join('') + '</tr></thead>';
        if (body.length) {
          h += '<tbody>' + body.map((r) => '<tr>' + r.map((c) => '<td>' + fmt(c) + '</td>').join('') + '</tr>').join('') + '</tbody>';
        }
        return h + '</table>';
      }
      function mdToHtml(src) {
        src = String(src).replace(/\[emo[cç][aã]o:[^\]]*\]/gi, ''); // tag de emoção é só pro avatar
        src = src.replace(/\s*\[\s*[\p{L}]{2,20}\s*\]\s*$/u, ''); // forma curta no fim: [feliz], [brava]...
        const blocks = [];
        src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, function (m, lang, code) {
          blocks.push({ lang: lang || '', code });
          return '@@@CB' + (blocks.length - 1) + '@@@';
        });
        const inl = [];
        src = src.replace(/`([^`]+)`/g, function (m, c) {
          inl.push(c);
          return '@@@IC' + (inl.length - 1) + '@@@';
        });
        const tables = [];
        src = src.replace(
          /(?:^\|.*\|[ \t]*\r?\n)(?:\|[ \t:|-]+\|[ \t]*\r?\n)(?:\|.*\|[ \t]*\r?\n?)*/gm,
          function (block) {
            tables.push(block);
            return '@@@TB' + (tables.length - 1) + '@@@';
          }
        );
        let h = escapeHtml(src);
        h = h.replace(/^\s{0,3}#{1,6}\s*(.+)$/gm, '<b>$1</b>');
        h = inlineMd(h);
        h = h.replace(/^\s*[-*+]\s+(.+)$/gm, '&bull; $1');
        h = h.replace(/^\s*\d+\.\s+(.+)$/gm, '$1');
        h = h.replace(/\n/g, '<br>');
        h = h.replace(/@@@TB(\d+)@@@/g, (m, i) => renderTable(tables[i]));
        h = h.replace(/@@@IC(\d+)@@@/g, (m, i) => '<code>' + escapeHtml(inl[i]) + '</code>');
        h = h.replace(/@@@CB(\d+)@@@/g, (m, i) => {
          const b = blocks[i];
          const lang = escapeHtml(b.lang || '');
          return (
            '<div class="codewrap"><div class="codehead"><span>' + (lang || 'código') + '</span>' +
            '<button class="cpy" title="Copiar código">copiar</button></div>' +
            '<pre><code class="language-' + (lang || 'plaintext') + '">' + escapeHtml(b.code) + '</code></pre></div>'
          );
        });
        return h;
      }

      // botão "copiar" dos blocos de código (delegado: o innerHTML é re-renderizado no streaming)
      msgs.addEventListener('click', (e) => {
        const btn = e.target.closest('.cpy');
        if (!btn) return;
        const code = btn.closest('.codewrap')?.querySelector('pre code');
        if (!code) return;
        navigator.clipboard.writeText(code.textContent).then(() => {
          btn.textContent = '✓ copiado';
          setTimeout(() => (btn.textContent = 'copiar'), 1600);
        });
      });

      // ---------- syntax highlight (highlight.js via CDN; se offline, segue sem cor) ----------
      (function () {
        const l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css';
        document.head.appendChild(l);
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js';
        document.head.appendChild(s);
      })();
      function enhanceCode(el) {
        if (!el || !window.hljs) return;
        el.querySelectorAll('pre code:not(.hljs)').forEach((c) => {
          if (c.textContent.length > 30000) return; // não trava em blocos gigantes
          try {
            hljs.highlightElement(c);
          } catch (e) {
            /* segue sem cor */
          }
        });
      }

      // ---------- horário nas bolhas + indicador "digitando" ----------
      const fmtTime = (ts) => {
        const d = ts ? new Date(ts) : new Date();
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      };
      function stamp(el, ts) {
        if (!el || el.querySelector(':scope > .mtime')) return;
        const t = document.createElement('span');
        t.className = 'mtime';
        t.textContent = fmtTime(ts);
        el.appendChild(t);
      }
      let typingEl = null;
      function showTyping() {
        if (typingEl) return;
        clearEmpty();
        typingEl = document.createElement('div');
        typingEl.id = 'typing';
        typingEl.innerHTML = '<i></i><i></i><i></i>';
        msgs.appendChild(typingEl);
        scrollBottom();
      }
      function hideTyping() {
        if (typingEl) {
          typingEl.remove();
          typingEl = null;
        }
      }
      function bumpTyping() {
        // mantém os pontinhos sempre como último item (abaixo das linhas de ferramenta)
        if (typingEl) msgs.appendChild(typingEl);
      }

      const toast = (m, ok) => (window.__lumiToast ? window.__lumiToast(m, ok) : note(m));

      // ---------- scroll inteligente: não sequestra quando você rola pra cima ----------
      let autoScroll = true;
      const toBottomBtn = document.createElement('button');
      toBottomBtn.id = 'toBottom';
      toBottomBtn.innerHTML = '↓';
      toBottomBtn.title = 'Voltar ao vivo';
      toBottomBtn.hidden = true;
      document.body.appendChild(toBottomBtn);
      toBottomBtn.addEventListener('click', () => {
        autoScroll = true;
        msgs.scrollTop = msgs.scrollHeight;
        toBottomBtn.hidden = true;
      });
      function scrollBottom() {
        if (autoScroll) msgs.scrollTop = msgs.scrollHeight;
        else toBottomBtn.hidden = false; // chegou conteúdo novo enquanto você lia acima
      }
      // Só detecta "estou no fundo?" pro stick durante streaming. NÃO navega páginas sozinho:
      // paginar (anteriores/recentes) é só clicando nos botões — antes um timer clicava ao bater na borda.
      msgs.addEventListener('scroll', () => {
        autoScroll = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 80;
        if (autoScroll) toBottomBtn.hidden = true;
      });

      // ---------- grupo de atividade: ações consecutivas viram um card colapsável ----------
      let curAct = null; // {det, body, sum, count}
      function actBody() {
        clearEmpty();
        if (!curAct) {
          const det = document.createElement('details');
          det.className = 'actgroup';
          det.open = true; // aberto enquanto trabalha; colapsa quando a resposta começa
          const sum = document.createElement('summary');
          sum.textContent = '🔧 trabalhando…';
          const body = document.createElement('div');
          body.className = 'actbody';
          det.appendChild(sum);
          det.appendChild(body);
          msgs.appendChild(det);
          curAct = { det, body, sum, count: 0 };
        }
        return curAct.body;
      }
      function actCount() {
        if (curAct) {
          curAct.count++;
          curAct.sum.textContent = '🔧 ' + curAct.count + (curAct.count === 1 ? ' ação' : ' ações');
        }
      }
      function closeActivity() {
        if (curAct) {
          curAct.det.open = false; // colapsa — clique no header expande de volta
          curAct = null;
        }
      }

      // ---------- ações no hover das bolhas ----------
      const MICONS = {
        copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
        edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 6.4a1 1 0 0 0 0-1.4l-2.2-2.2a1 1 0 0 0-1.4 0L3 17.4V21h3.6Z"/><path d="m15 5 4 4"/></svg>',
        regen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>',
      };
      function addActions(el, role, raw) {
        const old = el.querySelector(':scope > .mact');
        if (old) old.remove();
        const box = document.createElement('div');
        box.className = 'mact';
        const mk = (icon, title, fn, cls) => {
          const b = document.createElement('button');
          b.innerHTML = icon;
          b.title = title;
          if (cls) b.classList.add(cls);
          b.addEventListener('click', (e) => {
            e.stopPropagation();
            fn();
          });
          box.appendChild(b);
          return b;
        };
        mk(MICONS.copy, 'Copiar mensagem', () => {
          navigator.clipboard.writeText(raw || el.textContent);
          toast('Copiado! 📋');
        });
        if (role === 'user')
          mk(MICONS.edit, 'Editar e reenviar', () => {
            input.value = raw || '';
            autoGrowInput();
            input.focus();
          });
        if (role === 'assistant') mk(MICONS.regen, 'Regenerar resposta', () => window.api.regenChat(), 'regen');
        el.appendChild(box);
      }
      function updateRegen() {
        // só a ÚLTIMA resposta pode ser regenerada (as outras escondem o botão)
        const withRegen = [...msgs.querySelectorAll('.msg.assistant')].filter((m) => m.querySelector(':scope > .mact .regen'));
        withRegen.forEach((m, i) => {
          m.querySelector(':scope > .mact .regen').style.display = i === withRegen.length - 1 ? '' : 'none';
        });
      }

      // ---------- sons sutis (WebAudio, sem arquivos; toggle no painel rápido) ----------
      let soundsOn = true;
      let sndCtx = null;
      function blip(f1, f2, dur, vol) {
        if (!soundsOn) return;
        try {
          sndCtx = sndCtx || new (window.AudioContext || window.webkitAudioContext)();
          const t0 = sndCtx.currentTime;
          const o = sndCtx.createOscillator();
          const g = sndCtx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(f1, t0);
          o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          o.connect(g).connect(sndCtx.destination);
          o.start(t0);
          o.stop(t0 + dur + 0.02);
        } catch (e) {
          /* sem áudio, sem drama */
        }
      }
      const sndSend = () => blip(523, 784, 0.1, 0.045); // pop subindo (enviar)
      const sndRecv = () => blip(784, 659, 0.14, 0.045); // ding descendo (resposta pronta)

      // ---------- busca na conversa (Ctrl+F) ----------
      const searchBar = document.getElementById('searchBar');
      const searchInput = document.getElementById('searchInput');
      const searchCount = document.getElementById('searchCount');
      let sMatches = [];
      let sCur = -1;
      function runSearch() {
        msgs.querySelectorAll('.smatch,.scur').forEach((m) => m.classList.remove('smatch', 'scur'));
        sMatches = [];
        sCur = -1;
        const q = searchInput.value.trim().toLowerCase();
        if (!q) {
          msgs.classList.remove('searching');
          searchCount.textContent = '';
          return;
        }
        msgs.classList.add('searching');
        sMatches = historyRows
          .map((row, i) => ({ i, text: historyRowText(row) }))
          .filter((x) => x.text.includes(q))
          .map((x) => x.i);
        if (sMatches.length) gotoMatch(sMatches.length - 1); // começa da mais recente
        else searchCount.textContent = '0';
      }
      function gotoMatch(i) {
        if (!sMatches.length) return;
        const old = msgs.querySelector('.scur');
        if (old) old.classList.remove('scur');
        sCur = ((i % sMatches.length) + sMatches.length) % sMatches.length;
        const rowIndex = sMatches[sCur];
        if (rowIndex < historyPageStart || rowIndex >= historyPageStart + HISTORY_PAGE) {
          showHistoryPage(Math.max(0, rowIndex - Math.floor(HISTORY_PAGE / 2)), false);
        }
        const q = searchInput.value.trim().toLowerCase();
        msgs.querySelectorAll('[data-history-row]').forEach((el) => {
          if (historyRowText(historyRows[Number(el.dataset.historyRow)]).includes(q)) el.classList.add('smatch');
        });
        const el = msgs.querySelector('[data-history-row="' + rowIndex + '"]');
        if (el) {
          el.classList.add('scur');
          el.scrollIntoView({ block: 'center' });
        }
        searchCount.textContent = sCur + 1 + '/' + sMatches.length;
      }
      function closeSearch() {
        searchBar.hidden = true;
        searchInput.value = '';
        msgs.querySelectorAll('.smatch,.scur').forEach((m) => m.classList.remove('smatch', 'scur'));
        sMatches = [];
        msgs.classList.remove('searching');
        searchCount.textContent = '';
        input.focus();
      }
      searchInput.addEventListener('input', runSearch);
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          gotoMatch(e.shiftKey ? sCur - 1 : sCur + 1);
        } else if (e.key === 'Escape') closeSearch();
      });
      document.getElementById('searchPrev').addEventListener('click', () => gotoMatch(sCur - 1));
      document.getElementById('searchNext').addEventListener('click', () => gotoMatch(sCur + 1));
      document.getElementById('searchClose').addEventListener('click', closeSearch);
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
          e.preventDefault();
          searchBar.hidden = false;
          searchInput.focus();
          searchInput.select();
        } else if (e.key === 'Escape' && !searchBar.hidden) closeSearch();
      });

      // ---------- mensagens ----------
      function clearEmpty() {
        const e = document.getElementById('empty');
        if (e) e.remove();
      }
      const FILES_SENT = '===ARQUIVOS-MENCIONADOS===';
      function addUser(text, images, steer, ts) {
        clearEmpty();
        closeActivity(); // mensagem sua fecha o grupo de ações anterior
        const d = document.createElement('div');
        d.className = 'msg user' + (steer ? ' steer' : '');
        if (steer) {
          const badge = document.createElement('div');
          badge.className = 'steerbadge';
          badge.textContent = '↪ orientação no meio da geração';
          d.appendChild(badge);
        }
        let main = text || '';
        let attached = '';
        const idx = main.indexOf(FILES_SENT);
        if (idx >= 0) {
          attached = main.slice(idx + FILES_SENT.length).trim();
          main = main.slice(0, idx).trim();
        }
        if (main) {
          const span = document.createElement('span');
          span.textContent = main;
          d.appendChild(span);
        }
        (images || []).forEach((url) => {
          const im = document.createElement('img');
          im.src = url;
          d.appendChild(im);
        });
        if (attached) {
          const nFiles = (attached.split('📎').length - 1) + (attached.split('📁').length - 1);
          const det = document.createElement('details');
          det.style.cssText = 'margin-top:5px;font-size:11px;width:100%;';
          const sum = document.createElement('summary');
          sum.style.cssText = 'cursor:pointer;opacity:.9;';
          sum.textContent = '📎 ' + (nFiles || 1) + ' arquivo(s) anexado(s)';
          const pre = document.createElement('pre');
          pre.style.cssText =
            'white-space:pre-wrap;word-break:break-word;margin:5px 0 0;max-height:240px;overflow:auto;background:rgba(0,0,0,.28);padding:6px 8px;border-radius:6px;font-family:Consolas,monospace;font-size:11px;';
          pre.textContent = attached;
          det.appendChild(sum);
          det.appendChild(pre);
          d.appendChild(det);
        }
        if (ts) stamp(d, ts); // horário no rodapé da bolha (msgs antigas sem registro ficam sem)
        addActions(d, 'user', main); // copiar / editar e reenviar
        msgs.appendChild(d);
        scrollBottom();
        return d;
      }
      function addAssistant(text, ts) {
        clearEmpty();
        closeActivity(); // resposta começa → colapsa o card de ações
        const d = document.createElement('div');
        d.className = 'msg assistant';
        d.innerHTML = mdToHtml(text);
        if (ts) {
          // bolha vinda do histórico: já chega completa → realça código e carimba a hora
          enhanceCode(d);
          stamp(d, ts);
        }
        if (text) addActions(d, 'assistant', text); // copiar / regenerar (bolha em streaming ganha no finishBubble)
        msgs.appendChild(d);
        scrollBottom();
        return d;
      }
      function addError(text) {
        clearEmpty();
        const d = document.createElement('div');
        d.className = 'msg error';
        d.textContent = '⚠ ' + text;
        msgs.appendChild(d);
        scrollBottom();
      }
      const TOOL_LABELS = {
        get_datetime: 'vendo as horas',
        read_clipboard: 'lendo o que você copiou',
        write_clipboard: 'copiando pro seu Ctrl+V',
        connect_remote: 'conectando no servidor',
        list_ssh_hosts: 'vendo os servidores SSH',
        project_overview: 'entendendo o projeto',
        find_in_code: 'procurando no código',
        open_url: 'abrindo um link',
        play_animation: 'reagindo',
        remember_fact: 'memorizando',
        recall_facts: 'lembrando',
        list_dir: 'listando arquivos',
        read_file: 'lendo arquivo',
        write_file: 'escrevendo arquivo',
        edit_file: 'editando trecho',
        grep_files: 'procurando no código',
        git_status: 'vendo o status do git',
        git_diff: 'revisando o diff',
        git_log: 'vendo o histórico',
        run_tests: 'rodando os testes',
        locate_stack: 'localizando o erro no código',

        run_in_terminal: 'rodando no terminal',
        read_terminal: 'lendo o terminal',

        fetch_url: 'lendo página',
        web_search: 'pesquisando na web',
        http_request: 'chamando API',
        see_page: 'olhando a página',
        view_image: 'vendo imagem',
        generate_image: 'gerando imagem',
        delegate_to_agent: 'delegando tarefa',
        update_plan: 'planejando as etapas',
        ask_user: 'perguntando pra você',
        set_reminder: 'criando lembrete',
        list_reminders: 'vendo os lembretes',
        cancel_reminder: 'cancelando lembrete',
        screen_info: 'medindo a tela',
        move_mouse: 'movendo o mouse',
        click: 'clicando',
        scroll: 'rolando a tela',
        type_text: 'digitando',
        press_keys: 'pressionando teclas',
        focus_window: 'focando janela',
      };
      function argHint(args) {
        if (!args) return '';
        const a = args.query || args.pattern || args.path || args.url || args.command || args.name || args.fact;
        return a ? ': ' + String(a) : '';
      }
      function addTool(info) {
        clearEmpty();
        const d = document.createElement('div');
        d.className = 'msg tool';
        d.textContent =
          '🔧 ' + (info.agent ? info.agent + ' · ' : '') + (TOOL_LABELS[info.name] || info.name) + argHint(info.args);
        actBody().appendChild(d);
        actCount();
        bumpTyping();
        scrollBottom();
      }
      function addToolResult(info) {
        clearEmpty();
        const r = info.result;
        // imagem gerada -> mostra a imagem (nao o base64). No histórico salvo vira "[imagem]" (string)
        if (r && Array.isArray(r.images) && r.images.length) {
          closeActivity(); // a imagem aparece fora do grupo de ações
          const d = document.createElement('div');
          d.className = 'msg assistant';
          r.images.forEach((url) => {
            const im = document.createElement('img');
            im.src = url;
            im.style.maxWidth = '100%';
            im.style.borderRadius = '8px';
            im.style.display = 'block';
            im.style.marginTop = '4px';
            d.appendChild(im);
          });
          msgs.appendChild(d);
          scrollBottom();
          return;
        }
        const isErr = r && typeof r === 'object' && r.error;
        let txt;
        try {
          txt = typeof r === 'string' ? r : JSON.stringify(r, null, 2);
        } catch (e) {
          txt = String(r);
        }
        // preview completo (a caixa já é rolável); só corta em casos absurdos
        if (txt.length > 24000) txt = txt.slice(0, 24000) + '\n…[preview cortado para proteger a memória]';
        const d = document.createElement('div');
        d.className = 'msg tool';
        const det = document.createElement('details');
        const sum = document.createElement('summary');
        sum.textContent =
          (isErr ? '⚠ ' : '✓ ') + (info.agent ? info.agent + ' · ' : '') + (TOOL_LABELS[info.name] || info.name) + ' — ver resultado';
        const pre = document.createElement('pre');
        pre.textContent = txt;
        det.appendChild(sum);
        det.appendChild(pre);
        d.appendChild(det);
        actBody().appendChild(d);
        actCount();
        bumpTyping();
        scrollBottom();
      }

      // extrai texto + imagens de um conteudo (string ou array formato OpenAI)
      function extractUser(content) {
        if (typeof content === 'string') return { text: content, images: [] };
        let text = '';
        const images = [];
        (content || []).forEach((p) => {
          if (p.type === 'text') text += p.text || '';
          else if (p.type === 'image_url') images.push(p.image_url.url);
        });
        return { text, images };
      }

      // ---------- multi-chat (várias conversas) ----------
      const btnList = document.getElementById('btnList');
      const btnNew = document.getElementById('btnNew');
      const chatTitleEl = document.getElementById('chatTitle');
      const chatListEl = document.getElementById('chatList');
      const clItems = document.getElementById('clItems');

      function renderHistoryLegacy(h) {
        msgs.innerHTML = '';
        typingEl = null; // o innerHTML='' removeu os pontinhos, se existiam
        curAct = null; // idem pro grupo de ações
        autoScroll = true;
        // formato novo {messages, events, archive}; tolera o antigo (array puro)
        const list = Array.isArray(h) ? h : (h && h.messages) || [];
        const events = (!Array.isArray(h) && h && h.events) || [];
        const archive = (!Array.isArray(h) && h && h.archive) || [];
        // mensagens antigas (já compactadas pro contexto) renderizam IGUAL às normais —
        // pula as vazias (turnos só-ferramenta deixavam placeholder sem texto = balão vazio)
        archive.forEach((m) => {
          if (m.role === 'assistant') {
            if (m.content && String(m.content).trim()) enhanceCode(addAssistant(m.content));
          } else {
            const c = extractUser(m.content);
            if ((c.text && c.text.trim()) || c.images.length) addUser(c.text, c.images);
          }
        });
        const evAt = (i) => events.filter((e) => e.t !== 'mts' && e.a === i);
        const mtsAt = (i) => {
          const e = events.find((x) => x.t === 'mts' && x.a === i);
          return e && e.ts;
        };
        let lastPlan = null; // o plano final fica no painel (não vira balão)
        const renderEv = (e) => {
          const d = e.d || {};
          if (e.t === 'tool') addTool(d);
          else if (e.t === 'result') addToolResult(d);
          else if (e.t === 'diff') addDiff(d);
          else if (e.t === 'note') note(d.text || '');
          else if (e.t === 'plan') lastPlan = Array.isArray(e.d) ? e.d : null;
          else if (e.t === 'ask') renderAskCard(d, false);
          else if (e.t === 'askdone') lockAskCard(d.id, d.answer);
          else if (e.t === 'agent') {
            const x = document.createElement('div');
            x.className = 'msg tool';
            if (d.phase === 'start') {
              x.style.borderLeft = '2px solid var(--accent)';
              x.textContent = '🤖 ' + (d.name || 'agente') + (d.task ? ' — ' + d.task : '');
            } else {
              x.style.borderLeft = '2px solid #7ee0a0';
              x.textContent = '✓ ' + (d.name || 'agente') + ' concluiu';
            }
            msgs.appendChild(x);
          }
        };
        list.forEach((m, i) => {
          evAt(i).forEach(renderEv); // ferramentas/agentes/diffs que rolaram antes desta mensagem
          if (m.role === 'assistant') {
            if (!m.content || !String(m.content).trim()) return; // turno só-ferramenta: sem balão vazio
            const ts = mtsAt(i);
            const el = addAssistant(m.content, ts);
            if (!ts) enhanceCode(el); // chats antigos sem horário ainda ganham highlight
          } else {
            const c = extractUser(m.content);
            if ((c.text && c.text.trim()) || c.images.length) addUser(c.text, c.images, false, mtsAt(i));
          }
        });
        evAt(list.length).forEach(renderEv); // eventos após a última mensagem
        closeActivity(); // fecha o último card de ações do histórico
        renderPlan(lastPlan); // restaura o plano (ou esconde, se a conversa não tem)
        updateRegen(); // só a última resposta mostra o botão de regenerar
        if (!list.length) {
          const e = document.createElement('div');
          e.id = 'empty';
          e.textContent = 'Comece a conversar 👇';
          msgs.appendChild(e);
        }
      }
      function historyRowText(row) {
        if (!row || row.kind !== 'message') return '';
        const c = extractUser(row.message.content);
        return (row.message.role === 'assistant' ? String(row.message.content || '') : c.text || '').toLowerCase();
      }

      function renderHistoryEvent(e) {
        const d = e.d || {};
        if (e.t === 'tool') addTool(d);
        else if (e.t === 'result') addToolResult(d);
        else if (e.t === 'diff') addDiff(d);
        else if (e.t === 'note') note(d.text || '');
        else if (e.t === 'ask') renderAskCard(d, false);
        else if (e.t === 'askdone') lockAskCard(d.id, d.answer);
        else if (e.t === 'agent') {
          const x = document.createElement('div');
          x.className = 'msg tool';
          if (d.phase === 'start') {
            x.style.borderLeft = '2px solid var(--accent)';
            x.textContent = '🤖 ' + (d.name || 'agente') + (d.task ? ' — ' + d.task : '');
          } else {
            x.style.borderLeft = '2px solid #7ee0a0';
            x.textContent = '✓ ' + (d.name || 'agente') + ' concluiu';
          }
          msgs.appendChild(x);
        }
      }

      function addHistoryPager(kind, count) {
        const b = document.createElement('button');
        b.className = 'history-pager ' + kind;
        b.innerHTML =
          (kind === 'older' ? '↑ Carregar anteriores' : '↓ Voltar às recentes') +
          '<small>' + count + ' ocultos</small>';
        b.addEventListener('click', () => {
          const next = kind === 'older'
            ? Math.max(0, historyPageStart - HISTORY_STEP)
            : Math.min(Math.max(0, historyRows.length - HISTORY_PAGE), historyPageStart + HISTORY_STEP);
          showHistoryPage(next, kind === 'newer' && next + HISTORY_PAGE >= historyRows.length);
        });
        msgs.appendChild(b);
      }

      function showHistoryPage(start, stickBottom, pageLen) {
        const win = Math.max(HISTORY_PAGE, Number(pageLen) || HISTORY_PAGE);
        const maxStart = Math.max(0, historyRows.length - win);
        historyPageStart = Math.max(0, Math.min(Number(start) || 0, maxStart));
        const end = Math.min(historyRows.length, historyPageStart + win);
        msgs.innerHTML = '';
        typingEl = null;
        curAct = null;
        curAssistant = null;
        curThinking = null;
        curThinkingDet = null;
        autoScroll = !!stickBottom;

        if (historyPageStart > 0) addHistoryPager('older', historyPageStart);
        for (let i = historyPageStart; i < end; i++) {
          const row = historyRows[i];
          if (row.kind === 'event') {
            renderHistoryEvent(row.event);
            continue;
          }
          const m = row.message;
          let el = null;
          if (m.role === 'assistant') {
            if (!m.content || !String(m.content).trim()) continue;
            el = addAssistant(m.content, row.ts);
            if (!row.ts) enhanceCode(el);
          } else {
            const c = extractUser(m.content);
            if ((c.text && c.text.trim()) || c.images.length) el = addUser(c.text, c.images, false, row.ts);
          }
          if (el) el.dataset.historyRow = i;
        }
        closeActivity();
        if (end < historyRows.length) addHistoryPager('newer', historyRows.length - end);
        renderPlan(historyLastPlan);
        updateRegen();
        if (!historyRows.length) {
          const e = document.createElement('div');
          e.id = 'empty';
          e.textContent = 'Comece a conversar 👇';
          msgs.appendChild(e);
        }
        if (stickBottom) requestAnimationFrame(() => (msgs.scrollTop = msgs.scrollHeight));
        else requestAnimationFrame(() => (msgs.scrollTop = historyPageStart > 0 ? 38 : 0));
      }

      function renderHistory(h) {
        const list = Array.isArray(h) ? h : (h && h.messages) || [];
        const events = (!Array.isArray(h) && h && h.events) || [];
        const archive = (!Array.isArray(h) && h && h.archive) || [];
        const times = new Map();
        historyLastPlan = null;
        events.forEach((e) => {
          if (e.t === 'mts') times.set(e.a, e.ts);
          else if (e.t === 'plan' && Array.isArray(e.d)) historyLastPlan = e.d;
        });
        historyRows = archive.map((message) => ({ kind: 'message', message, ts: null }));
        for (let i = 0; i <= list.length; i++) {
          events.forEach((e) => {
            if (e.t !== 'mts' && e.t !== 'plan' && e.a === i) historyRows.push({ kind: 'event', event: e });
          });
          if (i < list.length) historyRows.push({ kind: 'message', message: list[i], ts: times.get(i) });
        }
        // janela recente: começa em no MÍNIMO o penúltimo prompt do usuário, garantindo
        // os 2 últimos prompts INTEIROS na tela (mesmo que tenham muitas tool calls)
        let start = Math.max(0, historyRows.length - HISTORY_PAGE);
        const userIdx = [];
        for (let i = 0; i < historyRows.length; i++) {
          const r = historyRows[i];
          if (r.kind === 'message' && r.message && r.message.role === 'user') userIdx.push(i);
        }
        if (userIdx.length >= 2) start = Math.min(start, userIdx[userIdx.length - 2]);
        showHistoryPage(start, true, historyRows.length - start);
      }

      function refreshTitle() {
        window.api.chatsCurrent().then((c) => (chatTitleEl.textContent = (c && c.title) || 'Conversa'));
      }
      function loadHistoryIntoUI() {
        window.api.getHistory().then(renderHistory);
        refreshTitle();
      }
      function renderChatList(list) {
        clItems.innerHTML = '';
        (list || []).forEach((c) => {
          const row = document.createElement('div');
          row.className = 'citem' + (c.current ? ' cur' : '');
          const t = document.createElement('div');
          t.className = 'ct';
          const tt = document.createElement('div');
          tt.className = 'ctt';
          tt.textContent = c.title || 'Conversa';
          const tm = document.createElement('div');
          tm.className = 'ctm';
          tm.textContent = (c.count || 0) + ' msgs';
          t.appendChild(tt);
          t.appendChild(tm);
          t.addEventListener('click', () => {
            if (!c.current) window.api.chatsSwitch(c.id);
            chatListEl.hidden = true;
          });
          const pop = document.createElement('button');
          pop.className = 'ca';
          pop.title = 'Abrir em nova janela';
          pop.textContent = '↗';
          pop.addEventListener('click', (e) => {
            e.stopPropagation();
            if (window.api.openChatWindowFor) window.api.openChatWindowFor(c.id);
            chatListEl.hidden = true;
          });
          const ren = document.createElement('button');
          ren.className = 'ca';
          ren.title = 'Renomear';
          ren.textContent = '✎';
          ren.addEventListener('click', (e) => {
            e.stopPropagation();
            const inp = document.createElement('input');
            inp.type = 'text';
            inp.value = c.title || '';
            inp.style.cssText =
              'width:100%;font-size:13px;background:var(--surface-2);color:var(--text);border:1px solid var(--accent);border-radius:5px;padding:2px 5px;';
            tt.replaceWith(inp);
            inp.focus();
            inp.select();
            let done = false;
            const commit = async () => {
              if (done) return;
              done = true;
              await window.api.chatsRename(c.id, inp.value.trim());
              if (c.current) refreshTitle();
              openList();
            };
            inp.addEventListener('keydown', (ev) => {
              if (ev.key === 'Enter') {
                ev.preventDefault();
                commit();
              } else if (ev.key === 'Escape') {
                done = true;
                openList();
              }
            });
            inp.addEventListener('blur', commit);
          });
          const del = document.createElement('button');
          del.className = 'ca';
          del.title = 'Apagar';
          del.textContent = '🗑';
          del.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (confirm('Apagar esta conversa? (não dá pra desfazer)')) {
              await window.api.chatsDelete(c.id);
              openList();
            }
          });
          row.appendChild(t);
          row.appendChild(pop);
          row.appendChild(ren);
          row.appendChild(del);
          clItems.appendChild(row);
        });
        if (!(list && list.length)) {
          clItems.innerHTML = '<div class="citem"><div class="ct"><div class="ctm">Nenhuma conversa ainda.</div></div></div>';
        }
      }
      function openList() {
        document.getElementById('quickPanel').hidden = true; // fecha o painel de ajustes
        window.api.chatsList().then((l) => {
          renderChatList(l);
          chatListEl.hidden = false;
        });
      }
      btnList.addEventListener('click', () => (chatListEl.hidden ? openList() : (chatListEl.hidden = true)));
      document.getElementById('clClose').addEventListener('click', () => (chatListEl.hidden = true));
      document.getElementById('clNewWin').addEventListener('click', () => {
        if (window.api.openChatWindow) window.api.openChatWindow(); // nova conversa em janela separada
        chatListEl.hidden = true;

      btnNew.addEventListener('click', () => window.api.chatsNew());
      window.api.onChatReload(() => {
        chatListEl.hidden = true;
        loadHistoryIntoUI();
      });

      // multi-janela: prende esta janela à conversa do ?session (vazio = segue a ativa) ANTES de buscar o histórico
      const SESSION = new URLSearchParams(location.search).get('session') || '';
      (window.api.chatBind ? window.api.chatBind(SESSION) : Promise.resolve()).then(loadHistoryIntoUI);

      // ---------- ajustes rápidos (modelo, preset, permissões) ----------
      const PERMS = [
        ['read', 'Ler arquivos'], ['write', 'Criar/editar'], ['delete', 'Apagar'],
        ['exec', 'Comandos'], ['network', 'Internet'], ['open', 'Abrir links'],
        ['mcp', 'MCP'], ['screen', 'Ver tela'], ['control', 'Controlar PC ⚠️'],
      ];
      const btnQuick = document.getElementById('btnQuick');
      const quickPanel = document.getElementById('quickPanel');
      const qModel = document.getElementById('qModel');
      const qPreset = document.getElementById('qPreset');
      const qPerms = document.getElementById('qPerms');

      const qOpacity = document.getElementById('qOpacity');
      const qOpacityVal = document.getElementById('qOpacityVal');
      qOpacity.addEventListener('input', () => {
        qOpacityVal.textContent = qOpacity.value + '%';

      const qSounds = document.getElementById('qSounds');

      qAcrylic.addEventListener('change', () => {

      function fillModelSelect(list, value) {
        qModel.innerHTML = '';
        (list && list.length ? list : [value || '']).forEach((v) => {
          const o = document.createElement('option');
          o.value = v;

      function renderPerms(perms) {

          const row = document.createElement('div');

      }
      // ---------- picker de modelo agrupado (favoritos + provedores colapsáveis) ----------
      const modelBtn = document.getElementById('modelBtn');
      const modelPop = document.getElementById('modelPop');
      const mpFilter = document.getElementById('mpFilter');
      const mpList = document.getElementById('mpList');
      const modelLabel = document.getElementById('modelLabel');
      let mpCat = null; // catálogo { current, groups, favorites }
      let mpCurModel = '';
      let usingClaudeCode = false;
      // estado de aberto/fechado dos grupos (persiste)
      function mpLoadCollapsed() {
        try { return new Set(JSON.parse(localStorage.getItem('lumiMpCollapsed') || '[]')); } catch (e) { return new Set(); }
      }
      let mpCollapsed = mpLoadCollapsed();
      function mpSaveCollapsed() {

      function mpSetLabel(model, preset) {

      async function mpSelect(presetName, model) {

      function mpIsFav(presetName, model) {
        return (mpCat && mpCat.favorites || []).some((f) => (f.preset || null) === (presetName || null) && f.model === model);
      }
      // monta uma linha de modelo (com estrela, nome, [provedor], check)
      function mpModelRow(model, presetName, opts) {
        opts = opts || {};
        const row = document.createElement('div');
        row.className = 'mprow' + (opts.cur ? ' cur' : '') + (opts.indent ? ' indent' : '');
        row.title = model + (presetName ? ' · ' + presetName : '');

          e.stopPropagation();

        row.appendChild(name);

        chk.textContent = '✓';
        row.appendChild(chk);
        row.addEventListener('click', () => mpSelect(presetName, model));
        return row;
      }

      function renderModelPop() {
        const q = mpFilter.value.trim().toLowerCase();
        const cat = mpCat || { groups: [], favorites: [], current: {} };
        const match = (m) => !q || m.toLowerCase().includes(q);
        mpList.innerHTML = '';

        // FAVORITOS no topo
        const favs = (cat.favorites || []).filter((f) => f.exists !== false && match(f.model));
        if (favs.length) {
          const h = document.createElement('div');
          h.className = 'mpsec';
          h.textContent = '★ Favoritos';
          mpList.appendChild(h);
          favs.forEach((f) =>
            mpList.appendChild(mpModelRow(f.model, f.preset, { provLabel: f.preset || 'atual', cur: f.model === mpCurModel }))
          );
        }

        // GRUPOS = perfis salvos (provedores)
        (cat.groups || []).forEach((g) => {
          const visible = g.models.filter(match);
          if (q && !visible.length) return; // com filtro, esconde grupo sem match
          const collapsed = q ? false : mpCollapsed.has(g.name); // filtrar força expandir
          const wrap = document.createElement('div');
          wrap.className = 'mpgroup';
          const hd = document.createElement('div');

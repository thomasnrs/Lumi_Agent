        const sum = document.createElement('summary');
        sum.innerHTML =
          '<span class="dic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 6.4a1 1 0 0 0 0-1.4l-2.2-2.2a1 1 0 0 0-1.4 0L3 17.4V21h3.6Z"/><path d="m15 5 4 4"/></svg></span>' +
          '<span class="dpath"></span>' +
          '<span class="dbadge add">+' + (d.added || 0) + '</span><span class="dbadge del">−' + (d.removed || 0) + '</span>';
        sum.querySelector('.dpath').textContent = d.path + (d.big ? ' (arquivo grande)' : '');
        sum.title = d.path;
        det.appendChild(sum);
        if (!d.big) {
          const pre = document.createElement('pre');
          pre.className = 'dbody';
          (d.lines || []).forEach((l) => {
            const row = document.createElement('div');
            row.className = l.t === '+' ? 'dl-add' : l.t === '-' ? 'dl-del' : 'dl-ctx';
            row.textContent = (l.t === '+' ? '+ ' : l.t === '-' ? '- ' : '  ') + l.v;
            pre.appendChild(row);
          });
          det.appendChild(pre);
        }
        actBody().appendChild(det);
        actCount();
        bumpTyping();
        scrollBottom();
      }
      window.api.onDiff((d) => {
        try {
          addDiff(d);
        } catch (e) {
          addError('diff render: ' + (e.message || e));
        }
      });
      window.api.onError((m) => {
        hideTyping();
        closeActivity();
        addError(m);
        curAssistant = null;
        setProcessing(false);
      });
      // workspace trocado (menu Arquivo do editor): avisa visualmente — o contexto da Lumi
      // (stack, memória do projeto, @menções) já passa a ser o do novo projeto no próximo turno
      if (window.api.onWorkspaceSwitched)
        window.api.onWorkspaceSwitched((ws) => note('📁 Workspace alterado: ' + ws + ' — a Lumi agora trabalha neste projeto'));

      window.api.onChatReset(() => {
        msgs.innerHTML = '';
        curAssistant = null;
        curAct = null;
        typingEl = null;
      });

      // ---------- imagens (anexar + colar) ----------
      const attachedImages = [];
      function downscaleImage(srcUrl, max) {
        return new Promise((res) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > max || h > max) {
              const s = max / Math.max(w, h);
              w = Math.round(w * s);
              h = Math.round(h * s);
            }
            const cv = document.createElement('canvas');
            cv.width = w;
            cv.height = h;
            cv.getContext('2d').drawImage(img, 0, 0, w, h);
            res(cv.toDataURL('image/jpeg', 0.85));
          };
          img.onerror = () => res(srcUrl);
          img.src = srcUrl;
        });
      }
      function fileToDataUrl(file) {
        return new Promise((res) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.readAsDataURL(file);
        });
      }
      async function addImageDataUrl(url) {
        attachedImages.push(await downscaleImage(url, 1280));
        renderPreviews();
      }
      function renderPreviews() {
        previews.innerHTML = '';
        attachedImages.forEach((url, i) => {
          const t = document.createElement('div');
          t.className = 'thumb';
          const im = document.createElement('img');
          im.src = url;
          const rm = document.createElement('button');
          rm.className = 'rm';
          rm.textContent = '×';
          rm.onclick = () => {
            attachedImages.splice(i, 1);
            renderPreviews();
          };
          t.appendChild(im);
          t.appendChild(rm);
          previews.appendChild(t);
        });
      }
      imgBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', async () => {
        for (const f of fileInput.files) {
          if (f.type.startsWith('image/')) await addImageDataUrl(await fileToDataUrl(f));
        }
        fileInput.value = '';
      });
      document.addEventListener('paste', async (e) => {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (const it of items) {
          if (it.type && it.type.startsWith('image/')) {
            const f = it.getAsFile();
            if (f) {
              e.preventDefault();
              await addImageDataUrl(await fileToDataUrl(f));
            }
          }
        }
      });

      // ---------- drag & drop: imagem anexa; arquivo do workspace vira @menção ----------
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', async (e) => {
        e.preventDefault();
        const files = [...((e.dataTransfer && e.dataTransfer.files) || [])];
        if (!files.length) return;
        let ws = '';
        try {
          ws = ((await window.api.getConfig()).workspace || '').replace(/\\/g, '/');
        } catch (err) {
          /* ok */
        }
        for (const f of files) {
          if (f.type && f.type.startsWith('image/')) {
            await addImageDataUrl(await fileToDataUrl(f));
            continue;
          }
          const p = (f.path || '').replace(/\\/g, '/');
          if (ws && p && p.toLowerCase().startsWith(ws.toLowerCase() + '/')) {
            // arquivo do projeto → vira menção @caminho (anexa o conteúdo no envio)
            const rel = p.slice(ws.length + 1);
            input.value = (input.value ? input.value.replace(/\s*$/, ' ') : '') + '@' + rel + ' ';
            autoGrowInput();
            input.focus();
          } else {
            toast(p ? 'Arquivo fora do workspace — só consigo mencionar arquivos do projeto' : 'Não consegui ler esse arquivo', false);
          }
        }
      });

      // ---------- microfone (STT) ----------
      let recording = false;
      let mediaRecorder = null;
      function toBase64(u8) {
        let bin = '';
        const chunk = 0x8000;
        for (let i = 0; i < u8.length; i += chunk) bin += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
        return btoa(bin);
      }
      async function toggleMic() {
        if (recording) {
          if (mediaRecorder) mediaRecorder.stop();
          return;
        }
        const c = await window.api.getConfig();
        if ((c.sttProvider || 'off') === 'off') {
          addError('Ative a transcrição (STT) nas configurações: ⚙ → Mic.');
          return;
        }
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: c.audioInput ? { deviceId: { exact: c.audioInput } } : true,
          });
        } catch (e) {
          addError('Microfone: ' + (e.message || e));
          return;
        }
        const chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size) chunks.push(e.data);
        };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach((t) => t.stop());
          recording = false;
          micBtn.classList.remove('rec');
          input.placeholder = 'Mensagem... (cole imagens com Ctrl+V)';
          const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          if (!blob.size) return;
          input.placeholder = 'Transcrevendo…';
          try {
            const b64 = toBase64(new Uint8Array(await blob.arrayBuffer()));
            const text = await window.api.transcribe(b64, blob.type);
            input.placeholder = 'Mensagem... (cole imagens com Ctrl+V)';
            if (text && text.trim()) {
              input.value = (input.value ? input.value + ' ' : '') + text.trim();
              input.focus();
            }
          } catch (e) {
            input.placeholder = 'Mensagem...';
            addError('STT: ' + (e.message || e));
          }
        };
        mediaRecorder.start();
        recording = true;
        micBtn.classList.add('rec');
        input.placeholder = 'Gravando… clique no 🎤 para parar';
      }
      micBtn.addEventListener('click', toggleMic);

      // ---------- forkar conversa ----------
      forkBtn.addEventListener('click', async () => {
        if (forkBtn.disabled) return;
        forkBtn.disabled = true; // CSS deixa opaco enquanto processa (sem mexer no ícone)
        try {
          await window.api.forkChat();
        } catch (e) {
          addError('fork: ' + (e.message || e));
        }
        forkBtn.disabled = false;
      });

      // ---------- enviar ----------
      // cresce o textarea conforme o texto (1 linha -> ate max-height) e quebra linha
      function autoGrowInput() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        renderHighlight();
      }
      // camada de destaque atrás do textarea: pinta @arquivos e /comandos
      const inputHL = document.getElementById('inputHL');
      function escHL(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function renderHighlight() {
        let html = escHL(input.value);
        html = html.replace(/^(\/[^\s]+)/, '<span class="hlcmd">$1</span>'); // /comando no início
        html = html.replace(/(^|\s)(@[^\s@]+)/g, (m, pre, tok) => pre + '<span class="hlat">' + tok + '</span>');
        inputHL.innerHTML = html + '\n';
        inputHL.scrollTop = input.scrollTop;
      }
      input.addEventListener('scroll', () => (inputHL.scrollTop = input.scrollTop));
      // ponte com o editor do workspace: "seleção → Lumi" chega por postMessage
      window.addEventListener('message', (e) => {
        const d = e.data || {};
        if (d.__lumi !== 'insert' || typeof d.text !== 'string') return;
        input.value = d.text;
        autoGrowInput();
        input.focus();
        if (d.send) send();
        else input.setSelectionRange(0, 0); // cursor no topo pra completar a pergunta
      });
      function send() {
        const t = input.value.trim();
        if (!t && !attachedImages.length) return;
        // slash command? (ex.: /nova, /fork, /imagem ...)
        if (t.startsWith('/') && handleSlash(t)) {
          input.value = '';
          autoGrowInput();
          slashPop.hidden = true;
          mentionPop.hidden = true;
          return;
        }
        const imgs = attachedImages.slice();
        input.value = '';
        autoGrowInput(); // volta a 1 linha
        attachedImages.length = 0;
        renderPreviews();
        setProcessing(true); // mostra o botão Stop (e habilita steering)
        window.api.sendChat(t, imgs);
      }
      // ---------- autocomplete de @arquivos (estilo Claude Code) ----------
      const mentionPop = document.createElement('div');
      mentionPop.id = 'mentionPop';
      mentionPop.hidden = true;
      document.body.appendChild(mentionPop);
      let wsTree = null;
      let mItems = [];
      let mIdx = 0;
      let mStart = -1;

      async function getWsTree(force) {
        if (force || !wsTree) wsTree = (await window.api.getWorkspaceTree()) || [];
        return wsTree;
      }
      function curToken() {
        const v = input.value;
        const c = input.selectionStart;
        const m = /(^|\s)@([^\s@]*)$/.exec(v.slice(0, c));
        if (!m) return null;
        return { token: m[2], at: c - m[2].length - 1 };
      }
      function placePop() {
        const r = input.getBoundingClientRect();
        mentionPop.style.left = r.left + 'px';
        mentionPop.style.maxWidth = Math.max(220, r.width) + 'px';
        mentionPop.style.bottom = window.innerHeight - r.top + 6 + 'px';
      }
      function drawMentions() {
        mentionPop.innerHTML = '';
        mItems.forEach((f, i) => {
          const row = document.createElement('div');
          row.className = 'mrow' + (i === mIdx ? ' sel' : '');
          row.textContent = f;
          row.addEventListener('mousedown', (e) => {
            e.preventDefault();
            pickMention(i);
          });
          mentionPop.appendChild(row);
        });
        placePop();
        mentionPop.hidden = false;
        const sel = mentionPop.querySelector('.sel');
        if (sel) sel.scrollIntoView({ block: 'nearest' });
      }
      async function updateMentions() {
        const t = curToken();
        if (!t) {
          mentionPop.hidden = true;
          return;
        }
        const tree = await getWsTree(t.token === '');
        const q = t.token.toLowerCase();
        mItems = tree.filter((f) => f.toLowerCase().includes(q)).slice(0, 25);
        if (!mItems.length) {
          mentionPop.hidden = true;
          return;
        }
        mIdx = 0;
        mStart = t.at;
        drawMentions();
      }
      function pickMention(i) {
        const f = mItems[i];
        if (f == null) return;
        const v = input.value;
        const after = v.slice(input.selectionStart);
        const before = v.slice(0, mStart);
        const ins = '@' + f + ' ';
        input.value = before + ins + after;
        const pos = (before + ins).length;
        input.setSelectionRange(pos, pos);
        mentionPop.hidden = true;
        autoGrowInput();
        input.focus();
      }

      sendBtn.addEventListener('click', send);
      input.addEventListener('input', () => {
        autoGrowInput();
        updateMentions();
        updateSlash();
      });
      input.addEventListener('keydown', (e) => {
        if (!slashPop.hidden && sItems.length) {
          if (e.key === 'ArrowDown') { e.preventDefault(); sIdx = (sIdx + 1) % sItems.length; drawSlash(); return; }
          if (e.key === 'ArrowUp') { e.preventDefault(); sIdx = (sIdx - 1 + sItems.length) % sItems.length; drawSlash(); return; }
          if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickSlash(sIdx); return; }
          if (e.key === 'Escape') { e.preventDefault(); slashPop.hidden = true; return; }
        }
        if (!mentionPop.hidden && mItems.length) {
          if (e.key === 'ArrowDown') { e.preventDefault(); mIdx = (mIdx + 1) % mItems.length; drawMentions(); return; }
          if (e.key === 'ArrowUp') { e.preventDefault(); mIdx = (mIdx - 1 + mItems.length) % mItems.length; drawMentions(); return; }
          if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(mIdx); return; }
          if (e.key === 'Escape') { e.preventDefault(); mentionPop.hidden = true; return; }
        }
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault(); // Enter envia; Shift+Enter quebra linha
          send();
        }
      });
      document.addEventListener('click', (e) => {
        if (e.target !== input && !mentionPop.contains(e.target)) mentionPop.hidden = true;
        if (e.target !== input && !slashPop.contains(e.target)) slashPop.hidden = true;
      });

      // ---------- slash commands (/) ----------
      const slashPop = document.createElement('div');
      slashPop.id = 'slashPop';
      slashPop.hidden = true;
      document.body.appendChild(slashPop);
      let sItems = [];
      let sIdx = 0;

      function note(text) {
        clearEmpty();
        const d = document.createElement('div');
        d.className = 'msg tool';
        d.textContent = text;
        msgs.appendChild(d);
        scrollBottom();
      }
      const COMMANDS = [
        { cmd: 'nova', desc: 'Nova conversa', run: () => window.api.chatsNew() },
        { cmd: 'fork', desc: 'Forkar (novo chat mantendo o resumo)', run: () => window.api.forkChat() },
        { cmd: 'conversas', desc: 'Abrir lista de conversas', run: () => openList() },
        { cmd: 'ajustes', desc: 'Ajustes rápidos (modelo, perfil, permissões)', run: () => openQuick() },
        { cmd: 'imagem', desc: 'Gerar imagem: /imagem <descrição>', arg: true, run: (a) => window.api.sendChat('Gere uma imagem: ' + a, []) },
        { cmd: 'buscar', desc: 'Pesquisar na web: /buscar <consulta>', arg: true, run: (a) => window.api.sendChat('Pesquise na web e me responda: ' + a, []) },
        { cmd: 'tela', desc: 'Ver minha tela agora', run: () => window.api.sendChat('Veja minha tela e me diga o que está acontecendo.', []) },
        { cmd: 'claude', desc: 'Mostrar comandos, agentes e skills do Claude Code', run: () => showClaudeResources() },
        { cmd: 'ajuda', desc: 'Mostrar os comandos', run: () => showHelp() },
      ];
      let claudeCommands = [];
      let claudeAgents = [];
      let claudeSkills = [];
      function allCommands() {
        return usingClaudeCode ? COMMANDS.concat(claudeCommands) : COMMANDS;
      }
      function showClaudeResources() {
        if (!usingClaudeCode) {
          note('O Modo Claude Code não está ativo neste chat.');
          return;
        }
        const commands = claudeCommands.length ? claudeCommands.map((c) => '/' + c.cmd).join('  ·  ') : '(a sessão ainda não publicou comandos)';
        const agents = claudeAgents.length ? claudeAgents.map((a) => a.name).join(', ') : '(nenhum agente descoberto)';
        const skills = claudeSkills.length ? claudeSkills.join(', ') : '(nenhuma skill descoberta)';
        note('✦ Comandos Claude Code: ' + commands + '\nAgentes: ' + agents + '\nSkills: ' + skills);
      }
      function showHelp() {
        note('Comandos: ' + allCommands().map((c) => '/' + c.cmd).join('  ·  '));
      }
      function drawSlash() {
        slashPop.innerHTML = '';
        sItems.forEach((c, i) => {
          const row = document.createElement('div');
          row.className = 'mrow' + (i === sIdx ? ' sel' : '');
          row.append('/' + c.cmd);
          const desc = document.createElement('span');
          desc.className = 'mdesc';
          desc.textContent = (c.claude ? '✦ ' : '') + c.desc + (c.argumentHint ? ' ' + c.argumentHint : '');
          row.appendChild(desc);
          row.addEventListener('mousedown', (e) => {
            e.preventDefault();
            pickSlash(i);
          });
          slashPop.appendChild(row);
        });
        const r = input.getBoundingClientRect();
        slashPop.style.left = r.left + 'px';
        slashPop.style.maxWidth = Math.max(240, r.width) + 'px';
        slashPop.style.bottom = window.innerHeight - r.top + 6 + 'px';
        slashPop.hidden = false;
        const sel = slashPop.querySelector('.sel');
        if (sel) sel.scrollIntoView({ block: 'nearest' });
      }
      function updateSlash() {
        const m = /^\/([\w:-]*)$/.exec(input.value);
        if (!m) {
          slashPop.hidden = true;
          return;
        }
        const q = m[1].toLowerCase();
        sItems = allCommands().filter((c) => c.cmd.startsWith(q) || c.desc.toLowerCase().includes(q));
        if (!sItems.length) {
          slashPop.hidden = true;
          return;
        }
        sIdx = 0;
        drawSlash();
      }
      function pickSlash(i) {
        const c = sItems[i];
        if (!c) return;
        slashPop.hidden = true;
        if (c.claude) {
          input.value = '/' + c.cmd + (c.argumentHint ? ' ' : '');
          const p = input.value.length;
          input.setSelectionRange(p, p);
          input.focus();
          autoGrowInput();
        } else if (c.arg) {
          input.value = '/' + c.cmd + ' ';
          const p = input.value.length;
          input.setSelectionRange(p, p);
          input.focus();
          autoGrowInput();
        } else {
          input.value = '';
          autoGrowInput();
          c.run('');
        }
      }
      // executa um slash command digitado (no envio). Retorna true se tratou.
      function handleSlash(text) {
        const m = /^\/(\S+)\s*([\s\S]*)$/.exec(text);
        if (!m) return false;
        const c = COMMANDS.find((x) => x.cmd === m[1].toLowerCase());
        if (!c) return false;
        const args = (m[2] || '').trim();
        if (c.arg && !args) {
          note('Uso: /' + c.cmd + ' <texto>');
          return true;
        }
        c.run(args);
        return true;
      }
      function applyClaudeCapabilities(cap) {
        if (!cap) return;
        claudeCommands = [];
        const seen = new Set(COMMANDS.map((c) => c.cmd));
        (cap.commands || []).forEach((c) => {
          const names = [c.name].concat(c.aliases || []);
          names.forEach((name) => {
            const cmd = String(name || '').replace(/^\/+/, '').toLowerCase();
            if (!cmd || seen.has(cmd)) return;
            seen.add(cmd);
            claudeCommands.push({
              cmd,
              desc: c.description || 'Comando do Claude Code',
              argumentHint: c.argumentHint || '',
              claude: true,
            });
          });
        });
        claudeAgents = cap.agents || [];
        claudeSkills = cap.skills || [];
        if (!slashPop.hidden) updateSlash();
      }
      if (window.api.claudeCodeCapabilities) window.api.claudeCodeCapabilities().then(applyClaudeCapabilities);
      if (window.api.onClaudeCapabilities) window.api.onClaudeCapabilities(applyClaudeCapabilities);
    </script>
  <script>
      window.__lumiThemed = true;
    </script>
    <script src="theme.js"></script>
    <script src="_chrome.js"></script>
  </body>
</html>

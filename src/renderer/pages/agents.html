<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Agentes</title>
    <style>
      :root {
        --bg: #16161e; --surface: #24242f; --surface-2: #0f0f16;
        --accent: #7aa2ff; --accent-text: #fff; --text: #eee; --border: #2a2a38;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      .scroll { flex: 1; overflow-y: auto; padding: 16px; }
      h1 { margin: 0 0 4px; font-size: 16px; }
      .sub { font-size: 12px; color: #8a8a99; margin-bottom: 12px; line-height: 1.5; }
      .toprow {
        display: flex; align-items: center; gap: 10px; margin: 8px 0 14px;
        padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 10px;
      }
      .toprow input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; }
      .toprow label { font-size: 13px; color: var(--text); }
      .agent {
        background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
        padding: 12px; margin-bottom: 12px;
      }
      .ahead { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
      .ahead .aname { flex: 1; font-weight: 600; font-size: 14px; }
      .rm {
        flex: 0 0 auto; width: 30px; height: 30px; border: none; border-radius: 7px;
        background: #3a2030; color: #ff9b9b; cursor: pointer; font-size: 15px;
        display: flex; align-items: center; justify-content: center;
      }
      label { display: block; font-size: 11px; color: #9aa; margin: 9px 0 4px; text-transform: uppercase; }
      input[type="text"], input[type="number"], textarea {
        width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
        background: var(--surface-2); color: var(--text); font-size: 13px; font-family: inherit; outline: none;
      }
      textarea { min-height: 64px; resize: vertical; line-height: 1.4; }
      .grid2 { display: flex; gap: 10px; }
      .grid2 > div { flex: 1; }
      .tools {
        display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 4px;
      }
      .tools label {
        display: flex; align-items: center; gap: 7px; margin: 0; padding: 3px 0;
        font-size: 12px; color: var(--text); text-transform: none; cursor: pointer;
      }
      .tools input { width: 15px; height: 15px; accent-color: var(--accent); flex: 0 0 auto; }
      .tools .warn { grid-column: 1 / -1; font-size: 11px; color: #d9a; }
      button.primary, button.ghost {
        width: 100%; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      button.primary { border: none; background: var(--accent); color: var(--accent-text); margin-top: 4px; }
      button.ghost { border: 1px dashed var(--border); background: transparent; color: var(--text); margin-bottom: 14px; }
      #status { margin-top: 10px; font-size: 12px; text-align: center; min-height: 16px; }
      .ok { color: #7ee0a0; }
      .err { color: #ff9b9b; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-thumb { background: #33333f; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="scroll">
      <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;vertical-align:-3px;margin-right:6px"><rect width="18" height="10" x="3" y="11" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" x2="8" y1="16" y2="16"/><line x1="16" x2="16" y1="16" y2="16"/></svg>Multi-agentes</h1>
      <div class="sub">
        A Lumi pode <b>delegar tarefas</b> a agentes especializados. Crie sua equipe abaixo — cada um com
        sua personalidade e as ferramentas que pode usar. 🤖
      </div>

      <div class="toprow">
        <input type="checkbox" id="enabled" />
        <label for="enabled">Ativar multi-agentes (a Lumi passa a delegar tarefas para a equipe)</label>
      </div>

      <div id="agents"></div>
      <button class="ghost" id="add">+ Adicionar agente</button>
      <button class="ghost" id="restore" style="margin-top: 6px">↺ Restaurar equipe padrão</button>
      <button class="primary" id="save">💾 Salvar equipe</button>
      <div id="status"></div>
    </div>

    <script>
      window.__lumiThemed = true;
    </script>
    <script src="theme.js"></script>
    <script src="_chrome.js"></script>
    <script>
      // ferramentas disponíveis (nome técnico -> rótulo amigável)
      const TOOLS = [
        ['web_search', 'Pesquisar na web'],
        ['fetch_url', 'Ler páginas da web'],
        ['http_request', 'Chamar APIs (HTTP)'],
        ['see_page', 'Ver página renderizada'],
        ['view_image', 'Ver imagens do projeto'],
        ['open_url', 'Abrir links'],
        ['list_dir', 'Listar pastas'],
        ['read_file', 'Ler arquivos'],
        ['write_file', 'Criar/editar arquivos'],
        ['edit_file', 'Editar trecho (cirúrgico)'],
        ['grep_files', 'Buscar nos arquivos'],
        ['git_status', 'Git: status'],
        ['git_diff', 'Git: ver diff'],
        ['git_log', 'Git: histórico'],
        ['run_tests', 'Rodar testes (focado)'],
        ['locate_stack', 'Achar erro pela stack'],
        ['apply_patch', 'Aplicar patch (multi-arquivo)'],
        ['get_problems', 'Checar erros (lint/tipos)'],
        ['generate_project_doc', 'Gerar CLAUDE.md'],
        ['append_file', 'Adicionar a arquivos'],
        ['make_dir', 'Criar pastas'],
        ['delete_file', 'Apagar arquivos'],
        ['run_command', 'Rodar comandos'],
        ['run_in_terminal', 'Terminal (proc. longos)'],
        ['read_terminal', 'Ler terminal'],
        ['list_terminals', 'Listar terminais'],
        ['kill_terminal', 'Fechar terminal'],
        ['generate_image', 'Gerar imagens'],
        ['see_screen', 'Ver a tela'],
        ['read_clipboard', 'Ler área de transferência'],
        ['write_clipboard', 'Escrever na área de transferência'],
        ['connect_remote', 'Conectar em servidor SSH'],
        ['list_ssh_hosts', 'Listar servidores SSH'],
        ['project_overview', 'Entender o projeto'],
        ['find_in_code', 'Achar no código'],
        ['get_datetime', 'Ver data/hora'],
        ['remember_fact', 'Memorizar fatos'],
        ['recall_facts', 'Lembrar fatos'],
        ['read_project_memory', 'Ler memória do projeto'],
        ['update_project_memory', 'Salvar memória do projeto'],
        ['play_animation', 'Reagir (animação)'],
        ['ask_user', 'Perguntar ao usuário'],
      ];
      const agentsEl = document.getElementById('agents');
      const statusEl = document.getElementById('status');

      function el(tag, props, children) {
        const e = Object.assign(document.createElement(tag), props || {});
        (children || []).forEach((c) => e.appendChild(c));
        return e;
      }

      function makeCard(a) {
        a = a || {};
        const aname = el('input', { type: 'text', className: 'aname', placeholder: 'Nome (ex.: Tradutor)', value: a.name || '' });
        const rm = el('button', { className: 'rm', title: 'Remover', textContent: '✕' });
        rm.addEventListener('click', () => card.remove());

        const adesc = el('input', { type: 'text', className: 'adesc', placeholder: 'O que ele faz (resumo curto)', value: a.description || '' });
        const aprompt = el('textarea', { className: 'aprompt', placeholder: 'Instruções/personalidade do agente...' });
        aprompt.value = a.systemPrompt || '';
        const amodel = el('input', { type: 'text', className: 'amodel', placeholder: 'vazio = mesmo modelo do chat', value: a.model || '' });
        const atemp = el('input', { type: 'number', className: 'atemp', min: '0', max: '2', step: '0.1', value: a.temperature != null ? a.temperature : 0.5 });

        // ferramentas (checkboxes)
        const sel = new Set(Array.isArray(a.tools) ? a.tools : []);
        const toolsBox = el('div', { className: 'tools' });
        TOOLS.forEach(([name, label]) => {
          const cb = el('input', { type: 'checkbox' });
          cb.dataset.tool = name;
          cb.checked = sel.has(name);
          toolsBox.appendChild(el('label', {}, [cb, document.createTextNode(label)]));
        });

        const card = el('div', { className: 'agent' }, [
          el('div', { className: 'ahead' }, [aname, rm]),
          mklabel('Descrição'), adesc,
          mklabel('Instruções (personalidade do agente)'), aprompt,
          el('div', { className: 'grid2' }, [
            el('div', {}, [mklabel('Modelo'), amodel]),
            el('div', {}, [mklabel('Criatividade'), atemp]),
          ]),
          mklabel('Ferramentas que pode usar'), toolsBox,
        ]);
        return card;
      }
      function mklabel(t) { return el('label', { textContent: t }); }

      function collect() {
        return [...agentsEl.querySelectorAll('.agent')]
          .map((c) => ({
            name: c.querySelector('.aname').value.trim(),
            description: c.querySelector('.adesc').value.trim(),
            systemPrompt: c.querySelector('.aprompt').value,
            model: c.querySelector('.amodel').value.trim(),
            temperature: parseFloat(c.querySelector('.atemp').value) || 0.5,
            tools: [...c.querySelectorAll('.tools input:checked')].map((x) => x.dataset.tool),
          }))
          .filter((a) => a.name);
      }

      function render(list) {
        agentsEl.innerHTML = '';
        (list || []).forEach((a) => agentsEl.appendChild(makeCard(a)));
      }

      document.getElementById('add').addEventListener('click', () => {
        agentsEl.appendChild(makeCard({ temperature: 0.5, tools: [] }));
        agentsEl.lastChild.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

      document.getElementById('restore').addEventListener('click', async () => {
        const def = await window.api.getDefaultAgents();
        render(def || []);
        statusEl.innerHTML = '<span class="ok">Equipe padrão carregada (Pesquisador, Programador, Revisor, Testador, Refatorador, Designer). Clique em Salvar para confirmar.</span>';
      });

      document.getElementById('save').addEventListener('click', async () => {
        const list = collect();
        await window.api.setConfig({ agents: list, agentsEnabled: document.getElementById('enabled').checked });
        statusEl.innerHTML =
          '<span class="ok">✓ Salvo! ' + list.length + ' agente(s) · multi-agentes ' +
          (document.getElementById('enabled').checked ? 'ATIVADO' : 'desligado') + '.</span>';
      });

      window.api.getConfig().then((c) => {
        document.getElementById('enabled').checked = !!c.agentsEnabled;
        render(c.agents || []);
      });
    </script>
  </body>
</html>
